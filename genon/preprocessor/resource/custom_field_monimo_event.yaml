# JSON 레코드 → 목표필드 직접 매핑 (monimo 이벤트 데모)
#
# 사용 (parser_processor_config.yaml):
#   enrichment:
#     - custom_fields:
#         enable: true
#         doc_type: monimo_event
#         extractor: json_mapping
#         config_file: custom_field_monimo_event.yaml
#
# 이 파일은 parser_processor_config.yaml 과 동일 폴더(resource/)에 위치.
# custom_field_faq.yaml(엑셀 행 매핑)의 JSON 대응판이다 — 레코드 1건이 청크 1개가 되고
# 목표필드가 그 청크의 metadata 로 실린다. 요청 kwargs 로 doc_type 이 일치할 때만 적용된다.
#
# ★ 이 파일 하나로 자족한다 — 별도 프롬프트 md 나 LLM config yaml 이 필요 없다.
#   요약 생성에 쓰는 LLM 연결/프롬프트까지 아래 llm_fields 안에 인라인되어 있다.
#   (프롬프트가 길거나 여러 doc_type 이 공유한다면 llm_fields 항목에 config_file 을 대신 써도 된다
#    — custom_field_card.yaml 과 같은 방식. 두 방식은 같은 코드 경로로 처리된다.)
#
# 입력 예시:
#   {"eventList": [{"ID": "CM26061182", "회사명": "모니모", "제목": "...",
#                   "이벤트 시작일": "26.07.01", "이벤트 종료일": "26.07.31",
#                   "wcmsHtml": {"htmlText": "<div>이벤트 상세 …</div>"}}]}

# ── 레코드 배열이 담긴 key. 키 이름만 쓴다(임의 깊이 재귀 매칭). 생략 시 payload 전체가 1건 ──
records: eventList

# ── 목표필드: [허용 소스 key 별칭 목록] ─────────────────────────────────────
# 목표필드명 자체도 자동 별칭으로 포함된다. 비교 시 Unicode/BOM/공백/대소문자/_,-,. 차이를 정규화한다.
# 값은 레코드 안 임의 깊이에서 찾되 얕은 쪽이 우선한다(wcmsHtml.htmlText → htmlText 한 단어로 매칭).
key_map:
  EVENT_ID:    [ID, 이벤트ID]
  TITLE:       [제목, title]                      # 대표 제목 (NOT NULL)
  EVENT_FROM:  [이벤트 시작일, 시작일, startDate]
  EVENT_TO:    [이벤트 종료일, 종료일, endDate]    # 기간 게이트용
  DETAIL_HTML: [htmlText, 상세내용]                # 상세내용 원문 HTML
                                                  # ⚠️ 원문 그대로 청크 metadata 에 실린다. 상세가
                                                  # 수십~수백 KB 면 청크 payload 도 그만큼 커지므로,
                                                  # 적재 측에서 별도 컬럼으로 받는지 확인할 것.
  COMPANY:     [회사명]
  KEYWORD:     [키워드]

# ── 필수 목표필드. 값이 없는 레코드는 그 건만 skip 하고 건수를 경고로 남긴다 ──
required:
  - TITLE

# ── 대응 소스가 없어도 null 로 명시 출력할 필드 (스키마 고정) ─────────────────
nulls:
  - EVENT_ID

# ── 대응 소스가 없을 때 채울 기본값 ─────────────────────────────────────────
defaults: {}

# ── 값 변환 (field_transforms.VALUE_TRANSFORMS 에 등록된 이름) ───────────────
# date_int_flex: "26.07.01" / "2026-07-01" 모두 20260701 정수로. 파싱 실패 시 0.
transforms:
  EVENT_FROM: date_int_flex
  EVENT_TO:   date_int_flex

# ── HTML 필드 → 평문 파생 필드 (LLM 입력용) ─────────────────────────────────
# 파싱 경로와 같은 정리 규칙(html_flatten)을 쓴다 — aria-hidden/접힌 약관 텍스트는 보존.
html_text_fields:
  DETAIL_TEXT: DETAIL_HTML

# ── JSON 에 없는 필드를 LLM 으로 생성 ───────────────────────────────────────
# 레코드마다 1회 호출한다. input_fields/concurrency/on_error 를 뺀 나머지 키는 그대로
# CustomFieldsEnricher 생성자로 넘어간다(= custom_field_card.yaml 의 키들과 동일한 스키마).
llm_fields:
  - # 무엇을 만들 것인가
    output_fields: [CONTENT_HASH]        # 요약본문 (임베딩 입력)
    input_fields: [TITLE, DETAIL_TEXT]   # 프롬프트 {{raw_text}} 로 들어갈 필드(순서대로 결합)
    concurrency: 4                       # 레코드 동시 호출 상한
    on_error: null                       # null(필드를 null 로 두고 진행) | skip_record

    # ── LLM 연결 ────────────────────────────────────────────────────────────
    # <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
    url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
    api_key: ""
    model: model

    # ── LLM 생성 파라미터 ───────────────────────────────────────────────────
    # 요약본문이 임베딩 입력이므로 과도하게 길지 않게 잡는다.
    max_tokens: 1000
    temperature: 0.0
    timeout: 120

    # ── 응답 파싱 ───────────────────────────────────────────────────────────
    parser:
      type: json

    # ── 프롬프트 ────────────────────────────────────────────────────────────
    # output_fields 와 프롬프트가 내놓는 JSON 키(CONTENT_HASH)는 반드시 같아야 한다.
    # 어긋나면 에러 없이 값이 비어서 나온다.
    system_prompt: |
      너는 이벤트 안내문 요약 전문가다. 주어진 이벤트 상세 내용을 검색용 임베딩에 넣을 요약본문으로 압축한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 `CONTENT_HASH` 하나다. 값은 요약본문 문자열이다.
      - 원문에 없는 정보를 지어내지 않는다(환각 금지).
      - 요약본문에는 이용자가 검색할 만한 표현을 남긴다: 이벤트 제목, 대상 브랜드·제휴사, 혜택 종류와 금액/비율,
        응모·참여 방법, 기간 조건. 배너 문구·버튼 라벨·법적 고지 상용구는 제외한다.
      - 문장형 한국어로 3~6문장, 800자 이내로 쓴다. 불릿·머리기호를 쓰지 않는다.
      - 상세 내용이 비어 있거나 요약할 내용이 없으면 값을 null 로 둔다.

      출력 예시 형식(값은 예시):
      {"CONTENT_HASH": "무신사 블랙 프라이데이 기간 동안 모니모 카드로 결제하면 …"}

    user_prompt: |
      아래 이벤트 정보를 검색용 요약본문으로 압축하라.

      - CONTENT_HASH (요약본문) — 필수

      반드시 `CONTENT_HASH` 키 하나를 가진 JSON 객체로만 반환하라.

      <event>
      {{raw_text}}
      </event>

# ── 청크 text 본문 구성 순서 (개행 결합) ─────────────────────────────────────
# 상세 원문 HTML 은 DETAIL_HTML metadata 로만 싣고, 임베딩 입력은 요약본문만 쓴다.
text_fields:
  - CONTENT_HASH

# ── 레코드 본문이 chunk_size 를 넘으면 여러 청크로 나눈다(metadata 는 조각마다 동일) ──
split: true

# ── records 키를 찾지 못했을 때: error(기본, 즉시 실패) | skip(경고 후 0건) ──
missing_policy: error
