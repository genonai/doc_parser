# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — Excel/CSV 행별 매핑 (source.kind: rows)
#
#  언제 쓰나 : 원천이 xlsx/xlsm/csv 이고 **한 행이 검색 결과 한 건**일 때
#              (FAQ 목록, 용어사전, 메뉴 목록, 고객센터 항목 …)
#  결과      : 행 1개 = 청크 1개(element category=`custom_fields_row`). 아래 목표필드가 그
#              청크의 metadata 로 실린다. `body.split: true` 를 켜면 chunk_size 를 넘는 행만
#              여러 청크로 나뉜다.
#  LLM 호출  : 없음. 원천에 없는 필드가 필요할 때만 맨 아래 `llm` 을 쓴다(llm 항목마다 행 1건당
#              1회. 필드 추출 기준이며, 공통 설정에서 켠 표 설명 호출은 별도다).
#  실행 경로 : 행 매핑은 모든 경로에서 동작한다. `llm` 블록만 parser 경로 전용이다.
#  다른 kind : records(JSON 배열 한 요소) · sections(대상 하나를 설명한 중첩 JSON)
#              · document(문서 1건에서 LLM 으로 추출) · html(마크업이 값을 지목한 HTML)
#
#  ── 쓰는 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 설정 폴더에 custom_field_<유형>.yaml 로 복사한다(표준 유형은 genon/preprocessor/
#     resource/, 사이트 전용 유형은 genon/sites/<site>/resource/ — 맨 아래 "배포" 참고).
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다
#     (없으면 기동이 실패한다).
#  ③ 같은 폴더의 parse_config.yaml 의 enrichment 목록에 등록한다.
#        - custom_fields:
#            enable: true
#            doc_type: <유형>            # 요청 params 의 doc_type 과 같은 값
#            config_file: custom_field_<유형>.yaml   # 파일명만. 이 등록 블록이 있는 프로세서
#                                                    # 설정 yaml 과 같은 폴더 기준
#     extractor 는 적지 않는다(`source.kind: rows` 에서 `tabular_mapping` 으로 정해진다).
#  ④ 맨 아래 "확인 방법" 으로 실제 원천 파일의 결과를 확인한다.
#
#  ── 이 kind 고유 주의 ────────────────────────────────────────────────────
#  · 헤더 행은 자동 판정한다. 헤더 위의 제목행·안내행·빈 행은 건너뛴다. 판정이 틀릴 때만
#    프로세서 설정의 `formats.xlsx.tabular.header_row` 로 강제한다(그 설정을 쓰는 모든 엑셀에 적용된다).
#  · 한 파일에 스키마가 다른 표가 여럿 오면 이 설정을 **표마다 하나씩** 만들어 같은 doc_type
#    으로 등록한다. 각 설정은 자기 `require.fields` 컬럼이 있는 표만 맡고 나머지는 건너뛴다.
#    설정이 하나뿐이면 필수 컬럼이 없는 표에서 요청이 실패한다. 어느 설정도 맡지 않은 표가
#    있으면 경고가 남는다.
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: rows

  # ── [선택] 여러 행에 걸쳐 쪼개진 값을 한 레코드로 접기 ────────────────────
  # 원천이 값 하나(주로 JSON 문자열)를 여러 행에 나눠 보내는 스키마에만 쓴다. 없으면
  # 행 1개 = 레코드 1개다. group_by 가 같은 행은 떨어져 있어도 한 묶음으로 접는다.
  # 이름은 원천 헤더가 아니라 목표필드명으로 적는다. 병합은 값 변환보다 먼저 처리된다.
  # merge_rows:
  #   group_by:  [<TARGET_FIELD_1>]   # 이 값이 같은 행이 한 묶음
  #   part_by:   <TARGET_FIELD_4>     # 선택. 묶음 안의 문서 경계(예: 등록번호). 문서가 둘 이상이면
  #                                   #   모두 JSON 일 때 [문서1,문서2] 배열로, 아니면 개행으로 합친다
  #   order_by:  <TARGET_FIELD_2>     # 문서 안 정렬 기준(숫자 우선, 미지정 시 원본 순서)
  #   concat:    [<TARGET_FIELD_3>]   # 순서대로 이어붙일 필드
  #   separator: ""                   # 기본값. 문자 단위로 잘려 온다면 반드시 빈 문자열로 둔다

# ── [필수] 필드 — 한 필드의 규칙을 한 자리에 모은다 ─────────────────────────
# 왼쪽 = 만들 목표필드명. 적재 DB 컬럼명(대문자)으로 쓴다. 소문자 예약 이름(text·title·
# n_char·i_page·created_date·appendix …)과 한글·공백·기호가 든 이름은 기동이 실패한다.
# 값은 항상 object 다. `<TARGET>:` 처럼 값을 빠뜨리거나 문자열로 적으면 기동이 실패한다.
# 한 필드에 아래 키를 여러 개 함께 쓸 수 있다.
#
#   alias      : 그 값이 든 **엑셀 헤더 이름들**. 원천 표기가 흔들려도 잡히게 여러 개 나열한다.
#                목표필드명도 맨 앞 별칭으로 자동 포함된다(alias 키를 적은 필드에만).
#                정확히 같은 헤더를 먼저 찾고, 없을 때만 대소문자·공백·`_-./`·전각/반각
#                차이를 무시하고 찾는다. 각 단계 안에서는 앞에 적은 별칭이 우선한다.
#                `sheet_name`(시트 이름)과 `title`(표 블록 제목)도 별칭으로 쓸 수 있다 —
#                시트마다 구분값을 셀에 넣지 않고 시트 이름으로만 보내는 원천용이다. 같은
#                이름의 실제 컬럼이 있으면 컬럼이 우선한다.
#                같은 헤더를 두 필드에 붙여도 된다(원본과 변환 사본을 따로 만들 때. 아래 예시).
#                셀 문자열 값은 양끝 공백을 제거한다(내부 공백은 유지한다).
#                파일명 원천 `alias: [$file]` 은 이 kind 에서 쓸 수 없다(기동 실패).
#   const      : 원천 값이 있어도 덮어쓴다(파일 단위로 고정인 값).
#   default    : 원천 값이 None·"" 일 때만 채운다. alias 와 함께 쓰면 "원천에 있으면 원천값,
#                없으면 이 값"이다. `default: null` 은 값이 없어도 적재 컬럼을 null 로 출력한다.
#   values     : **값**의 표기 흔들림을 표준 코드로 접는다. `표준값: [별칭…]` 형태다.
#                표준값 자신도 자동 별칭이라 이미 코드로 오는 원천은 그대로 통과한다.
#                비교는 대소문자·공백·`_-./` 차이를 무시한다.
#                매핑표에 없는 값은 **원값을 그대로 두고 경고만** 남긴다. 표준 코드가 아닌 값을
#                적재하지 않으려면 `filter` 에 `{field: <목표>, in: [<표준값> …]}` 를 함께 건다.
#                별칭에 영문 `yes`/`no`/`on`/`off` 를 쓸 때는 따옴표로 감싼다. YAML 이 불리언으로
#                해석하므로 원천의 "yes" 와 일치하지 않는다(`Y`/`N` 은 그대로다).
#   transform  : 값 변환. 이름 하나 또는 목록(순서대로 적용). 아래 [변환기] 참고.
#   template   : 여러 필드를 합쳐 새 필드를 만든다. `{{목표필드}}` 를 값으로 채우고, 값이 없는
#                자리표시자만 지운다(구분자는 남는다: L2 가 비면 `"{{L1}} > {{L2}}"` → `보험 >`).
#                같은 필드의 transform 은 합친 결과에 적용되므로 구분자는 이것으로 정리한다:
#                `[{name: regex_sub, pattern: '(\s*>\s*)+', repl: ' > '}, {name: regex_sub, pattern: '^\s*>\s*|\s*>\s*$'}]`
#   pack       : 여러 필드를 **JSON 객체 한 칸**에 담는다. `[FIELD_A, FIELD_B]` →
#                `{"FIELD_A": ..., "FIELD_B": ...}` 문자열. 값이 없는 키도 null 로 남고 묶은
#                필드는 그대로 남는다. 산출이 이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다.
#                `llm.out` 필드도 묶을 수 있다(맨 뒤에 묶는다). 본문 키(body.fields·repeat)에는
#                쓸 수 없다(기동 실패).
#   meta       : 청크 메타(적재 컬럼)에 실을지. 기본 true. template·pack 재료나 filter·require
#                조건으로만 쓰는 중간 필드에 `meta: false` 를 적는다. 값은 그대로 만들어지므로
#                본문·파생·선별에는 쓰이고, 적재 컬럼에서만 빠진다.
#   seq        : 원천에 **항목 번호가 없을 때** 번호를 만든다.
#                `{prefix: "FAQ-", width: 4, start: 1}` → FAQ-0001, FAQ-0002 …
#                접두도 자리수도 없으면(`{}`) 정수 1, 2, 3 … 으로 나간다.
#                filter/require 를 통과한 행에만 매기며 시트 경계를 넘어 이어진다(문서 1건 안에서만 유일).
#
# [변환기] 목록으로 쓰면 순서대로 적용된다. 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       날짜 → YYYYMMDD 정수. "2026-07-01"·"26.07.01"·"260701"·"20260701" 을 받고,
#                  문자열 "2026" 은 20260101 이다(숫자 2026 은 2026 그대로). 인자 on_error(기본 0).
#                    빈 값(None·""·공백·문자열 "None") → 항상 0 (on_error 와 무관)
#                    해석 실패("진행중" 등) → on_error
#                    정상 → 20260701
#   normalize      NFKC → 양끝 공백 제거 → 연속 공백 한 칸 → 소문자화(중복 판정 키용).
#                  표시용 값에는 쓰지 않는다(영문이 소문자가 된다).
#   to_text        JSON·HTML·평문을 자동 판별해 평문화한다. JSON → 마크다운 헤딩, 구조 HTML →
#                  표·목록을 살린 평문, 인라인 태그뿐이면 태그만 제거. 표시·검색용 본문에 쓴다.
#   regex_sub      pattern, repl=""                  정규식 치환  "18,000원" → "18000"
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 매칭이 없으면 on_error, 빈 값은 그대로
#   to_int         on_error=null                     정수 하나로  "18,000원" → 18000. 소수이거나
#                                                    숫자 덩어리가 둘 이상이면 on_error
#   hash           length=16, prefix=""              SHA-1 16진 코드로 줄인다(같은 값이면 같은 코드)
#   truncate       length, suffix=""                 길이 자르기(적재 컬럼 길이 맞추기)
#   to_json        on_scalar=wrap|drop, key="value"  값 하나를 유효한 JSON 문자열로 맞춘다(적재 DB 의
#                                                    JSON 컬럼용). 스칼라는 {key: 값} 으로 감싸고
#                                                    drop 이면 null. 빈 값·깨진 JSON 은 null.
#                                                    체인 맨 뒤 전용이며, 이 필드는 본문 키와
#                                                    pack 재료에 쓸 수 없다(기동 실패)
#   모르는 이름·빠진 인자·컴파일되지 않는 정규식은 기동이 실패한다.
#
# [날짜 레시피]
#   빈 값을 null 로(0 을 null 로 바꾸고 정수 타입을 되살린다):
#     transform: [date_int, {name: regex_extract, pattern: '^([1-9]\d{7})$'}, to_int]
#   종료일 없음·"진행중"을 99991231 로(default 가 빈 값을, on_error 가 해석 실패를 채운다):
#     default: 99991231  +  transform: {name: date_int, on_error: 99991231}
fields:
  <TARGET_FIELD_1>:
    alias: [<엑셀 헤더>, <다른 표기>]
  <TARGET_FIELD_2>:
    alias: [<엑셀 헤더>]
    transform: date_int

  # 아래 예시의 왼쪽 <...> 는 목표필드명, 오른쪽은 원천 헤더의 예다.
  # <SEARCHABLE_YN>:
  #   alias:   [노출여부]
  #   values:  {"Y": [노출, 사용], "N": [미노출, 미사용]}
  #   default: "N"
  #
  # <GROUP_C>:  {const: "<고정값>"}
  # <BIZ_ID>:   {alias: [ID], default: null}       # 원천에 없으면 null 로라도 출력
  # <FEE_AMT>:
  #   alias: [연회비]
  #   transform:
  #     - {name: regex_sub, pattern: "[^0-9]", repl: ""}
  #     - {name: to_int}
  # 같은 헤더를 두 필드에 붙여 원본과 사본을 함께 만든다(원본은 적재 컬럼, 사본은 본문용).
  # <TERM>:        {alias: [용어]}
  # <TERM_NORM>:   {alias: [용어], transform: normalize}
  # <DETAIL_DESC>: {alias: [세부내용]}
  # <DETAIL_TEXT>: {alias: [세부내용], transform: to_text}
  #   · merge_rows 를 쓰면 두 필드를 모두 concat 에 넣는다(병합이 변환보다 먼저다).
  # <DISPLAY_NM>:  {template: "{{<TARGET_FIELD_1>}} {{<TARGET_FIELD_2>}}"}
  # <ROW_NO>:      {seq: {prefix: "FAQ-", width: 4}}   # FAQ-0001, FAQ-0002 …
  # <DETAIL_JSON>: {pack: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]}

# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   alias 매핑 → 완전 중복 행 제거(시트 안에서 모든 컬럼이 같은 행은 첫 행만 남긴다)
#   → (merge_rows 병합) → default → const → values → transform → template
#   → filter → require 검사 → seq → llm → pack
# · default 다음에 const 가 덮어쓰므로 둘 다 적으면 const 가 우선한다.
# · default 값도 values·transform 을 거친다. 앞에 regex_extract 를 두면 그 패턴이 default 값에도
#   맞아야 한다(맞지 않으면 default 가 지워진다).
# · llm 산출에는 values·transform·template 이 적용되지 않는다(그보다 뒤에 채워진다).
#   pack 만 llm 뒤에 다시 적용된다.
# · filter/require 는 pack 산출을 조건으로 쓸 수 없다(기동 실패). 묶기 전 필드를 쓴다.

# ── [선택] 필수 목표필드 ────────────────────────────────────────────────────
# 요청 시점에 두 단계로 검사한다.
#   · 여기 적은 필드의 alias 헤더가 **표에 아예 없으면** → 그 요청이 실패한다(원천 스키마가
#     바뀐 것으로 본다). 같은 doc_type 에 설정이 여럿이면 실패하지 않고 그 표를 건너뛴다.
#     default 를 선언한 필드와 sheet_name·title 로 값이 정해지는 필드는 이 검사에서 빠진다.
#     const 만으로는 빠지지 않는다.
#   · 컬럼은 있는데 **행의 최종 값이 비었으면** → 그 행만 건너뛰고 건수를 경고로 남긴다.
# `llm` 이 만드는 필드는 적을 수 없다(기동 실패 — 필수값 검사가 LLM 호출보다 먼저다).
# require:
#   fields: [<TARGET_FIELD_1>]

# ── [선택] 값 기반 레코드 필터 ──────────────────────────────────────────────
# `require` 는 빈 값만 거른다. "삭제여부가 Y 인 건은 뺀다" 같은 조건은 이 블록으로 쓴다.
# 조건은 모두 만족해야 하며(AND), 비교는 `values` 와 같은 규칙이다(values 적용 뒤의 값을 본다).
# 필터로 빠진 건은 info 로 건수만 남는다.
# filter:
#   - {field: <DEL_YN>, not_in: [Y]}
#   - {field: <STATUS>, in: [ACTIVE, PENDING]}

# ── [필수] 청크 본문 ────────────────────────────────────────────────────────
# fields : 본문을 구성할 필드(선언 순서대로 개행 결합). 이 값이 임베딩 입력이 된다.
#          어디에서도 만들지 않는 필드를 적으면 그 부분이 빠진 채 청크가 나간다(기동 시 경고만
#          남는다). `llm` 을 주석 처리하고 그 출력 필드를 여기 남겨 두는 실수가 가장 흔하다.
#          이 항목을 생략하면 그 행의 모든 셀 값을 개행으로 이어붙인 값이 본문이 된다.
# labels : 본문 필드를 `항목명: 값` 으로 낸다(`질문: 가입은 어떻게 하나요?`).
#          사람이 검색어로 쓰는 말을 적는다(목표필드명은 검색어에 나오지 않는다).
#          미지정 시 alias 첫 값을 항목명으로 쓰고, alias 가 없는 필드(const·template·llm
#          산출)는 값만 낸다. 여기 적은 이름은 여러 줄 값에도 붙는다(`항목명:` 을 한 줄로
#          앞세우고 값은 다음 줄부터). alias 첫 값으로 대신한 이름은 여러 줄 값에 붙지 않는다.
# split  : true 면 행 본문이 chunk_size 를 넘을 때 여러 청크로 나눈다(metadata 는 조각마다 동일).
#          chunk_size 는 청커 설정의 `chunk_size`(표준 1500자) 또는 요청 chunk_size 다.
#          미지정(기본 false) = 행 1개가 항상 청크 1개. 이 경로에는 1024 하한이 없고, 조각 사이는
#          청커 설정 `recursive.chunk_overlap`(기본 100자)만큼 겹친다.
# repeat : 분할된 모든 청크 앞에 반복할 식별 필드. `split: true` 일 때만 유효하다.
#          접두 필드는 본문 맨 앞으로 이동하며 fields 에서는 빠진다(중복 방지). fields 선두
#          필드를 지정해야 본문 순서가 바뀌지 않는다. 접두도 chunk_size 에 포함되며, repeat 에
#          넣지 않은 필드의 항목명은 첫 조각에만 나온다.
body:
  fields: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]
  # labels:
  #   <TARGET_FIELD_1>: <항목명>
  # split: true
  # repeat: [<TARGET_FIELD_1>]      # 예: MENU_NM, TERM, QUESTION

# ── [선택] 원천에 없는 필드를 행마다 LLM 으로 생성 ──────────────────────────
# llm 항목마다 남은 행 1건당 1회 호출한다. 행이 많으면 비용·시간이 그만큼 늘어난다.
# parser 경로에서만 실행된다(다른 경로에서는 기동 시 경고가 남고 이 필드가 빈다).
# 쓰기로 했다면 `out` 과 `in` 은 둘 다 필수다(비우면 기동 실패). `scope` 는 적지 않는다.
# out 의 이름은 프롬프트가 내놓는 JSON 키와 **정확히 같아야** 한다. 어긋나면 오류 없이 null 이다.
# out 필드는 `fields` 에 따로 선언하지 않고 body.fields·labels·pack 에 그대로 쓸 수 있다.
# out 은 값 타입을 강제하지 않는다. 모델이 객체를 주면 본문에 `- 키: 값` 목록으로 실리므로,
# 문자열이 필요하면 프롬프트에 형식을 지시한다.
# llm:
#   - out: [<GENERATED_FIELD>]              # 만들 필드
#     in:  [<TARGET_FIELD_1>]               # 프롬프트 {{raw_text}} 로 넣을 필드(선언 순서대로 결합)
#     concurrency: 4                        # 행 동시 호출 상한(기본 4)
#     on_error: null                        # null(해당 필드만 null 로 두고 진행) | skip_record
#     parser: {type: json}                  # 응답에서 JSON 객체를 찾아 dict 로
#
#     # 접속 정보는 프로세서 설정 최상위 model_presets 에 두고 여기서는 이름만 부른다.
#     # 이 항목만 다른 모델을 쓰려면 url/api_key/model 을 직접 적는다(직접 적은 값이 우선한다).
#     endpoint:
#       model_preset: default
#     params:                               # top_p·seed·repetition_penalty·headers 도 쓸 수 있다.
#                                           # 공급자 전용 값은 하위 `params:` 매핑에(위 값보다 우선)
#       max_tokens: 800
#       temperature: 0.0
#       timeout: 60
#
#     # 프롬프트를 별도 파일로 두려면 system_file / user_file 에 경로를 쓴다(이 yaml 과 같은 폴더 기준).
#     prompt:
#       system: |
#         <역할>. 반드시 하나의 JSON 객체만 반환한다. 설명 문구·코드펜스 없이 순수 JSON 만 출력한다.
#         키는 `<GENERATED_FIELD>` 하나다.
#         원문에 없는 내용을 지어내지 않는다(환각 금지). 만들 것이 없으면 값을 null 로 둔다.
#
#         출력 예시 형식(값은 예시):
#         {"<GENERATED_FIELD>": "<예시 값>"}
#       user: |
#         <지시문>
#
#         반드시 `<GENERATED_FIELD>` 키를 가진 JSON 객체로만 반환하라.
#
#         <item>
#         {{raw_text}}
#         </item>

# ── [선택] 표 설명(table_text_description)을 이 문서유형에서만 바꾼다 ────────
# **최상위 키**다. 프로세서 설정의 공통 `table_text_description` 이 기본이고, 여기 적은 키만
# 덮어쓴다(rag 하위도 키 단위 병합). 행 본문 안의 <table> 에도 표 설명이 붙는다.
# enable·입력 예산·overflow_policy 예시는 custom_field_TEMPLATE_document.yaml 의 같은 블록에 있다.
# table_text_description:
#   rag:
#     key_fact_limit: 5

# ═══════════════════════════════════════════════════════════════════════════
#  기동 시 자동 검사
#
#  실패시킨다: 이 kind 가 읽지 않는 키(오타는 가까운 이름을, 다른 kind 의 키는 어디 전용인지
#  알려준다), object 가 아닌 필드 값, 예약 이름·규칙 위반 목표필드명, 모르는 변환기·잘못된
#  정규식, 아무도 만들지 않는 필드를 가리키는 template·filter·body.repeat, require 의 llm 필드,
#  seq 이름 충돌·모르는 옵션.
#    rows 가 읽지 않는 대표 키: body.once · body.mirror_to · 필드의 collect · raw · alias [$file]
#                               · source.records_at · source.sections · source.ignore_keys
#  경고만 남긴다: body.fields·body.labels 가 아무도 만들지 않는 필드를 가리킬 때.
#  못 잡는다: alias 가 원천 헤더와 어긋나 값이 비는 경우, `source.pre` 를 적은 경우(무시된다).
#
#  오류 메시지는 내부 이름으로 나온다: body.fields→text_fields, body.repeat→chunk_prefix_fields,
#  values→value_map, require.fields→required, seq→sequence, alias→column_map,
#  merge_rows→row_merge, template→derive.
#
# ═══════════════════════════════════════════════════════════════════════════
#  확인 방법 — 저장소 루트에서 실행한다. <resource 폴더> 에는 현장 설정 폴더 경로를 그대로 쓴다.
#
#  1) 설정 점검(파싱·LLM 없음). 스키마·지원 키·변환기 오류를 미리 보여 준다.
#     기동 시 설정 검사도 같은 함수로 실행한다. 값이 맞게 나오는지는 보지 않으므로 2) 도 실행한다.
#       PYTHON=genon/preprocessor/.venv/bin/python genon/preprocessor/tools/config_precheck/precheck_custom_fields.sh <resource 폴더>
#
#  2) 실제 원천으로 파싱·청킹. <출력폴더> 의 *.chunks.json 에서 각 청크의 최상위 키로 목표필드가
#     실린다. 어긋난 alias 는 여기서만 드러나므로 설정을 바꾸면 반드시 실행한다.
#     llm 블록이 있으면 실제 LLM 을 호출한다. 분할 확인에는 --chunk-size 를 쓴다(이 경로는 하한 없음).
#       genon/preprocessor/.venv/bin/python genon/preprocessor/tools/parse_chunk/parse_chunk_test.py --config <resource 폴더>/parse_config.yaml \
#         --chunker-config <resource 폴더>/chunk_config.yaml --doc_type <유형> <샘플> <출력폴더>/
#
#  · 결과에 필드가 아예 없으면 요청 doc_type 과 등록 doc_type 이 일치하는지 먼저 본다.
#  · 저장소 회귀 검증: genon/preprocessor/tools/parse_chunk/parse_chunk_verify.py 의 CASES 에 샘플을,
#    EXTRA_CHECKS 에 새 필드 기대값을 넣고 genon/preprocessor/tools/parse_chunk/parse_chunk_verify.sh
#    --resource-dir <resource 폴더> --only <유형> 으로 실행한다(SKIP 은 사유를 본다). 스크립트가 자기 폴더로
#    이동한 뒤 실행되므로 --resource-dir 에는 절대 경로를 준다.
#
#  배포 — 사이트 전용 유형은 그 사이트 manifest.yaml 의 `owned:` 에 이 파일과, 등록을 넣은
#  parse_config.yaml 을 함께 올린다. owned 가 아닌 파일은 build-script/sync-sites.sh 가 표준
#  사본으로 덮어쓰거나 지운다. 표준 유형도 파서 설정을 owned 로 둔 사이트에는 그 파일에 따로 등록한다.
# ═══════════════════════════════════════════════════════════════════════════
