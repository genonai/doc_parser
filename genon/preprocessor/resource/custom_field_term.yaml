# 금융용어사전 Excel 행 → TB_TERM 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: term
#       extractor: tabular_mapping
#       config_file: custom_field_term.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
#
# 원천: monimo_rag_adfg_yyyymmdd_full_001.xlsx (공통, 전 관계사 혼재)
# 헤더: ID | 회사명 | 용어(국문) | 정의·설명 | 최종수정일 | 노출여부
#       정의 컬럼은 가운뎃점("정의·설명")이다. 아래 별칭에 두 표기를 모두 넣어둔다.
#       메뉴 시트와 마찬가지로 실제 헤더가 6행이다(1~5행은 메타 영역).

column_map:
  BIZ_ID:     [ID, 아이디]                              # 원천 업무키 (예: SLF_0001)
  GROUP_C:    [회사명, 고객사]                           # 고객사 (NOT NULL)
  TERM:       [용어(국문), 용어, 용어국문]                # 사전에 실린 용어 그대로 (NOT NULL)
  # TERM_NORM 은 파생 필드지만 소스가 TERM 과 같은 컬럼이다. 같은 컬럼을 두 목표필드로
  # 각각 매핑한 뒤 아래 transforms 로 한쪽만 정규화한다(별도 파생 기능이 필요 없다).
  TERM_NORM:  [용어(국문), 용어, 용어국문]                # 정규화 (NOT NULL)
  DEFINITION: [정의·설명, 정의 설명, 정의, 설명]          # 용어 뜻풀이 (NOT NULL)
  SRC_LAST_MOD_DT:     [최종수정일]                           # ACTIVE / DRAFT / RETIRED (NOT NULL)

# ── 값 별칭 → 표준 코드 ─────────────────────────────────────────────────────
# 이 시트의 회사명은 축약형("생명/화재/카드/증권")이다. 메뉴 시트의 정식 표기도 함께 등록.
value_map:
  GROUP_C:
    IFP: [모니모]
    SLF: [삼성생명, 생명]
    SSF: [삼성화재, 화재]
    HPP: [삼성카드, 카드]
    SSS: [삼성증권, 증권]

# ── 값 변환 (field_transforms.VALUE_TRANSFORMS 에 등록된 이름) ───────────────
# text_norm: NFKC → 양끝 공백 제거 → 연속 공백 1칸 축약 → casefold.
# 유일키 UX_TERM_CANON(CLCM_C + TERM_NORM)의 재료라 이 규칙이 곧 중복 판정 기준이 된다.
transforms:
  TERM_NORM: text_norm
  SRC_LAST_MOD_DT: date_int_flex

required:
  - GROUP_C
  - TERM
  - TERM_NORM
  - DEFINITION

defaults:
  STATUS: "ACTIVE"                 # TB_TERM 기본값과 동일
  BIZ_ID: null                         # 원천이 비워 보내도 스키마는 고정

# ── 원천에 없는 필드를 행마다 LLM 으로 생성 ─────────────────────────────────
# SYNONYMS 는 TB_TERM 에 JSON 타입이고 원천에 동의어 컬럼이 없다(파생 전용).
# llm_fields:
#   - output_fields: [SYNONYMS]
#     input_fields:  [TERM, DEFINITION]
#     concurrency: 4
#     on_error: null

#     # <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
#     url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
#     api_key: ""
#     model: model

#     max_tokens: 500
#     temperature: 0.0
#     timeout: 60

#     parser:
#       type: json

#     system_prompt: |
#       너는 금융용어 사전 편집자다. 주어진 용어와 정의를 보고 동의어 목록을 만든다.

#       규칙:
#       - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
#       - 키는 `SYNONYMS` 하나다. 값은 문자열 배열이다.
#       - 같은 뜻으로 쓰는 다른 말만 넣는다: 준말·풀어쓴 말·영문 표기·현업 구어체.
#         상위/하위 개념이나 연관어는 넣지 않는다(예: "해지환급금"에 "보험"을 넣지 않는다).
#       - 정의에 근거가 없는 표현을 지어내지 않는다(환각 금지).
#       - 0~5개로 제한한다. 마땅한 동의어가 없으면 빈 배열 [] 을 반환한다.

#       출력 예시 형식(값은 예시):
#       {"SYNONYMS": ["해약환급금", "환급금"]}

#     user_prompt: |
#       아래 용어의 동의어를 정리하라.

#       - SYNONYMS (동의어 배열)

#       반드시 `SYNONYMS` 키 하나를 가진 JSON 객체로만 반환하라.

#       <term>
#       {{raw_text}}
#       </term>

# ── 청크 text 본문 구성 순서 (개행 결합) ──────────────────────────────────────
# 용어사전은 정의 자체가 검색 대상이므로 별도 요약본문을 만들지 않는다
# (TB_TERM 에도 SUMMARY_TEXT 컬럼이 없다).
text_fields:
  - TERM
  - DEFINITION

# 긴 정의는 chunk_size 기준으로 나누고, 모든 조각에 용어를 반복한다.
split: true
chunk_prefix_fields:
  - TERM
