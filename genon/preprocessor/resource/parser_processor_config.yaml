defaults:
  # 5=DEBUG, 4=INFO, 3=WARNING, 2=ERROR, 1=CRITICAL, 0=NOLOG
  log_level: 4

formats:
  # 비표준 확장자 별칭: "이 확장자는 어떤 포맷으로 볼 것인가" 를 한 줄로 지정한다.
  # 원천이 표준 확장자를 안 쓰는 경우(예: 마크다운+HTML 혼합 산출물이 *.parsed 로 옴)에
  # 쓴다. 왼쪽이 실제 확장자, 오른쪽이 그렇게 취급할 표준 확장자다.
  # 파싱용 사본을 오른쪽 확장자 이름으로 만들어 넘기므로 이후 처리는 그 포맷과 동일하다.
  extension_aliases:
    ".parsed": ".md"

  # 엑셀(xlsx/xlsm), csv는 PDF 변환 없이 처리
  xlsx:
    # tabular(기본): openpyxl 로 병합셀 unmerge+forward-fill 후 데이터 행마다 parse element/청크 생성.
    # docling: docling MsExcel/Csv 백엔드로 DoclingDocument 생성 후 parse-JSON 직렬화.
    processing_mode: "tabular"
    # tabular 모드 전용 옵션
    tabular:
      # 헤더 행(0-based). 0=자동판정(제목행 스킵/멀티헤더 flatten), >0=단일헤더 강제.
      header_row: 0
      # 1시트에 표가 여러 개(빈 행으로 분리)면 표별로 분리(멀티헤더 자동감지 포함). false(기본)=시트=1표.
      multi_table: false

  # PPT(.ppt/.pptx): PDF→docling 재라우팅. page_description="페이지 자체"를 VLM 설명 → 페이지별
  # TextItem 주입(파스 출력 element 에 포함). 파스 전용이라 청킹 없음. 변환 실패 시 langchain 폴백.
  # enable=true 면 페이지 이미지 렌더. native text 는 프롬프트({{page_text}})에 반영.
  ppt:
    page_description:
      enable: true
      url: "http://llmops-gateway-api-service:8080/rep/serving/<PAGE_DESCRIPTION_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      timeout: 360
      concurrency: 16          # 페이지 설명 요청 병렬 수
      # 선택 튜닝: images_scale(렌더 배율) / max_image_side(전송 이미지 최대 변) / max_tokens(출력 상한) / params(추가 VLM 파라미터)
      prompt_template_file: prompt_page_image_description_default.md

  # HTML(.html/.htm): docling 은 <iframe srcdoc="..."> 속성값 안의 본문, 접힌 아코디언,
  # div/section 등으로 감싸진 <li> 하위 목록을 읽지 못할 수 있다.
  # 크롤 산출물(merged.html)이 그 형태라 4MB 문서에서 641자·표 0개만 추출되는 문제가 있어,
  # 파싱 전에 srcdoc 을 펼쳐 heading 기반 단일 문서로 재조립한다(실측: 641자 → 59,140자, 표 43개).
  #   auto  (기본): srcdoc/이중인코딩/아코디언/감싸진 목록이 감지될 때만 flatten.
  #   always      : 항상 flatten(콘텐츠영역 선택 + script/style 제거)
  #   off         : 전처리 없음(기존 동작)
  html:
    flatten: auto
  # 마크다운(.md): docling(기본) 이면 MarkdownDocumentBackend 로 파싱해 헤딩/표 구조를 유지하고
  # enrichment(custom_fields)까지 적용한다. 상품설명서(md) 같은 doc_type 이 custom_fields 를 쓰려면
  # DoclingDocument 가 필요하다 — 레거시 TextLoader 경로에는 후처리 enrichment 훅이 없다.
  #   docling (기본): docling 파싱 (모델서버 불필요 — 로컬 백엔드)
  #   text          : 레거시 TextLoader 경로(구조 없음, enrichment 미적용)
  md:
    processing_mode: docling

ocr:
  ocr_mode: "auto" # "auto"(default), "force", "disable"

  # OCR 엔진 선택. "paddle"(default) | "upstage"
  engine: "paddle"

  # 글리프 깨진 테이블 셀 재OCR 시 HTTP timeout(초)
  table_cell_ocr_timeout: 60

  paddle:
    # engine: "paddle" 일 때만 사용
    # <OCR_ENDPOINT>: PaddleOCR 서버 주소로 변경 필요
    ocr_endpoint: "http://<OCR_ENDPOINT>/ocr"
    text_score: 0.3

  # 글리프 깨짐 기반 auto-OCR 재트리거 임계값
  glyph_detection:
    table_cell_threshold: 1   # 셀 GLYPH 토큰 N개 이상이면 재OCR
    document_threshold: 10     # 문서 GLYPH 토큰 N개 초과면 OCR 경로 재시도

  # engine: "upstage" 일 때만 사용
  upstage:
    api_endpoint: "https://api.upstage.ai/v1/document-digitization"
    # api_key 가 비어있으면 UPSTAGE_API_KEY 환경변수에서 fallback
    api_key: ""
    model: "ocr"
    timeout: 60
    text_score: 0.5

layout:
  layout_model_type: "genos_layout" # "genos_layout"(default) or "docling_layout"
  genos_layout:
    # <LAYOUT_SERVING_ID>: Genos에 등록한 layout 모델서빙 ID로 변경 필요
    # api_key는 k8s 내부 통신 기반 모델 호출 시 불필요.
    endpoint: "http://llmops-gateway-api-service:8080/rep/serving/<LAYOUT_SERVING_ID>/v1/chat/completions"
    api_key: ""
    page_batch_size: 128
    max_completion_tokens: 16384
    model: "dots-mocr"          # 서빙 모델명
    timeout: 3600               # VLM 요청 타임아웃(초)
    retry_count: 2              # 비정상 VLM 응답 재시도 횟수
    temperature: 0.1            # 생성 temperature
    top_p: 0.9                  # 생성 top_p (0<top_p<=1)
    repetition_penalty: 1.15    # >1.0, 토큰 반복(degeneration) 억제

# PDF 파이프라인 (docling PDF 파싱 성능/품질 노브)
pdf_pipeline:
  num_threads: 8                     # accelerator 스레드 수
  device: "auto"                     # "auto"(default) | "cpu" | "cuda" | "mps"
  images_scale: 2                    # 페이지/그림 이미지 렌더 배율
  generate_page_images: true
  generate_picture_images: true      # false 면 이미지 설명 enrichment 비활성화됨
  table_structure_mode: "accurate"   # "accurate"(default) | "fast"

# enrichment
# 각 항목은 {이름: {옵션}} 형식의 list.
# 비활성화: ① 항목 삭제  ② 항목 주석 처리  ③ enable: false
# 모든 url 의 <ENRICHMENT_SERVING_ID> 는 Genos에 등록한 모델서빙 ID로 변경 필요.
# api_key 는 k8s 내부 통신 기반 모델 호출 시 불필요.
enrichment:
  - toc:
      enable: false
      url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      temperature: 0.0
      top_p: 0.00001
      seed: 33
      max_tokens: 10000
      precheck:
        enabled: true
        max_context_tokens: 128000
        completion_reserved_tokens: 12000
      # 반복(degeneration) 억제. 미설정 시 미전송.
      repetition_penalty: 1.1
      # thinking(추론) 모드. 미설정 시 기본 off(차단 토큰 전송). 모델 자동 판단은 thinking: auto.
      # thinking: off | on | auto,  thinking_dialect: standard(enable_thinking) | hcx(force/skip_reasoning)
      # thinking: off
      # thinking_dialect: standard
      system_prompt_file: prompt_toc_default_system.md
      user_prompt_file: prompt_toc_default_user.md
      # 긴 문서 분할 TOC 추출(carry-over refine). enabled=true 면 길이와 무관하게 항상 분할 수행.
      # 분할 각 청크에도 위 system/user 프롬프트를 사용하며, 2번째 청크부터 누적 목차를 컨텍스트로 덧붙인다.
      split:
        enabled: false
        pages_per_chunk: 100          # 청크당 페이지 수
        page_overlap: 1             # 청크 경계 중복 페이지 수
        carryover_max_tokens: 1500  # 다음 청크에 주입할 누적 목차 토큰 상한

  - metadata:
      enable: false
      url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      max_tokens: 10000
      temperature: 0.0
      timeout: 3600
      pages: [1,4]  # null = 첫 4페이지
      # output_fields: 프롬프트의 JSON 키와 일치해야 함
      output_fields: [created_date, authors]
      parser:
        type: json   # json(default) | python
      # thinking(추론) 모드. 미설정 시 기본 off(차단 토큰 전송). 모델 자동 판단은 thinking: auto.
      # thinking: off | on | auto,  thinking_dialect: standard(enable_thinking) | hcx(force/skip_reasoning)
      # thinking: off
      # thinking_dialect: standard
      system_prompt_file: prompt_metadata_default_system.md
      user_prompt_file: prompt_metadata_default_user.md
      precheck:
        enabled: true
        max_context_tokens: 128000
        completion_reserved_tokens: 12000

  - doc_summary:
      enable: false          # 기본 off. true 또는 런타임 doc_summary=1 로 활성화. image/table 이 공유
      url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      prompt_file: prompt_doc_summary.md   # {{full_text}} 기반 문서 본문요약
      max_chars: 6000
  - image_description:
      enable: false
      url: "http://llmops-gateway-api-service:8080/rep/serving/<IMAGE_DESCRIPTION_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      concurrency: 16        # 이미지 설명 요청 병렬 수
      before_items: 3
      after_items: 2
      max_context_chars: 1500
      prompt_template_file: prompt_image_description_default.md
      # ── 차트 처리 ──
      chart:
        enable: false          # false=일반 image description만 / true=차트 처리 수행
        detection: auto         # auto=docling 자동판별(차트 분류 이미지만 차트 프롬프트) | all=모든 이미지를 차트로 처리
        chart_prompt_file: prompt_chart_description_default.md
  - table_description:
      enable: false          # 기본 off(회귀 없음). true 또는 런타임 table_desc=1 로 활성화
      url: "http://llmops-gateway-api-service:8080/rep/serving/<IMAGE_DESCRIPTION_SERVING_ID>/v1/chat/completions"
      api_key: ""
      model: "model"
      concurrency: 8         # 표 설명 요청 병렬 수
      before_items: 3
      after_items: 2
      max_context_chars: 1500
      prompt_template_file: prompt_table_description_default.md   # 요약 전용 프롬프트
      # ── 구조 재구성(refine): true(또는 런타임 table_refine=1)면 재구성 HTML 로 표 본체 교체 ──
      refine:
        enable: false
        prompt_file: prompt_table_refine_combined.md   # 재구성 HTML + 요약 통합 프롬프트

  # 텍스트 기반(HTML/Markdown) 표의 RAG 설명 생성. true 또는 런타임 table_text_desc=1로 활성화.
  # 문서 내 여러 표는 가능한 한 1회 호출로 처리한다.
  #
  # 아래 url/model 을 채우면 custom_fields 의 LLM 사용 여부와 상관없이 표 설명을 이 연결로
  # 직접 만든다(권장). 그래야 custom_fields 가 LLM 을 쓰지 않는 문서유형(tabular/json 매핑)이나
  # 매칭 설정이 없는 문서에도 표 설명이 붙는다.
  # 비워 두면 예전처럼 매칭된 문서형 custom_fields YAML 의 연결을 빌려 쓴다(그 경우 위 문서들은 제외).
  - table_text_description:
      enable: true
      url: "https://genos.genon.ai/api/gateway/rep/serving/752/v1/chat/completions"
      api_key: "d1a9e0acab6243019008a96cd8af868e"
      model: "model"
      max_tokens: 4000
      temperature: 0.0
      timeout: 300
      prompt_template_file: prompt_table_text_description_rag.md
      input_format: auto       # auto=HTML 원본은 html, 그 외 markdown | markdown | html
      before_items: 3          # 표 앞쪽 본문 아이템 수
      after_items: 2           # 표 뒤쪽 본문 아이템 수
      max_context_chars: 1500  # 앞/뒤 문맥 각각의 최대 문자 수
      max_context_tokens: 128000       # 프롬프트 허용 상한(토크나이저 없이 문자 수로 보수 판정)
      completion_reserved_tokens: 8000 # 응답 생성을 위해 남겨둘 여유
      overflow_policy: batch   # batch=최소 추가 호출 | skip=표 설명 생략 | error=실패
      conflict_policy: prefer_text # 기존 이미지 표 설명과 충돌 시 prefer_text | prefer_image | error
      rag:
        retrieval_context_max_chars: 350 # 모든 분할 표 청크에 반복할 독립 검색 문맥
        key_fact_limit: 3                # 원표에서 직접 확인되는 핵심 사실 최대 개수
        key_fact_max_chars: 160          # 핵심 사실 1개당 최대 문자 수
        search_terms_limit: 8            # 질의 확장용 검색 표현 최대 개수
        include_search_terms: false      # true면 검색어도 청크 텍스트에 노출
        repeat_context_on_split: true    # 큰 표 분할 시 retrieval_context를 모든 조각에 반복

  # ── 문서유형별 custom_fields 추출 ──────────────────────────────────────────
  # extractor=llm 은 문서 단위 LLM 추출, tabular_mapping 은 Excel/CSV 행별 직접 매핑,
  # json_mapping 은 JSON 레코드 배열의 레코드별 직접 매핑(+ 필요 시 LLM 생성 필드).
  # doc_type(요청 kwargs)과 일치하는 설정만 동작. 배포 시 enable/serving ID 설정 후 사용.
  - custom_fields:
      enable: true
      doc_type: card
      extractor: llm
      config_file: custom_field_card.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
      # .json 입력 처리: 본문 텍스트(markdown/html)가 담긴 key 이름을 나열한다.
      # 키는 JSON 임의 깊이에서 재귀 매칭되므로 pages[*].html 같은 배열 구조도 그대로 처리된다.
      # 항목이 여러 개면 항목별 <h2> 섹션을 가진 단일 문서로 병합해 docling 을 1회 호출한다.
      # 이 블록이 없으면 .json 은 기존 텍스트 경로로 처리된다(동작 변경 없음).
      json:
        text_fields: [html, summary_md]
        format: auto             # auto(기본, 값 내용으로 판별) | html | markdown
        missing_policy: skip     # skip(기본, 경고만) | error
  # .json 레코드 모드: eventList[*] 처럼 레코드 배열이 오는 입력을 레코드마다 청크 1개로
  # 만들고, 목표필드를 그 청크의 metadata 로 싣는다(xlsx 의 tabular_mapping 과 같은 성격).
  # 위 card 의 json: 블록(문서 모드)보다 우선하며, 매칭 설정이 없으면 기존 .json 동작 그대로.

  # ── 모니모 15종 문서유형 custom_fields (2026-08-16 추가) ────────────────────
  # 출력 필드명은 모니모 적재 스키마(TB_*)의 DB 컬럼명(대문자)을 그대로 쓴다.
  # 공통 파일(메뉴·용어사전·FAQ·이벤트·관심소식)은 회사명 컬럼 + value_map 으로 GROUP_C 를
  # 코드화하고, 관계사 전용 파일은 config 의 constants 로 GROUP_C 를 고정한다.
  # 각 doc_type 의 추출항목 근거는 shkim_labs/_prompt/20260813_monimo_json.md 참고.
  # 메뉴서비스 — 공통 xlsx 행별 매핑 (KEYWORDS/SUMMARY_TEXT 는 llm_fields 로 생성)
  - custom_fields:
      enable: true
      doc_type: menu
      extractor: tabular_mapping
      config_file: custom_field_menu.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 용어사전 — 공통 xlsx 행별 매핑 (TERM_NORM 은 text_norm transform, SYNONYMS 는 llm_fields)
  - custom_fields:
      enable: true
      doc_type: term
      extractor: tabular_mapping
      config_file: custom_field_term.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # FAQ — 원천 확장자 미정이라 xlsx/json 두 경로를 같은 doc_type 으로 함께 등록한다.
  # 파서가 확장자로 분기하므로 충돌하지 않는다. 포맷 확정 후 안 쓰는 쪽을 enable:false 로 내릴 것.
  - custom_fields:
      enable: true
      doc_type: faq
      extractor: tabular_mapping
      config_file: custom_field_faq.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  - custom_fields:
      enable: true
      doc_type: faq
      extractor: json_mapping
      config_file: custom_field_faq_json.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 이벤트 — JSON 레코드별 매핑. 레코드 1건 = 청크 1개, 요약본문(SUMMARY_TEXT)은 LLM 생성
  - custom_fields:
      enable: true
      doc_type: monimo_event
      extractor: json_mapping
      config_file: custom_field_monimo_event.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 관심소식 — 이벤트와 같은 eventList 구조. TB_NEWS 컬럼(KEYW_CTGR_NM/CN_URL/NEWS_TO)로 매핑
  - custom_fields:
      enable: true
      doc_type: monimo_news
      extractor: json_mapping
      config_file: custom_field_monimo_news.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 상품설명서 생명/화재 — 전처리된 MD 문서 단위 LLM 추출
  - custom_fields:
      enable: true
      doc_type: product_slf
      extractor: llm
      config_file: custom_field_product_slf.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  - custom_fields:
      enable: true
      doc_type: product_ssf
      extractor: llm
      config_file: custom_field_product_ssf.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 상품설명서 카드 — custom_field_card.yaml 의 TB_PRODUCT 정합 후속본
  - custom_fields:
      enable: true
      doc_type: product_hpp
      extractor: llm
      config_file: custom_field_product_hpp.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
      # .json 입력 처리: 본문 텍스트(markdown/html)가 담긴 key 이름을 나열한다.
      # 원천이 json 으로 확정되면 카드WCMS 실제 스키마의 본문 키로 교체할 것.
      json:
        text_fields: [html, summary_md]
        format: auto             # auto(기본, 값 내용으로 판별) | html | markdown
        missing_policy: skip     # skip(기본, 경고만) | error
  # 삼성카드 WCMS JSON — 상품 1건(JSON 파일 1개)을 성격별 섹션(혜택 상세/상품 문서 …)으로
  # 나눠 섹션마다 검색 청크 1건을 만든다. JSON 입력에서는 이 경로가 위 문서형 LLM 경로보다
  # 먼저 선택된다.
  - custom_fields:
      enable: true
      doc_type: product_hpp
      extractor: json_semantic
      config_file: custom_field_product_hpp_semantic.yaml
  # 고객센터 생명/화재 — xlsx 행별 매핑 (원천 확장자 '미정' — 확정 시 재검토)
  - custom_fields:
      enable: true
      doc_type: cs_slf
      extractor: tabular_mapping
      config_file: custom_field_cs_slf.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  - custom_fields:
      enable: true
      doc_type: cs_ssf
      extractor: tabular_mapping
      config_file: custom_field_cs_ssf.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 고객센터 카드 — html 문서 단위 LLM 추출
  - custom_fields:
      enable: true
      doc_type: cs_hpp
      extractor: llm
      config_file: custom_field_cs_hpp.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 고객센터 증권 — JSON 레코드별 매핑
  - custom_fields:
      enable: true
      doc_type: cs_sss
      extractor: json_mapping
      config_file: custom_field_cs_sss.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # AI 차트뷰 — xlsx 행별 매핑. 세부내용 JSON 을 요약해 SUMMARY_TEXT 생성
  - custom_fields:
      enable: true
      doc_type: stock_insight
      extractor: tabular_mapping
      config_file: custom_field_stock_insight.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  # 링크 — 원천 요건 협의 중이라 key_map 이 잠정값이다. 스키마 확정 전까지 비활성 유지.
  - custom_fields:
      enable: true
      doc_type: link
      extractor: json_mapping
      config_file: custom_field_link.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
  - custom_fields:
      enable: true
      doc_type: research_report
      extractor: llm
      config_file: custom_field_research_report.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
      # .json 입력 처리: 본문 텍스트(markdown/html)가 담긴 key 이름을 나열한다.
      # 원천이 json 으로 확정되면 카드WCMS 실제 스키마의 본문 키로 교체할 것.
      json:
        text_fields: [html, summary_md]
        format: auto             # auto(기본, 값 내용으로 판별) | html | markdown
        missing_policy: skip     # skip(기본, 경고만) | error

output:
  format: "docling" # "json" (default), "html", "markdown", "docling"
  # "docling": 복원 가능한 DoclingDocument 원본 JSON 을 data.document 로 반환(Chunk API 입력용)
  # 민감정보 분류(#315): parser 가 guardrail 워크플로우를 호출해 sensitive_infos 를 출력에 실어 보내고,
  # chunking API 가 그 결과로 청크별 라벨/마스킹을 적용한다(아래 guardrail 섹션 참고).

  # ── 표 표기형태 ────────────────────────────────────────────────────────────
  # 아래 두 키는 파서가 표를 직접 문자열로 낼 때만 쓰인다.
  #   1) format 이 json/html/markdown 일 때의 파싱 출력
  #   2) custom_fields 의 html_text_fields 파생 필드
  #      (예: monimo_event 의 DETAIL_HTML → DETAIL_TEXT). 이 파생 필드는 docling 을
  #      거치지 않으므로 format: docling 에서도 파서가 표 모양을 확정한다.
  # format: docling 으로 청커(/chunker)에 넘기는 구성에서는 파싱 출력의 표에 영향이 없다.
  # 그때 청크 텍스트의 표 모양은 chunking_processor_config.yaml 의 output 이 정한다.
  #
  # "auto" 는 표마다 구조를 보고 고른다 - 병합 셀이나 2단 헤더가 있으면 html,
  # 단순 격자면 markdown. markdown 은 병합 셀을 표현하지 못해 헤더 계층이 사라진다.
  table_format: "html" # "html"(default) | "markdown" | "auto"  ("docling" 포맷에서는 무시)
  compact_tables: true # markdown 표 컬럼 정렬 패딩 제거(대형 표 축소). html/docling 포맷엔 무관.
  # 표 뒤 "컬럼=값 | 컬럼=값" 행 문장(table_row_serialization)은 청커 전용이라 여기에 없다 —
  # chunking_processor_config.yaml 의 output 에서 켠다.

# whisper 설정. 음성(.wav/.mp3/.m4a) 처리 시에만 필요(선택).
# <WHISPER_ENDPOINT>: 음성인식 모델 서버 주소로 변경 필요 (음성 미사용 시 무시)
whisper:
  url: "http://<WHISPER_ENDPOINT>/v1/audio/transcriptions"
  model: "model"
  language: "ko"
  response_format: "json"
  temperature: "0"
  stream: "false"
  timestamp_granularities: "word"
  chunk_sec: 29
  chunk_overlap_ms: 300  # 청크 간 겹침(ms)

guardrail:
  # 민감정보 분류(#315) — parser 가 호출 주체. 요청 kwargs guardrail_call(0/1) 이면 문서 전체를 1회
  # 분류해 sensitive_infos 를 파스 출력에 실어 chunking 으로 전달(청크 라벨·마스킹 적용은 chunking).
  url: ""                 # GenOS gateway 베이스(코드가 /workflow/{workflow_id}/run/v2 를 붙임)
  workflow_id:            # 민감정보 분류 워크플로우 ID
  api_key: ""             # 워크플로우 호출 Bearer 인증키(배포 환경변수/시크릿 권장)
  timeout: 60             # 호출 타임아웃(초). 대용량 문서는 상향
