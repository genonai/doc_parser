# cs_ssf(삼성화재 고객센터 안내) custom_fields

schema: v2
source:
  kind: records
  pre:
    delimited:
      separator: "|@|"
      columns: [대분류, 중분류, 소분류, 제목, 내용]
fields:
  BIZ_ID:
    template: "{{CS_CTGR_L1}}|{{CS_CTGR_L2}}|{{CS_CTGR_L3}}|{{CUSTOM_TITLE}}|{{CONTENT}}"
    transform: {name: hash, prefix: SSF_CS_, length: 16}
  GROUP_C:
    const: SSF
  CS_CTGR_L1:
    alias: [대분류]
  CS_CTGR_L2:
    alias: [중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [제목]
    transform: to_text
  CONTENT:
    alias: [내용]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    default: null
    transform: date_int
require:
  fields: [GROUP_C]
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
