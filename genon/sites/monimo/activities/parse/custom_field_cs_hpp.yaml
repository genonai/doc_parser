# 문서 유형 cs_hpp(삼성카드 고객센터 안내)의 custom_fields 설정 — JSON 레코드 하나를 안내 한 건으로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADCCTBINC001)의 컬럼 이름과 같다
# (CUSTOM_TITLE 은 TITLE 컬럼에 들어간다. CS_CTGR_L1·L2·L3 은 대·중·소분류다).
# BIZ_ID 는 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# 본문(CONT)의 HTML 은 제목 계층을 h 태그가 아니라 도형 기호(◈ ▣ ■)로만 나타낸다(processing/converters/html_flatten.py 참고).

schema: v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    # 원본 파일명($file)에서 첫 `_숫자` 구간까지를 쓰고, 뒤에 붙는 _init / _delta_001 등은 버린다.
    # 예: hpp_rag_adcc_237219_init.json → hpp_rag_adcc_237219 (한 파일 안의 레코드는 모두 같은 값이 된다)
    alias: [$file]
    transform: {name: regex_extract, pattern: '^(.+?_\d+)(?=[_.])'}
    default: null
  GROUP_C:
    alias: [회사명, company, corp_code]
    const: HPP
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CTGR_L1:
    alias: [ORN_NM, 대분류]
    default: null
  CS_CTGR_L2:
    alias: [LV2_THEMA_TERY_NM, 중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [TIT_NM, 제목, 대표질문]
  CONTENT:
    alias: [CONT, 안내본문, 답변]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [KEYW_LIS]
    default: null
    transform: [{name: to_json, key: "KEYW_LIS"}]
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [UD_DTM]
    default: null
    # 날짜를 다른 문서 유형과 같은 YYYYMMDD 정수로 바꾼다(기간 필터·최신순 정렬에 쓴다). 값이 없으면 0(날짜 없음)이다.
    transform: date_int
# 이 필드가 빈 레코드는 건너뛴다
require:
  fields: [CUSTOM_TITLE]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
