# ─────────────────────────────────────────────────────────────────────────
#  v2 스키마로 자동 변환된 설정입니다.
#
#  자동 변환은 **값만** 옮깁니다. 아래는 원본 v1 의 주석 전문이며, 필요한 설명을 각
#  필드 스펙 옆으로 손수 옮긴 뒤 이 블록을 지우세요. 주석이 사라지면 왜 그런 설정인지
#  아는 사람이 없어집니다.
# ─────────────────────────────────────────────────────────────────────────
# FAQ JSON 레코드 → TB_FAQ 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: faq
#       extractor: json_mapping
#       config_file: custom_field_faq_json.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
#
# custom_field_faq.yaml(엑셀 행 매핑)의 JSON 대응판이다. 원천 확장자가 "미정"이라 두 형태를
# 같은 doc_type=faq 로 함께 받는다 — 파서가 확장자로 분기하므로 충돌하지 않는다.
#
# 입력 예시(모니모 FAQ, 공통_FAQ 시트의 "받은 문서 구조"):
#   {"faqMenuList": [
#      {"depth1": "더보기", "depth2": "FAQ", "depth3": "앱 이용",
#       "depth4": "설정한 홈 화면을 변경하고 싶어요.",
#       "id": "ca01_1", "app_route": "더보기>고객센터>앱 이용",
#       "url": "/fcm/common/faq/ca01/1492147_1415.json",
#       "description": "세 가지의 홈 유형 중 …", "corp_code": "HPP", "logo": "IFP"}
#   ]}

schema: v2
source:
  kind: records
  records_at: faqMenuList
  on_missing: error
fields:
  BIZ_ID:
    alias: [id, 아이디]
    default: null
  GROUP_C:
    alias: [corp_code, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  FAQ_CTGR_NM:
    alias: [분류, depth3, 카테고리]
    default: null
  QUESTION:
    alias: [질문, depth4, 대표질문]
  ANSWER:
    alias: [답변, description]
  DEEP_LINK_URL:
    default: null
require:
  fields: [GROUP_C, QUESTION, ANSWER]
body:
  fields: [QUESTION, ANSWER]
  labels:
    QUESTION: 질문
    ANSWER: 답변
  split: true
  repeat: [QUESTION]
