# 이벤트 JSON 레코드
#
# 입력 예시:
#   {"eventList": [{"cmpCntsId": "CM26061182", "mnmFncoCd": "모니모", "evtTodayMainCopy": "…",
#                   "evtPtrmStrtDt": "26.07.01", "evtPtrmEndDt": "26.07.31",
#                   "wcmsHtml": {"htmlText": "<div>이벤트 상세 …</div>"}}]}

schema: v2
source:
  kind: records
  records_at: eventList
  on_missing: error
fields:
  BIZ_ID:
    alias: [cmpCntsId, ID, 이벤트ID, event_id]
    default: null
  GROUP_C:
    alias: [mnmFncoCd, 회사명, corp_code, 고객사]
    default: IFP
    values:
      IFP: [0, "00", 모니모]
      HPP: [1, "01", 삼성카드, 카드]
      SLF: [2, "02", 삼성생명, 생명]
      SSF: [3, "03", 삼성화재, 화재]
      SSS: [4, "04", 삼성증권, 증권]
  TITLE:
    alias: [text, 제목, title, evtTodayMainCopy]
    transform: text_norm
  EVENT_FROM:
    alias: [이벤트 시작일, 시작일, startDate, start_date, evtPtrmStrtDt]
    transform: date_int_flex
  EVENT_TO:
    alias: [이벤트 종료일, 종료일, endDate, end_date, evtPtrmEndDt]
    transform: date_int_flex
  DETAIL_HTML:
    alias: [cmp_desc, htmlText, 상세내용]
  MOVE_TARGET_URL:
    alias: [etcMoveTargetPage]
  EVENT_KIND_C:
    alias: [evnKndCd]
  CAMPAIGN_C:
    alias: [cmpCode]
  DETAIL_TEXT:
    alias: [cmp_desc, htmlText, 상세내용]
    transform: html_text
require:
  fields: [TITLE]
body:
  fields: [TITLE, DETAIL_TEXT]
  labels:
    TITLE: 제목
    DETAIL_TEXT: 상세내용
  split: true
  repeat: [TITLE]
