# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 원문 HTML 선택자 추출 (source.kind: html)
#
#  언제 쓰나 : 뽑아야 할 값이 원천 마크업의 **class 나 속성으로 이미 정확히 지목**되어
#              있을 때 (CMS 상세 페이지, 크롤 산출물, WCMS 계열 원천 …).
#              JSON 안의 HTML 이 본문 전체 하나이면 이 kind 를, 여러 key 에 흩어진 HTML
#              조각이면 sections 를 쓴다.
#  결과      : 문서 metadata → 그 문서에서 나온 **모든 청크에 같은 값**이 붙는다.
#              청크 본문은 docling 이 만든다(이 설정이 본문을 조립하지 않는다).
#  LLM 호출  : 없음. 선택자가 값을 만드므로 연결 설정도 프롬프트도 필요 없다. docling 파싱 뒤에는
#              class·속성이 남지 않으므로, 근거가 마크업에 있는 값은 이 kind 로 뽑는다.
#  실행 경로 : 원문 HTML 이 필요하므로 parser 경로에서만 값이 채워진다.
#  다른 kind : rows(엑셀/CSV 한 행) · records(JSON 배열 한 요소) · sections(대상 하나를 설명한
#              중첩 JSON) · document(문서 1건에서 LLM 으로 추출)
#
#  ── 쓰는 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 설정 폴더에 custom_field_<유형>.yaml 로 복사한다(표준 유형은 genon/preprocessor/
#     resource/, 사이트 전용 유형은 genon/sites/<site>/resource/ — 맨 아래 "배포" 참고).
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다
#     (없으면 기동이 실패한다).
#  ③ 같은 폴더의 parser_processor_config.yaml 의 enrichment 목록에 등록한다.
#        - custom_fields:
#            enable: true
#            doc_type: <유형>            # 요청 params 의 doc_type 과 같은 값
#            config_file: custom_field_<유형>.yaml   # 파일명만. 이 등록 블록이 있는 프로세서
#                                                    # 설정 yaml 과 같은 폴더 기준
#     extractor 는 적지 않는다(`source.kind: html` 에서 `html_select` 로 정해진다).
#  ④ 맨 아래 "확인 방법" 으로 실제 원천 파일의 결과를 확인한다.
#
#  ── 이 kind 고유 주의: 원문 HTML 이 파서에 전달되어야 한다(가장 흔한 실패) ──
#  선택자는 **파싱 전 원문 HTML** 에 걸린다. 원문이 전달되는 경로는 둘뿐이다.
#   ① 원천이 `.html` / `.htm` 파일인 경우 — 그대로 전달된다.
#   ② 원천이 `.json` 이고 그 안의 값이 HTML 인 경우 — 아래 `source.pre.json.body_from` 으로
#      그 값을 꺼내야 한다. 이 블록을 빠뜨리면 json 이 원문 그대로 파싱되어 선택자가 걸릴
#      HTML 이 없다.
#  원문 HTML 이 없으면 선택자 필드는 비지만 const·default·파일명으로 만드는 값은 그대로
#  채워진다. 로그는 경우마다 다르다. 이 블록을 빠뜨리면 "원문 HTML 이 없습니다", 블록은 있으나
#  body_from 의 key 가 원천에 없으면 "json.text_fields [...] 에 해당하는 텍스트를 JSON 에서
#  찾지 못했습니다" 와 선택자 미적중 경고가 남는다. pdf·docx·xlsx 등에는 이 kind 를 쓰지 않는다.
#
#  ── 이 kind 로 할 수 없는 것 ──────────────────────────────────────────────
#  · 본문 key 가 없는 파일을 건너뛰기(0건 종료) — `on_missing: skip` 도 파일명만 담긴 청크를 만든다.
#  · HTML 주석(`<!-- -->`) 안의 값 추출, JSON 의 다른 key 값 읽기(alias 는 `$file` 전용).
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: html

  # ── [선택] 원천 포맷 전처리 (json 은 조건부 필수) ─────────────────────────
  # docling 파싱 **전에** 원문을 손보는 규칙이다. parser 경로에서만 적용된다.
  # pre:
  #   marker_headings: true         # `◈ 기본내용` 처럼 도형 마커로만 계층을 표현한 줄을
  #                                 # heading 으로 승격해 청킹 경계를 만든다
  #   json:                         # [조건부 필수: JSON 안에 HTML 이 든 원천] 본문이 그 안의 값일 때
  #     # 본문(html 문자열)이 담긴 원천 key 이름들. 경로가 아니라 이름만 적고 임의 깊이에서 문서
  #     # 순서대로 모으므로 `wcmsData.html.content` 도 `content` 한 단어로 잡힌다.
  #     # 꺼낸 항목마다 <h2> 섹션을 가진 단일 문서로 병합된다. 제목은 같은 object 의 name/title
  #     # 값, 없으면 `<key>#<번호>`(예: content#2)이며 청크 HEADER 와 본문에 실린다. 항목이 하나뿐이고
  #     # name/title 이 없으면 <h2> 를 만들지 않는다. 선택자는 이 **병합된 HTML** 에 걸린다.
  #     body_from: [<본문_KEY>]       # [필수]
  #     format: auto                # auto(기본: HTML 태그가 보이면 html, 아니면 markdown) | html | markdown
  #     on_missing: skip            # skip(기본) = 경고 후 빈 문서로 진행(파일명만 담긴 청크가 생긴다)
  #                                 # error = 요청 실패

# ── [필수] 필드 선언 ────────────────────────────────────────────────────────
# 왼쪽 = 목표필드명. 적재 DB 컬럼명(대문자)으로 쓴다. 이 kind 는 이름 규칙을 기동 시 검사하지
# 않으므로 소문자 예약 이름(text·title·n_char·i_page·created_date·appendix …)과 한글·공백·기호를
# 쓰지 않는다(적재 시 실패하거나 값이 덮어써진다).
# 선언한 필드는 선택자에 걸리지 않아도 키가 남는다(값 null).
#
#   select    : 값이 있는 요소의 CSS 선택자 (`.new-banner-headline`, `#detail > p` …).
#               이 kind 의 원천 지목 자리이며 첫 번째로 걸린 요소 하나를 쓴다. 문법 오류는 기동 시
#               실패한다. 걸린 요소의 안쪽을 평문화한다 — 표가 있으면 행·열 구조를 남기고, 없으면
#               태그만 걷어낸다(`<ul>`·`<ol>` 은 글머리표 없이 원천 줄바꿈대로 나온다).
#               HTML 주석 안쪽은 잡지 않는다.
#   attr      : 값이 텍스트가 아니라 그 요소의 **속성**에 있을 때만 select 와 함께 쓴다.
#               속성값을 문자열 그대로 쓴다. attr 만 적으면 기동이 실패한다.
#   alias     : **파일명 원천만** 쓸 수 있다. `alias: [$file]` 이면 입력 파일명을 원천값으로 쓴다.
#               요청의 org_filename 이 우선이고 없으면 입력 경로의 파일명이다. 잘라내기는
#               regex_extract 로 하며, 매칭이 없으면 값이 비고 경고가 남는다
#               (파일명 TD00008415_d_5199.html.json → pattern '^(TD\d+)' → TD00008415).
#               그 밖의 alias 와 `$file` 에 다른 별칭을 섞은 alias 는 기동이 실패한다.
#   const     : 항상 같은 값. 선택자가 가져온 값보다 우선한다.
#   default   : 선택자가 값을 주지 못한 자리만 채운다. "원천에 없으면 X" 는 default,
#               "무조건 X" 는 const 로 쓴다.
#   values    : 코드값·표기 흔들림을 표준값으로 접는다 (`SALE: ["1", Y, 판매중]`).
#               매핑표에 없는 값은 원값을 그대로 두고 경고만 남긴다.
#               별칭에 영문 `yes`/`no`/`on`/`off` 를 쓸 때는 따옴표로 감싼다. YAML 이 불리언으로
#               해석하므로 원천의 "yes" 와 일치하지 않는다(`Y`/`N` 은 그대로다).
#   transform : 값 변환 체인. 아래 [변환기] 참고.
#   template  : 다른 필드를 합쳐 만든다 (`"{{GROUP_C}}-{{DOC_ID}}"`). **select 필드는 template·pack 의
#               재료로 쓸 수 없다(기동 실패)** — const·default·`$file` 필드만 쓴다. 값이 없는 자리표시자만
#               지우고 구분자는 남긴다. 같은 필드에 transform 을 함께 적으면 합친 결과에 적용된다.
#   pack      : 여러 필드를 **JSON 객체 한 칸**에 담는다(`[GROUP_C, DOC_ID]` → `{"GROUP_C": ..., ...}`
#               문자열). 산출이 이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다. 본문 키(repeat·once·
#               mirror_to)에는 쓸 수 없다.
#   meta      : 청크 메타(적재 컬럼)에 실을지. 기본 true. template·pack 재료로만 쓰는 중간
#               필드에 `meta: false` 를 적는다. 적재 컬럼에서만 빠진다.
#
# [변환기] 목록으로 쓰면 순서대로 적용된다. 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       날짜 → YYYYMMDD 정수. "2026-07-01"·"26.07.01"·"260701"·"20260701" 을 받고,
#                  문자열 "2026" 은 20260101 이다(숫자 2026 은 2026 그대로). 인자 on_error(기본 0).
#                    빈 값(None·""·공백·문자열 "None", 선택자 미적중) → 항상 0 (on_error 와 무관)
#                    해석 실패 → on_error
#                    정상 → 20260701
#   normalize      NFKC → 양끝 공백 제거 → 연속 공백 한 칸 → 소문자화(중복 판정 키용)
#   to_text        JSON·HTML·평문을 자동 판별해 평문화한다
#   regex_sub      pattern, repl=""                  정규식 치환
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 매칭이 없으면 on_error, 빈 값은 그대로
#   to_int         on_error=null                     정수 하나로. 소수·숫자 둘 이상이면 on_error
#   hash           length=16, prefix=""              SHA-1 16진 코드로 줄인다
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  값 하나를 유효한 JSON 문자열로(JSON 컬럼용).
#                                                    빈 값·깨진 JSON 은 null. 체인 맨 뒤 전용이며
#                                                    본문 키와 pack 재료에 쓸 수 없다
#   날짜 레시피 — 빈 값을 null 로: [date_int, {name: regex_extract, pattern: '^([1-9]\d{7})$'}, to_int]
#                 없음·해석 실패를 99991231 로: default: 99991231 + {name: date_int, on_error: 99991231}
fields:
  <TITLE>:
    select: <.제목_class>
  <CATEGORY>:
    # 값이 텍스트가 아니라 감싸는 요소의 속성에 있는 경우.
    select: <.바깥_wrap_class>
    attr: <속성이름>
  <DETAIL>:
    select: <.본문_class>
  # 원천에 없어서 선택자로 뽑지 못하는 값은 select 없이 선언한다.
  <GROUP_C>:
    const: <고정값>
  <BIZ_ID>:
    default: null
  # 파일명에서 식별자를 잘라낸다.
  # <DOC_ID>:
  #   alias: [$file]
  #   transform: {name: regex_extract, pattern: '<파일명 정규식>'}

# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   default < 선택자 < 파일명 < const  →  values → transform → template → pack
# · 왼쪽일수록 우선순위가 낮다. values 이후는 병합이 끝난 뒤에 처리되어 default 를 포함한 모든 값에
#   적용된다. 앞에 regex_extract 를 두면 그 패턴이 default 값에도 맞아야 한다(맞지 않으면 지워진다).

# ── [선택] 청크 본문 관련 규칙 ──────────────────────────────────────────────
# 값이 아니라 규칙이다. 파서가 문서 metadata 로 실어 보내고 청커가 소비한다.
#
#   mirror_to : 그 청크의 본문(text)과 글자 그대로 같은 값을 받는 필드(검색 대상 본문 컬럼용)
#   repeat    : 모든 청크 본문 앞에 반복해 얹을 필드(매 청크가 단독으로 검색되어야 하는 식별자)
#   once      : 문서의 첫 청크에만 1회 얹을 필드(문서 단위 분류·작성일처럼 매 청크에 반복하기에는
#               chunk_size 를 소모하기에 부담스러운 값). 주입 횟수만 정하며 원문의 같은 값은 남는다.
#   labels    : repeat·once 로 얹는 값 앞에 붙일 사람이 읽는 항목명(`항목명: 값`). 이름이 없는
#               필드는 값만 낸다.
#
# repeat/once 는 접두만큼 chunk_size 를 소모하므로 짧은 필드 1~2개로 제한한다. 값이 비었거나
# 중첩 객체인 필드는 건너뛴다. once 만 쓴 값은 임베딩 검색에서 첫 청크만 걸린다(값 자체는 모든
# 청크 metadata 에 실리므로 필터 검색은 전 청크에서 된다).
# `fields`·`split` 은 이 kind 에 없다 — 본문을 docling 이 만들기 때문이다(적으면 기동 실패).
# body:
#   once:   [<CATEGORY>, <TITLE>]
#   repeat: [<TITLE>]
#   mirror_to: [<BODY_COLUMN>]
#   labels:
#     <CATEGORY>: <사람이 읽는 이름>
#     <TITLE>: <사람이 읽는 이름>

# ── [선택] 표 설명(table_text_description)을 이 문서유형에서만 바꾼다 ────────
# **최상위 키**다. 프로세서 설정의 공통 `table_text_description` 이 기본이고, 여기 적은 키만
# 덮어쓴다(rag 하위도 키 단위 병합). 켜고 끄기는 `enable`(기본 false)이며 요청의
# table_text_desc 값이 있으면 그것이 우선한다.
# 이 kind 는 LLM 연결을 갖지 않으므로, 표 설명에 쓸 연결(model_preset 또는 url/model)이 프로세서
# 공통 설정이나 이 블록에 있어야 한다.
# table_text_description:
#   prompt_template_file: prompt_table_text_description_rag.md
#   input_format: auto
#   before_items: 4
#   after_items: 3

# ═══════════════════════════════════════════════════════════════════════════
#  기동 시 자동 검사
#
#  실패시킨다: 해석할 수 없는 CSS 선택자·빈 select, select 없는 attr, `$file` 이 아닌 alias,
#  이 kind 가 읽지 않는 키(오타는 가까운 이름을, 다른 kind 의 키는 어디 전용인지 알려준다),
#  모르는 변환기·잘못된 정규식, 아무도 만들지 않는 필드(select 필드 포함)를 가리키는 template·pack.
#    html 이 읽지 않는 대표 키: require · filter · llm · python · body.fields · body.split
#                               · 필드의 collect · seq · raw
#                               · source.records_at · source.sections · source.ignore_keys · source.merge_rows
#  경고만 남긴다:
#   · 선택자가 아무것도 잡지 못할 때 — `[html_select] 선택자에 걸리지 않아 값이 비었습니다:
#     TITLE(.foo)` 처럼 필드와 선택자가 남는다. 마크업이 바뀌었거나 그 요소가 원천에서 HTML
#     주석 처리된 경우다.
#   · 원문 HTML 자체가 없을 때 — `원문 HTML 이 없습니다`(pre.json 누락) 또는
#     `json.text_fields [...] 에 해당하는 텍스트를 JSON 에서 찾지 못했습니다`(body_from key 부재).
#     위 "이 kind 고유 주의" 의 두 경로를 확인한다.
#   · 파일명에서 값을 만들지 못할 때, `values` 에 없는 값.
#  못 잡는다:
#   · 선택자가 **엉뚱한 요소를 잡는** 경우 — 무언가 걸리므로 경고도 없다. 같은 class 를 본문
#     문단이 함께 쓰는 원천에서 흔하다(범위를 좁히는 선택자로 해결한다).
#   · 목표필드명 규칙 위반(예약 이름·한글).
#   · `source.pre.delimited` 를 적은 경우(records 전용이라 무시된다).
#
#  오류 메시지는 내부 이름으로 나온다: select→select_map, alias [$file]→file_fields,
#  pre.json.body_from→json.text_fields, pre.json.on_missing→missing_policy,
#  body.repeat→chunk_prefix_fields, body.once→first_chunk_fields, body.mirror_to→body_fields,
#  values→value_map, transform→transforms, template→derive.
#
# ═══════════════════════════════════════════════════════════════════════════
#  확인 방법 — 저장소 루트에서 실행한다. <resource 폴더> 에는 현장 설정 폴더 경로를 그대로 쓴다.
#
#  1) 설정 점검(파싱 없음). 스키마·지원 키·변환기 오류를 미리 보여 준다.
#     CSS 선택자 문법·template·pack 참조 등 일부 기동 검사는 하지 않으므로 통과해도 2) 를 실행한다.
#       PYTHON=genon/preprocessor/.venv/bin/python genon/preprocessor/tools/config_precheck/precheck_custom_fields.sh <resource 폴더>
#
#  2) 실제 원천으로 파싱·청킹. 원천이 .json 이어도 그대로 넣는다(body_from 이 HTML 을 꺼낸다).
#     <출력폴더> 의 *.chunks.json 에서 각 청크의 최상위 키로 목표필드가 실린다. 엉뚱한 요소를
#     잡는 선택자는 여기서만 드러나므로 선택자를 바꾸면 반드시 실행한다. 로그의 선택자 경고도 본다.
#       genon/preprocessor/.venv/bin/python genon/preprocessor/tools/parse_chunk/parse_chunk_test.py --config <resource 폴더>/parser_processor_config.yaml \
#         --chunker-config <resource 폴더>/chunking_processor_config.yaml --doc_type <유형> <샘플> <출력폴더>/
#
#  · 결과에 필드가 아예 없으면 요청 doc_type 과 등록 doc_type 이 일치하는지 본다.
#  · 저장소 회귀 검증: genon/preprocessor/tools/parse_chunk/parse_chunk_verify.py 의 CASES 에 샘플을,
#    EXTRA_CHECKS 에 새 필드 기대값을 넣고 genon/preprocessor/tools/parse_chunk/parse_chunk_verify.sh
#    --resource-dir <resource 폴더> --only <유형> 으로 실행한다(SKIP 은 사유를 본다). 스크립트가 자기 폴더로
#    이동한 뒤 실행되므로 --resource-dir 에는 절대 경로를 준다.
#
#  배포 — 사이트 전용 유형은 그 사이트 manifest.yaml 의 `owned:` 에 이 파일과, 등록을 넣은
#  parser_processor_config.yaml 을 함께 올린다. owned 가 아닌 파일은 build-script/sync-sites.sh 가 표준
#  사본으로 덮어쓰거나 지운다. 표준 유형도 파서 설정을 owned 로 둔 사이트에는 그 파일에 따로 등록한다.
# ═══════════════════════════════════════════════════════════════════════════
