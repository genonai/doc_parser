# 전처리 Studio 는 옵션 이름 옆 툴팁에 그 키의 같은 줄 주석과 바로 위에 붙은 주석 줄을 보여 준다
# (빈 줄이나 다른 키를 만나면 거기서 끊긴다). 그래서 키 바로 위에는 툴팁용 짧은 설명
# (무엇을 정하는지 · 쓸 수 있는 값과 기본값 · 바꾸면 무엇이 달라지는지)만 두고, 긴 설명은 빈 줄로 떼어 그 위에 둔다.

defaults:
  # 실행 로그를 얼마나 자세히 남길지. 5=DEBUG 4=INFO(기본) 3=WARNING 2=ERROR 1=CRITICAL 0=끄기. 클수록 로그가 많다
  log_level: 4
  # 요청한 doc_type(문서 유형)에 맞는 custom_fields 설정이 없을 때. warn(기본)=경고만 남기고 일반 문서로 파싱
  # | fail=요청을 실패시킨다
  unknown_doc_type: fail

# ── 모델 프리셋 ───────────────────────────────────────────────────────────────
# 모델 프리셋은 모델·외부 서비스 접속 정보(LLM 서버 주소·키, OCR·layout·whisper·guardrail 주소)에 붙인 이름이다.
# 접속 정보는 설정 폴더(resource/)의 model_presets.yaml 한 곳에 모아 두고, 쓰는 곳에서는
# `model_preset: <이름>` 한 줄로 부른다. activity 폴더는 그 파일을 복사하지 않고 이름으로 참조한다 —
# `model_presets_file` 을 적지 않으면 그 파일이 자동으로 기본값이 된다. 자세한 규칙은 그 파일 머리말에 있다.
# 아래 블록의 값은 그 기본값 위에 프리셋 이름별·키별로 덮어쓴다. 쓰는 곳에 직접 적은 키는 프리셋보다 우선한다.
model_presets:
  page:
    # PPT 페이지 설명 LLM 호출 1회의 제한 시간(초). 기본 360. 넘기면 그 페이지만 설명 없이 넘어간다(요청은 계속)
    timeout: 360

formats:
  # 비표준 확장자 별칭: "이 확장자는 어떤 포맷으로 볼 것인가" 를 한 줄로 지정한다.
  # 원본 파일이 표준 확장자를 쓰지 않을 때(예: 마크다운+HTML 이 섞인 크롤링 결과가 *.parsed 로 올 때)
  # 쓴다. 왼쪽이 실제 확장자, 오른쪽이 그렇게 취급할 표준 확장자다.
  # 오른쪽 확장자 이름으로 사본을 만들어 파싱하므로, 그 뒤 처리는 그 포맷과 똑같다.
  extension_aliases:
    # .parsed 파일을 마크다운(.md)으로 보고 파싱한다(마크다운+HTML 이 섞인 크롤링 결과)
    ".parsed": ".md"
    # 고객센터(화재) 원본 파일. 내용은 |@| 로 구분한 텍스트지만 레코드 매핑 route 로 처리해야 하므로
    # json 으로 본다(실제 파싱은 custom_field_cs_ssf.yaml 의 source.pre.delimited 가 한다).
    ".dtms": ".json"

  # 엑셀(xlsx/xlsm)과 csv 는 PDF 로 바꾸지 않고 처리한다
  xlsx:
    # 엑셀·csv 를 읽는 방식. tabular(기본)=병합 셀을 풀어 데이터 행마다 한 건으로 만듦
    # | docling=시트를 문서(표)로 변환해 일반 문서처럼 처리
    processing_mode: "tabular"
    # tabular 모드 전용 옵션
    tabular:
      # 헤더 행 번호(0부터 셈). 0(기본)=제목·여러 줄 헤더를 자동 판정 | N=N번 행을 헤더로 고정(그 위 행은 버림)
      header_row: 0
      # 한 시트에 빈 행으로 나뉜 표가 여러 개면 표마다 따로 읽을지. false(기본)=시트 하나를 표 하나로 | true=표별로 분리
      multi_table: false

  # PPT(.ppt/.pptx): PDF 로 바꾼 뒤 docling 으로 파싱한다. 바꾸지 못하면 langchain 으로 텍스트만 뽑는다(fallback).
  # page_description 은 페이지 전체를 이미지로 그려 VLM(이미지를 읽는 LLM)에 설명을 받고, 그 설명을 페이지마다
  # 글 항목으로 넣어 파싱 결과에 포함한다. 슬라이드에 원래 있던 글자는 프롬프트의 {{page_text}} 로 함께 보낸다.
  ppt:
    page_description:
      # PPT 각 페이지 이미지를 LLM(VLM)으로 설명해 본문에 넣을지. false(기본) | true. 켜면 느려지지만 그림·도표 내용이 검색된다
      enable: true
      # 페이지 설명에 쓸 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: page
      # 동시에 설명을 요청할 페이지 수. 기본 16. 늘리면 빨라지지만 모델 서버 부하가 커진다
      concurrency: 16
      # 선택 튜닝: images_scale(렌더 배율) / max_image_side(전송 이미지 최대 변) / max_tokens(출력 상한) / params(추가 VLM 파라미터)

      # 페이지 설명 프롬프트 파일(이 폴더 기준). {{page_text}} 자리에 그 페이지의 글자가 들어간다
      prompt_template_file: prompt_page_image_description_default.md

  # HTML(.html/.htm): docling 은 <iframe srcdoc="..."> 속성값 안의 본문, 접힌 아코디언,
  # div/section 등으로 감싼 <li> 하위 목록을 읽지 못할 수 있다.
  # 크롤링 결과(merged.html)가 이런 모양이면 큰 문서에서도 글자 몇백 자만 나오고 표는 하나도 못 읽으므로,
  # 파싱 전에 srcdoc 을 펼치고 제목(heading) 순서대로 한 문서로 다시 묶는다.
  html:
    # HTML 을 파싱 전에 펼쳐 정리할지. auto(기본)=iframe·접힌 메뉴 등 docling 이 놓치는 구조가 보일 때만
    # | always=항상(본문 영역만 남기고 script/style 제거) | off=그대로 파싱
    flatten: auto
  # 마크다운(.md): docling(기본)이면 docling 의 마크다운 파서로 읽어 제목·표 구조를 살리고
  # enrichment(custom_fields 추출 등)까지 적용한다. 상품설명서(md) 같은 doc_type 이 custom_fields 를 쓰려면
  # docling 문서 객체(DoclingDocument)가 필요하다 — text 모드(langchain TextLoader)에는 enrichment 단계가 없다.
  md:
    # 마크다운을 읽는 방식. docling(기본)=제목·표 구조를 살리고 문서유형 추출까지 적용
    # | text=일반 텍스트로 읽음(구조·문서유형 추출 없음)
    processing_mode: docling

# 변환 PDF: HWP/PPT/DOC/DOCX/이미지처럼 반드시 PDF 로 바꿔야 하는 포맷에서 생긴다.
# GenOS 문서 뷰어는 이렇게 만든 PDF 를 보여 준다.
# (.txt/.json 같은 텍스트 파일은 PDF 를 만들지 않는다 — docling 이 직접 읽는다.)
# 요청 파라미터 keep_pdf / pdf_dir 로 요청마다 덮어쓸 수 있다.
pdf_output:
  # 변환한 PDF 를 남길지. false(기본)=파싱에만 쓰고 요청이 끝나면 지움 | true=남김(문서 뷰어를 쓰는 현장)
  keep: false
  # 변환 PDF 를 만들 폴더. 비우면(기본) 원본 파일과 같은 폴더. 원본 폴더에 다른 파일을 남기기 싫으면 지정한다
  dir: ""

ocr:
  # auto 는 첫 변환 뒤 판정용 LLM 결과·깨진 글자(GLYPH)·글자 없는 페이지를 보고 OCR 로 다시 변환할지 정한다.
  # layout 이 genos_layout(VLM) 이면 첫 변환에서 이미 이미지의 글자를 읽으므로 대부분의 문서는 disable 로 충분하다.
  # 문서·문서유형 단위로 켤 때는 요청 파라미터 ocr_mode: "auto" 또는 CONFIG_BY_DOC_TYPE 의 "ocr.ocr_mode": "auto".

  # OCR(이미지 글자 인식) 서버를 쓸지. disable(기본)=쓰지 않음 | auto=글자가 깨졌거나 비었을 때만 OCR 로 다시 변환
  # | force=항상 OCR 로 변환. 켜면 스캔 문서 품질이 오르지만 느려진다
  ocr_mode: "disable"

  # 쓸 OCR 엔진. paddle(기본) | upstage(외부 API, 아래 upstage 설정 사용)
  engine: "paddle"

  # 글자가 깨진 표 칸만 다시 OCR 할 때 칸 하나의 요청 제한 시간(초). 기본 60. 넘기면 그 칸은 원래 글자를 둔다
  table_cell_ocr_timeout: 60

  # engine: "paddle" 일 때만 사용
  paddle:
    # paddle OCR 서버의 모델 프리셋 이름(model_presets.yaml 의 키)
    model_preset: ocr
    # 인식 신뢰도 하한(0~1). 기본 0.3. 현재 paddle 엔진은 이 값으로 걸러 내지 않는다(upstage 만 적용)
    text_score: 0.3

  # 깨진 글자(GLYPH) 개수로 OCR 을 다시 돌릴지 정하는 기준값
  glyph_detection:
    # 표 칸에 깨진 글자(GLYPH) 표시가 이 개수 이상이면 그 표의 칸을 다시 OCR 한다. 기본 1
    table_cell_threshold: 1
    # auto 모드에서 글 항목 하나에 깨진 글자(GLYPH) 표시가 이 개수를 넘으면 문서 전체를 OCR 로 다시 변환한다. 기본 10
    document_threshold: 10

  # engine: "upstage" 일 때만 사용
  upstage:
    # Upstage OCR API 주소. engine 이 upstage 일 때만 쓴다
    api_endpoint: "https://api.upstage.ai/v1/document-digitization"
    # Upstage API 키. 비워 두면 UPSTAGE_API_KEY 환경변수를 쓴다
    api_key: ""
    # Upstage 에서 쓸 모델 이름. 기본 "ocr"
    model: "ocr"
    # Upstage 요청 1회의 제한 시간(초). 기본 60
    timeout: 60
    # 인식 신뢰도 하한(0~1). 기본 0.5. 이보다 낮은 글자는 버린다. 올리면 잡음은 줄고 놓치는 글자가 는다
    text_score: 0.5

layout:
  # 페이지 구조(제목·본문·표·그림)를 찾는 모델. genos_layout(기본)=VLM 서버 | docling_layout=docling 내장 로컬 모델(서버 불필요)
  layout_model_type: "genos_layout"
  genos_layout:
    # 레이아웃 VLM 서버의 모델 프리셋 이름(model_presets.yaml 의 키)
    model_preset: layout
    # 한 번에 묶어 처리할 페이지 수이자 동시에 VLM 에 보내는 요청 수. 기본 32. 늘리면 빨라지지만 서버 부하가 커진다
    page_batch_size: 128
    # 페이지 하나에 대한 VLM 응답 길이 상한(토큰). 기본 16384. 넘기면 그 페이지는 구조만 받고 글자는 따로 채운다
    max_completion_tokens: 16384
    # VLM 서버에서 쓸 모델 이름. 기본 "dots-mocr"
    model: "dots-mocr"
    # 페이지 하나의 VLM 요청 제한 시간(초). 기본 1200. 넘기면 그 페이지는 구조만 받고 글자는 따로 채운다
    timeout: 3600
    # 일시적인 전송 실패(502 등)의 retry 횟수. 기본 2. 응답이 길이 상한에 걸려 잘리거나 timeout 이 나면
    # retry 하지 않고 fallback 으로 넘어간다
    retry_count: 2
    # 생성 무작위성. 0 에 가까울수록 같은 입력에 같은 결과. 기본 0.1
    temperature: 0.1
    # 생성 시 고려할 후보 단어의 누적 확률(0 초과 1 이하). 기본 0.9. 낮추면 결과가 보수적이 된다
    top_p: 0.9
    # 같은 말 반복 억제 강도. 1.0=억제 없음, 클수록 강하게 억제. 기본 1.15
    repetition_penalty: 1.15

# PDF 파싱 설정 (docling 이 PDF 를 파싱할 때의 속도·품질 조절)
pdf_pipeline:
  num_threads: 8                     # 파싱에 쓸 CPU 스레드 수. 기본 8
  device: "auto"                     # 계산 장치. auto(기본) | cpu | cuda | mps
  images_scale: 2                    # 페이지·그림 이미지를 그릴 배율(정수). 기본 2. 키우면 선명하지만 느리고 무겁다
  # 파싱 뒤에도 페이지 이미지를 남길지. true(기본) | false. 끄면 표 칸 재OCR·표 이미지 잘라내기를 못 한다
  # (table_description 을 켜면 자동으로 true)
  generate_page_images: true
  generate_picture_images: true      # 문서 속 그림을 이미지로 잘라 둘지. true(기본). 이미지 설명·첨부 이미지에 쓰인다
  table_structure_mode: "accurate"   # 표 구조 인식 방식. accurate(기본)=정확 | fast=빠르지만 덜 정확

# enrichment: 파싱한 문서에 LLM 으로 정보를 덧붙이는 단계(목차, 메타데이터, 요약, 그림·표 설명, 필드 추출)
# 각 항목은 {이름: {옵션}} 형식의 list 다.
# 끄는 방법: ① 항목 삭제  ② 항목 주석 처리  ③ enable: false
# 접속 정보는 맨 위 model_presets 에 모아 두고 여기서는 `model_preset:` 으로 부른다.
# 특정 항목만 다른 모델을 쓰려면 그 항목에 url/api_key/model 을 직접 적으면 된다(프리셋보다 우선).
# 프롬프트 파일(*_file)은 이 설정 파일이 있는 폴더 기준 경로이며, 적은 파일이 없거나 비면 서버 시작이 실패한다.
enrichment:
  # 목차 추출: 문서 본문을 LLM 에 보내 목차를 받고, 그 목차에 맞춰 문서의 제목(섹션) 구조를 다시 매긴다.
  # enable: false 면 블록이 통째로 빠지므로 요청 파라미터 toc=1 로도 켜지지 않는다.
  # LLM 호출이 실패하거나 시간을 넘기면 파싱 요청 전체가 실패한다.
  - toc:
      # 목차 추출을 할지. true | false. 요청 파라미터 toc=0 으로 끌 수 있다(false 면 toc=1 로 켤 수 없다)
      enable: false
      # 목차 추출에 쓸 LLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: default
      # 생성 무작위성. 0(기본)=같은 입력에 거의 같은 결과
      temperature: 0.0
      # 생성 시 고려할 후보 단어의 누적 확률. 아주 작게 두면 가장 그럴듯한 답만 고른다. 기본 0.00001
      top_p: 0.00001
      # 난수 시드. 같은 값이면 같은 결과가 나오기 쉽다. 기본 33
      seed: 33
      # LLM 응답 길이 상한(토큰). 기본 10000. 목차가 길어 잘리면 늘린다
      max_tokens: 10000
      precheck:
        # 보내기 전에 입력 길이를 미리 검사할지. true | false. 넘치면 LLM 을 부르지 않고 요청을 실패시킨다
        enabled: true
        # 모델이 받을 수 있는 최대 길이(토큰, 입력+출력). 모델이 바뀌면 이 값을 맞춘다
        model_context_tokens: 128000
        # 그중 응답용으로 남겨 둘 토큰 수. 입력 허용치 = model_context_tokens - 이 값. 기본 max_tokens
        completion_reserved_tokens: 12000
      # 같은 말 반복 억제 강도. 1.0=억제 없음. 기본 보내지 않는다
      repetition_penalty: 1.1
      # thinking(추론) 모드. 적지 않으면 off(추론을 끄는 값을 함께 보낸다). 모델이 알아서 정하게 하려면 thinking: auto.
      # thinking: off | on | auto,  thinking_dialect: standard(enable_thinking) | hcx(force/skip_reasoning)
      # thinking: off
      # thinking_dialect: standard

      # 목차 추출 시스템 프롬프트 파일(이 폴더 기준). 비우면 docling 기본 프롬프트를 쓴다
      system_prompt_file: prompt_toc_default_system.md
      # 목차 추출 사용자 프롬프트 파일(이 폴더 기준). 비우면 docling 기본 프롬프트를 쓴다
      user_prompt_file: prompt_toc_default_user.md
      # 긴 문서는 페이지 묶음으로 나눠 차례로 목차를 뽑는다. 묶음마다 위 system/user 프롬프트를 쓰고,
      # 두 번째 묶음부터는 지금까지 뽑은 목차를 함께 보내 이어 쓰게 한다.
      # 길이가 넘치거나 400 오류가 난 묶음은 건너뛰고, 나머지 목차는 그대로 둔다.
      split:
        # 긴 문서를 페이지 묶음으로 나눠 차례로 목차를 뽑을지. false(기본)=한 번에 | true=길이와 무관하게 항상 나눔
        enabled: false
        pages_per_chunk: 100          # 한 번에 보낼 페이지 수. 기본 5
        page_overlap: 1               # 이웃 묶음끼리 겹칠 페이지 수. 기본 0
        carryover_max_tokens: 1500    # 다음 묶음에 넘겨 줄 지금까지의 목차 길이 상한(토큰). 기본 1500

  # 메타데이터 추출: 앞쪽 몇 페이지를 LLM 에 보내 작성일·작성자 같은 값을 뽑아 출력 metadata 에 싣는다.
  # 실패하거나 시간을 넘기면 경고만 남기고 각 필드를 null 로 둔다(요청은 계속).
  - metadata:
      # 메타데이터 추출을 할지. true | false
      enable: false
      # 메타데이터 추출에 쓸 LLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: default
      # LLM 응답 길이 상한(토큰). 기본 10000
      max_tokens: 10000
      # 생성 무작위성. 0(기본)=같은 입력에 거의 같은 결과
      temperature: 0.0
      # LLM 호출 1회의 제한 시간(초). 기본 3600. 넘기면 필드를 비워 두고 계속한다
      timeout: 3600
      # 읽을 페이지 번호 목록(범위가 아님). [1,4]=1쪽과 4쪽 | [1,2,3,4]=1~4쪽 | 비우면 1~4쪽
      pages: [1,4]
      # 결과에 남길 키 목록. 프롬프트가 내는 JSON 키와 같아야 한다. 비우면 받은 키를 모두 남긴다
      output_fields: [created_date, authors]
      parser:
        type: json   # LLM 응답을 읽는 방식. json(기본)=응답에서 JSON 을 찾아 읽음 | python=parser.file 의 함수로 읽음
      # thinking(추론) 모드. 적지 않으면 off(추론을 끄는 값을 함께 보낸다). 모델이 알아서 정하게 하려면 thinking: auto.
      # thinking: off | on | auto,  thinking_dialect: standard(enable_thinking) | hcx(force/skip_reasoning)
      # thinking: off
      # thinking_dialect: standard

      # 메타데이터 추출 시스템 프롬프트 파일(이 폴더 기준). 비우면 내장 프롬프트를 쓴다
      system_prompt_file: prompt_metadata_default_system.md
      # 메타데이터 추출 사용자 프롬프트 파일(이 폴더 기준). 비우면 페이지 글자를 그대로 보낸다
      user_prompt_file: prompt_metadata_default_user.md
      # 아래 precheck 는 docling 내장 메타데이터 경로용이다. 위처럼 프롬프트·output_fields·parser 를 적은
      # 설정에서는 쓰이지 않는다.
      precheck:
        # 입력 길이 사전 검사 여부. 이 설정(프롬프트를 직접 지정)에서는 쓰이지 않는다
        enabled: true
        # 모델 최대 길이(토큰). 이 설정(프롬프트를 직접 지정)에서는 쓰이지 않는다
        model_context_tokens: 128000
        # 응답용으로 남길 토큰 수. 이 설정(프롬프트를 직접 지정)에서는 쓰이지 않는다
        completion_reserved_tokens: 12000

  # 문서 요약: 본문 앞부분을 LLM 에 보내 요약 한 편을 만들어 출력 metadata.doc_summary 에 싣는다.
  # 이미지·표 설명 프롬프트가 {{doc_summary}} 로 이 요약을 함께 쓴다(꺼져 있으면 "-").
  - doc_summary:
      # 문서 요약을 만들지. true | false. 이 키를 빼면 true 로 본다. 요청 파라미터 doc_summary=1 로 요청마다 켤 수 있다
      enable: false
      # 요약에 쓸 LLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: default
      # 요약 프롬프트 파일(이 폴더 기준). {{full_text}} 자리에 본문이 들어간다. 비우면 내장 프롬프트를 쓴다
      prompt_file: prompt_doc_summary.md
      # 요약에 보낼 본문 앞부분 글자 수. 기본 6000. 늘리면 뒷부분까지 반영되지만 호출이 느려진다
      max_chars: 6000
  # 이미지 설명: 문서 속 그림마다 VLM 에 이미지와 앞뒤 본문을 보내 설명을 받아 그림에 붙인다.
  # 실패한 그림은 경고만 남기고 건너뛴다.
  - image_description:
      # 그림 설명을 만들지. true | false. 요청 파라미터 img_desc=1/0 으로 요청마다 바꿀 수 있다
      enable: false
      # 그림 설명에 쓸 VLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: image
      # 동시에 설명을 요청할 그림 수. 기본 4. 늘리면 빨라지지만 모델 서버 부하가 커진다
      concurrency: 16
      # 그림 앞에서 문맥으로 가져올 본문 항목 수. 기본 3
      before_items: 3
      # 그림 뒤에서 문맥으로 가져올 본문 항목 수. 기본 2
      after_items: 2
      # 프롬프트 전체(문맥·캡션·요약 포함)의 최대 글자 수. 기본 1500. 넘으면 뒤를 자른다
      max_context_chars: 1500
      # 그림 설명 프롬프트 파일(이 폴더 기준)
      prompt_template_file: prompt_image_description_default.md
      # ── 차트 처리 ──
      chart:
        # 차트를 차트 전용 프롬프트로 설명할지. false(기본)=모든 그림을 일반 설명 | true=차트 처리 수행
        enable: false
        # 무엇을 차트로 볼지. auto(기본)=docling 이 차트로 분류한 그림만 | all=모든 그림
        detection: auto
        # 차트 설명 프롬프트 파일(이 폴더 기준). 비우면 일반 그림 프롬프트를 쓴다
        chart_prompt_file: prompt_chart_description_default.md
  # 표 설명(이미지 기반): 표 영역을 페이지 이미지에서 잘라 VLM 에 보내 요약을 받아 표에 붙인다.
  # 아래 table_text_description 이 켜져 있으면 그쪽이 우선하고 이 항목은 실행되지 않는다.
  - table_description:
      # 이미지 기반 표 설명을 만들지. true | false. 이 키를 빼면 true 로 본다. 요청 파라미터 table_desc=1 로 요청마다 켤 수 있다
      enable: false
      # 표 설명에 쓸 VLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: image
      # 동시에 설명을 요청할 표 수. 기본 4
      concurrency: 8
      # 표 앞에서 문맥으로 가져올 본문 항목 수. 기본 3
      before_items: 3
      # 표 뒤에서 문맥으로 가져올 본문 항목 수. 기본 2
      after_items: 2
      # 앞·뒤 문맥 각각의 최대 글자 수. 기본 1500
      max_context_chars: 1500
      # 표 요약 프롬프트 파일(이 폴더 기준)
      prompt_template_file: prompt_table_description_default.md
      # ── 표 구조 다시 만들기(refine): true(또는 요청 파라미터 table_refine=1)면 VLM 이 다시 만든 HTML 로 표를 바꾼다 ──
      refine:
        # 표 구조도 VLM 으로 다시 만들어 표 본문을 바꿀지. false(기본) | true. 검증에 통과한 경우에만 바꾼다
        enable: false
        # 표 재구성(HTML)과 요약을 함께 받는 프롬프트 파일(이 폴더 기준). 비우면 위 요약 프롬프트를 쓴다
        prompt_file: prompt_table_refine_combined.md

  # 텍스트 표(HTML·마크다운 표)에 검색용(RAG) 설명을 만든다. true 또는 요청 파라미터 table_text_desc=1 로 켠다.
  # 문서 안의 여러 표는 되도록 한 번의 호출로 처리한다.
  #
  # 아래 model_preset(또는 url/model)으로 연결이 정해지면 custom_fields 의 LLM 사용 여부와 상관없이
  # 표 설명을 이 연결로 직접 만든다(권장). 그래야 custom_fields 가 LLM 을 쓰지 않는 문서유형(tabular/json 매핑)이나
  # 매칭 설정이 없는 문서에도 표 설명이 붙는다.
  # 연결이 없으면 매칭된 문서형 custom_fields YAML 의 연결을 빌려 쓴다(그 경우 위 문서들은 제외).
  # 실패하면 경고만 남기고 표 설명 없이 계속한다.
  #
  # 한 번의 호출에 표를 몇 개 담을지는 입력(model_context_tokens)과 출력(max_tokens) 중
  # 먼저 한도에 닿는 쪽이 정하고, 넘치면 여러 묶음(batch)으로 나눠 concurrency 만큼 동시에 부른다.
  #   출력 기준 상한 = max_tokens / ((retrieval_context_max_chars
  #                    + key_fact_limit x key_fact_max_chars + search_terms 몫 + 120) x 1.5)
  # 표마다 만들 내용(아래 rag 값)을 늘리면 묶음이 작아지고 호출 수가 늘어난다.
  - table_text_description:
      # 텍스트 표(HTML·마크다운 표)의 검색용 설명을 만들어 표 앞에 붙일지. true | false.
      # 요청 파라미터 table_text_desc 로 요청마다 바꿀 수 있다
      enable: true
      # 표 설명에 쓸 LLM 모델 프리셋 이름(model_presets.yaml 의 키)
      model_preset: default
      model_context_tokens: 40000  # 모델이 받을 수 있는 최대 길이(토큰). 기본 128000. 모델이 바뀌면 이 값만 수정
      max_tokens: 4000        # 응답 길이 상한(토큰). 기본 4000. 한 번에 담는 표 개수도 이 값이 정한다. 서빙의 출력 상한 이하로 둔다
      concurrency: 8          # 동시에 보낼 호출 수. 기본 8
      temperature: 0.0        # 생성 무작위성. 0(기본)=같은 입력에 거의 같은 결과
      timeout: 600            # 호출 1회의 제한 시간(초). 기본 300. 넘기면 그 묶음의 표는 설명 없이 계속한다
      # 표 설명 프롬프트 파일(이 폴더 기준). 비우면 표 설명을 건너뛴다
      prompt_template_file: prompt_table_text_description_rag.md
      before_items: 3          # 표 앞에서 문맥으로 가져올 본문 항목 수. 기본 3
      after_items: 2           # 표 뒤에서 문맥으로 가져올 본문 항목 수. 기본 2
      max_context_chars: 1500  # 앞·뒤 문맥 각각의 최대 글자 수. 기본 1500
      rag:
        retrieval_context_max_chars: 200 # 표 설명 본문의 최대 글자 수. 표가 여러 청크로 나뉘면 청크마다 반복된다. 기본 350
        key_fact_limit: 2                # 표에서 뽑을 핵심 사실 최대 개수. 기본 3
        key_fact_max_chars: 120          # 핵심 사실 1개의 최대 글자 수. 기본 160
        search_terms: 0                  # 검색어 개수. 0(기본)=만들지 않음 | N=최대 N개를 만들어 청크에 싣는다
      # LLM 에 보내지 않을 표의 종류(skip). 아래 값은 코드 기본값과 같으므로 적지 않아도 동작이 같다.
      # 하나라도 맞는 표는 보내지 않는다. `skip: false` 는 다섯 개를 모두 끄고, 문서유형 YAML 의 skip 과는 키 단위로 합쳐진다.
      # skip:
      #   single_value_table: true       # 값이 한 칸뿐이거나 데이터 행이 없는 표
      #   nested_table: true             # 다른 표의 칸 안에 든 표(설명을 붙일 청크가 없어 false 로 바꿔도 설명은 버려진다)
      #   duplicate_table: false         # 앞선 표 하나에 모든 행이 행 단위로 이미 실린 표
      #   self_describing_table: false   # 제목이 있고, 병합 셀이 없고, 데이터 5행 이하·2~3열이며, 값 칸이 문장이고, 금액·비율·기간이 없는 표
      #   long_text_table: 0             # 첫 행·첫 열을 뺀 값 칸 평균 문자 수가 이 값 이상인 표(0=끔)

  # ── 문서 유형별 custom_fields 추출 ─────────────────────────────────────────
  # custom_fields 는 doc_type 마다 문서에서 뽑을 필드와 매핑 규칙이다. 요청의 doc_type 과 같은 항목만 동작한다.
  # 배포할 때 enable 과 쓸 모델(서빙 ID)을 맞춘 뒤 사용한다.
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: card                     # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_card.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)

  # ── 모니모 문서유형 14종 ─────────────────────────────────────────────────────
  # 모니모(고객사 사이트)에서 쓰는 문서유형이다. 요청의 doc_type 이 아래 값 중 하나면
  # 같은 폴더의 custom_field_<doc_type>.yaml 규칙으로 문서에서 필드를 뽑는다.
  # 메뉴서비스
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: menu                     # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_menu.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)
  # 용어사전
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: term                     # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_term.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)
  # FAQ
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: faq                      # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_faq.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)
  # 이벤트
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: monimo_event             # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_monimo_event.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)
  # 관심소식
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: monimo_news              # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
      config_file: custom_field_monimo_news.yaml   # 이 문서유형의 필드 추출 규칙 파일(이 폴더 기준)
  # 상품설명서 — 생명
  - custom_fields:
      enable: true                       # 이 문서유형 설정을 쓸지. true(기본) | false
      doc_type: product_slf              # 요청의 doc_type 이 이 값과 같을 때 적용한다(대소문자 무시)
