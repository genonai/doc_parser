# 금융용어사전 Excel 행
# 헤더: ID | 회사명 | 용어(국문) | 정의·설명 | 최종수정일

schema: v2
source:
  kind: rows
  # 처리할 시트 이름 목록. 적으면 그 시트만 처리하고, 적은 시트가 파일에 없으면 PARSE_D013 으로 실패한다.
  # 생략하면 모든 시트를 처리한다(필수 열이 없는 시트가 하나라도 있으면 문서가 실패한다).
  # 시트 이름은 앞뒤 공백까지 원문 그대로 적는다.
  # sheets: [공통_용어사전]
fields:
  BIZ_ID:
    alias: [ID, 아이디]
    default: null
  GROUP_C:
    alias: [회사, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  TERM:
    alias: [용어, 용어(국문), 용어국문]
  TERM_NORM:
    alias: [용어, 용어(국문), 용어국문]
    transform: normalize
  DEFINITION:
    alias: [설명, 정의·설명, 정의 설명, 정의]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int
  SYNONYMS:
    default: null
require:
  fields: [GROUP_C, TERM, TERM_NORM, DEFINITION]
body:
  fields: [TERM, DEFINITION]
  labels:
    TERM: 용어
    DEFINITION: 설명
  split: true
  repeat: [TERM]
