# 문서 유형 card(카드 상품 페이지)의 custom_fields 설정 — LLM 으로 카드 상품 정보 12개 필드를 뽑는다.
# custom_fields 는 doc_type 마다 문서에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
#
# 적재용이 아니라 시연용 설정이다. 필드 이름이 모니모(고객사 사이트) 적재 테이블 TB_PRODUCT 와 맞지 않는다.
#    아래 12개 필드는 마케팅용으로 나열한 필드라 TB_PRODUCT 의 필수 컬럼 PRODUCT_C·GROUP_C(NOT NULL)와
#    SUMMARY_TEXT(임베딩할 텍스트)가 없고, 연회비·혜택은 PRODUCT_ATTRS(JSON 컬럼) 안에 들어가야 한다.
#    적재용으로는 genon/sites/monimo 아래의 custom_field_product_hpp.yaml(doc_type: product_hpp)을 쓴다.
#    이 파일은 doc_type: card 를 쓰는 시험 스크립트(tools/parse_chunk/parse_chunk_test.sh,
#    tools/code_serving/serving_gateway_test.sh)가 깨지지 않도록 그대로 둔다.
#
# 등록 방법 — 이 파일을 쓰는 설정 YAML(parse activity 는 config.yaml, resource 는 intelligent·convert_processor_config.yaml)의
#    enrichment 목록에 아래 항목을 둔다(지금 등록돼 있다):
#   - custom_fields:
#       enable: true
#       doc_type: card
#       config_file: custom_field_card.yaml   # 상대 경로는 config.yaml 이 있는 폴더(이 폴더) 기준
# extractor(필드를 만드는 방식)는 적지 않으면 아래 source.kind 로 정해진다(document → llm).
# config.yaml 의 등록 항목에 같은 키를 null 이 아닌 값으로 적으면 이 파일의 값보다 우선한다.
#
# 프롬프트를 이 파일 안에 직접 적어 두어 별도 md 파일이 필요 없다.
# 읽을 페이지(pages)를 정하지 않았으므로 문서 전체를 텍스트로 바꿔 LLM 에 보낸다
# (카드 상품 페이지는 정보가 13개 섹션에 흩어져 있어 전체를 본다).

schema: v2
source:
  kind: document
  # 원본이 .json 이고 본문이 그 안의 값으로 들어 있을 때 쓰는 전처리다. 본문(markdown/html
  # 문자열)이 담긴 key 이름을 적는다 — 경로가 아니라 이름만 적으며, 어느 깊이에 있든
  # 문서 순서대로 모으므로 `pages[*].html` 같은 배열도 그대로 처리된다. 항목이 여러 개면
  # 항목마다 <h2> 섹션을 둔 문서 하나로 합쳐 docling 을 한 번만 부른다.
  # 이 블록이 없으면 .json 원문을 그대로 docling 에 넘긴다(표·제목 구조가 남지 않는다).
  pre:
    json:
      body_from: [html, summary_md]
      format: auto             # auto(기본, 값 내용으로 판별) | html | markdown
      on_missing: skip         # skip(기본, 경고만) | error
llm:
# 뽑을 필드 목록. 프롬프트가 내는 JSON 키와 같아야 한다
- out: [issuer_name, product_name_norm, annual_fee_amount, family_annual_fee_amount, overseas_payment_yn,
    transit_card_yn, joinable_yn, product_name, benefit_text, join_condition_text, family_annual_fee_text,
    annual_fee_text]
  parser:
    type: json
  # 접속 정보는 config.yaml 의 model_presets 에 모아 두고 여기서는 프리셋 이름만 부른다.
  # 이 항목만 다른 모델을 쓰려면 url/api_key/model 을 직접 적는다(직접 적은 값이 우선한다)
  endpoint:
    model_preset: default
  # 원문을 그대로 옮기는 *_text 필드가 길 수 있어 max_tokens 를 넉넉히 잡는다
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300
  # 프롬프트가 길어지거나 여러 doc_type 이 함께 쓰게 되면 system_prompt_file / user_prompt_file 로
  # 파일을 나눠도 된다 — 파일로 지정한 쪽이 이 안에 적은 프롬프트보다 우선한다
  prompt:
    system: |
      너는 카드 상품 정보추출 전문가다. 주어진 카드 상품 페이지 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 요청된 12개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
      - 문서에 없는 정보를 지어내지 않는다(환각 금지). 추론이 필요한 yn 필드만 문맥 근거로 판단한다.

      필드별 형식:
      - `issuer_name`: 카드 발급사명 문자열(예: "삼성카드"). 없으면 null.
      - `product_name_norm`: 상품명 정규화 문자열. `product_name` 에서 앞뒤 공백·중복 공백·불필요한 수식/마케팅 문구·괄호 부가설명을 제거한 대표 명칭. 반드시 채운다(원 상품명 기반으로라도 생성).
      - `annual_fee_amount`: 국내 기준 "본인" 연회비를 정수(원)로. 콤마와 "원" 등 단위를 제거한 숫자만(예: 18000). 브랜드/등급별로 여러 값이면 가장 낮은 기본 값. 없으면 null.
      - `family_annual_fee_amount`: 가족카드 연회비를 정수(원)로. 없으면 null.
      - `overseas_payment_yn`: 해외결제(해외 가맹점 결제) 가능 여부. "Y" 또는 "N".
      - `transit_card_yn`: 후불/모바일 교통카드 기능 제공 여부. "Y" 또는 "N".
      - `joinable_yn`: 현재 신규 발급(가입) 가능 여부. 단종·발급중단 문구가 있으면 "N", 그 외 정상 판매 상품은 "Y".
      - `product_name`: 카드 상품명 원문 문자열. 반드시 채운다.
      - `benefit_text`: 주요 혜택 관련 원문 텍스트(요약·재작성 금지, 문서 원문 그대로 발췌).
      - `join_condition_text`: 가입조건 관련 원문 텍스트.
      - `family_annual_fee_text`: 가족연회비 관련 원문 텍스트. 없으면 null.
      - `annual_fee_text`: 연회비 관련 원문 텍스트.

      출력 예시 형식(값은 예시):
      {"issuer_name": "삼성카드", "product_name_norm": "...", "annual_fee_amount": 18000, "family_annual_fee_amount": null, "overseas_payment_yn": "Y", "transit_card_yn": "Y", "joinable_yn": "Y", "product_name": "...", "benefit_text": "...", "join_condition_text": "...", "family_annual_fee_text": null, "annual_fee_text": "..."}
    user: |
      아래 카드 상품 페이지 문서에서 다음 12개 필드를 추출하라.

      - issuer_name (발급사명)
      - product_name_norm (상품명 정규화) — 필수
      - annual_fee_amount (연회비, 정수 원)
      - family_annual_fee_amount (가족연회비, 정수 원)
      - overseas_payment_yn (해외결제 가능, Y/N)
      - transit_card_yn (교통카드 가능, Y/N)
      - joinable_yn (가입 가능 여부, Y/N)
      - product_name (상품명) — 필수
      - benefit_text (혜택 원문)
      - join_condition_text (가입조건 원문)
      - family_annual_fee_text (가족연회비 원문)
      - annual_fee_text (연회비 원문)

      반드시 위 12개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

      <document>
      {{raw_text}}
      </document>
