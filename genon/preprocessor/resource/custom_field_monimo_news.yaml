# 관심소식 상세 HTML → TB_NEWS 목표필드 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: monimo_news
#       config_file: custom_field_monimo_news.yaml
#
# 원천: TD00008459_d_5199.html.json (카드 WCMS) — 문서 하나가 관심소식 한 건이다.
#
#   {"wcmsData": {"html": {"content": "<div class=\"newsletter-article-wrap\" ...>"},
#                 "json": {}}}
#
# 즉 **값이 있는 곳은 `content` 하나**이고, 그 안의 상세 HTML 에서 제목·카테고리·요약·
# 상세·출처를 뽑는다. `source.pre.json.body_from` 이 그 값을 꺼내 docling 에 먹이고,
# 뽑기는 아래 `llm` 이 맡는다.
#
# custom_field_monimo_event.yaml 과 짝을 이루므로 한쪽을 고치면 다른 쪽도 함께 본다.

schema: v2

# ── 참고: 옛 원천(eventList 레코드 배열) 설정 ────────────────────────────────
# 관심소식이 이벤트와 같은 `eventList` 구조로 오던 시절의 설정이다. 새 원천에는 배열도
# 한글 키도 없어 그대로는 한 값도 잡히지 않는다. 되돌릴 일이 생기면 여기서 꺼내 쓴다.
#
# 입력 예시:
#   {"eventList": [{"ID": "CM26061182", "회사명": "모니모",
#                   "제목": "하이마트 구독을 가볍게 매월 최대2만원 까지 혜택",
#                   "카테고리": "가전", "키워드": "하이마트 구독",
#                   "개시 시작일": "260701", "개시 종료일": "260731",
#                   "사용여부": "N", "노출여부": "Y",
#                   "wcmsHtml": {"htmlText": "상세 내용"}}]}
#
# source:
#   kind: records
#   records_at: eventList
#   on_missing: error
# fields:
#   BIZ_ID:
#     alias: [ID, 아이디]
#     default: null
#   GROUP_C:
#     alias: [회사명, corp_code, 고객사]
#     default: IFP
#     values:
#       IFP: [모니모]
#       SLF: [삼성생명, 생명]
#       SSF: [삼성화재, 화재]
#       HPP: [삼성카드, 카드]
#       SSS: [삼성증권, 증권]
#   TITLE:
#     alias: [제목, title, evtTodayMainCopy]
#   KEYW_CTGR_NM:
#     alias: [카테고리, 키워드, 코너명]
#     default: null
#   CN_URL:
#     alias: [buttonLink, detailUrl, 콘텐츠 상세 경로, 상세경로]
#   NEWS_TO:
#     alias: [개시 종료일, 종료일, endDate, evtPtrmEndDt]
#     transform: date_int_flex
#   DETAIL_HTML:
#     alias: [htmlText, 상세내용]
#   DETAIL_TEXT:
#     alias: [htmlText, 상세내용]
#     transform: html_text
# require:
#   fields: [TITLE]
# body:
#   fields: [TITLE, DETAIL_TEXT]
#   labels:
#     TITLE: 제목
#     DETAIL_TEXT: 상세내용
#   split: true
#   repeat: [TITLE]
# ── 참고 끝 ──────────────────────────────────────────────────────────────────

source:
  kind: document
  pre:
    json:
      # 본문이 담긴 원천 key 이름. 경로가 아니라 이름이라 `wcmsData.html.content` 도
      # 임의 깊이에서 잡힌다. 값이 HTML 이므로 `auto` 가 html 로 판별한다.
      body_from: [content]
      format: auto
      # skip: 경고만 남기고 빈 문서로 진행 / error: 기동이 아니라 그 문서의 파싱을 실패시킨다.
      # 이 원천은 content 가 곧 문서 전체라, 비어 있는 건을 조용히 색인하는 것이 문제가
      # 된다면 error 로 올린다.
      on_missing: skip
fields:
  BIZ_ID:
    # 새 원천(content 하나뿐)에는 아직 ID key 가 없어 값이 비어 있다. 원천이
    # `ID`/`id` 를 실어 주면 그대로 잡힌다.
    alias: [ID, id]
    default: null
  GROUP_C:
    default: IFP
  USE_YN:
    default: Y
body:
  # 첫 청크 앞에 카테고리·제목을 한 번 붙여 검색어가 본문과 같은 청크에 있게 한다.
  once: [CATEGORY, TITLE]
  labels:
    CATEGORY: 카테고리
    TITLE: 제목
llm:
- out: [TITLE, CATEGORY, SUMMARY, DETAIL, SOURCE]
  parser:
    type: json
  endpoint:
    url: http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions
    api_key: ''
    model: model
  params:
    # DETAIL 이 상세 본문을 그대로 옮겨 담는 필드라 출력이 길다. 본문이 긴 소식에서
    # 응답이 잘리면 이 값을 먼저 올린다.
    max_tokens: 8000
    temperature: 0.0
    timeout: 300
  prompt:
    # 프롬프트가 class 이름이 아니라 **나오는 순서**로 필드를 지목하는 이유:
    # LLM 이 받는 것은 상세 HTML 원문이 아니라 docling 이 파싱한 평문이라, class 이름도
    # 사용자 속성(`newsletter-title`)도 남아 있지 않다. 아래 순서는 실제 파싱 결과를
    # 확인해 적은 것이다.
    system: |
      너는 모니모 관심소식(뉴스레터) 상세 문서에서 값을 뽑는 정보추출 전문가다.

      문서는 상세 HTML 을 파싱한 평문이라 태그도 class 이름도 남아 있지 않다.
      아래 **나오는 순서**로 필드를 판단한다.

      - 맨 앞의 파일명 한 줄(`TD00008415_d_5199.html`)과 섹션 라벨 한 줄(`content#1`)은
        본문이 아니다. 무시한다.
      - 그 다음의 짧은 한 줄 → `CATEGORY` (코너명. 예: `이슈산책`, `오늘한잔`)
      - 그 다음의 한 문장 → `TITLE` (소식 제목)
      - 그 다음의 짧은 한 줄은 발행사 로고의 대체텍스트다(예: `삼성카드`). 어느 필드에도
        넣지 않는다.
      - 불릿 목록이 시작되기 전까지의 문단 전체 → `SUMMARY`
      - `-` 로 시작하는 불릿 목록 전체 → `DETAIL`
      - 맨 끝의 `by. ` 로 시작하는 한 줄 → `SOURCE`

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 TITLE, CATEGORY, SUMMARY, DETAIL, SOURCE 다섯 개를 모두 넣는다.
      - 원문에 없는 정보를 지어내지 않는다(환각 금지). 근거가 없으면 값을 null 로 둔다.
      - SUMMARY 는 원문이 여러 문단으로 쪼개져 있어도 순서대로 이어 붙인다. 새로 요약하지
        말고 있는 문장을 그대로 옮긴다.
      - DETAIL 도 줄이거나 다듬지 않는다. 불릿 본문을 순서대로 그대로 옮기고, 불릿 안에
        섞인 그래프 수치 나열(`가동 가맹점수 전체 2023년 6월 1.0, …`)도 본문의 일부이므로
        함께 싣는다.
      - `SOURCE` 는 `by. ` 로 시작하는 줄이 있을 때만 채운다. 원문에서 출처가 주석
        처리되어 들어오는 문서가 있고, 그 경우 값은 null 이다.
    user: |
      다음 문서에서 TITLE, CATEGORY, SUMMARY, DETAIL, SOURCE 필드를 추출하라.

      <document>
      {{raw_text}}
      </document>
