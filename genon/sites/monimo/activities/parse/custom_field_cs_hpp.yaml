# 고객센터(카드) JSON 레코드
# CONT 의 HTML 은 계층을 h태그가 아니라 도형 마커(◈ ▣ ■)로만 표현한다(processing/converters/html_flatten.py 참고).

schema: v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    # 파일명의 첫 숫자 구간까지. 뒤에 붙는 _init / _delta_001 등은 버린다.
    # 예: hpp_rag_adcc_237219_init.json → hpp_rag_adcc_237219 (한 파일의 레코드가 모두 같은 값)
    alias: [$file]
    transform: {name: regex_extract, pattern: '^(.+?_\d+)(?=[_.])'}
    default: null
  GROUP_C:
    alias: [회사명, company, corp_code]
    const: HPP
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CTGR_L1:
    alias: [ORN_NM, 대분류]
    default: null
  CS_CTGR_L2:
    alias: [LV2_THEMA_TERY_NM, 중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [TIT_NM, 제목, 대표질문]
  CONTENT:
    alias: [CONT, 안내본문, 답변]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [KEYW_LIS]
    default: null
    transform: [{name: to_json, key: "KEYW_LIS"}]
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [UD_DTM]
    default: null
    # 다른 문서유형과 같은 정수 YYYYMMDD 로 맞춘다(기간 필터·최신순 정렬). 값이 없으면 0(날짜 없음).
    transform: date_int
require:
  fields: [CUSTOM_TITLE]
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
