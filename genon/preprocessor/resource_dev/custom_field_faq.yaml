# FAQ Excel 행 → TB_FAQ 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: faq
#       extractor: tabular_mapping
#       config_file: custom_field_faq.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
#
# 원천: monimo_rag_adaq_yyyymmdd_full_001.* — 수집데이터목록의 확장자가 "미정"이다.
#   - 표 형태(카드 FAQ)   : id | corp_code | depth3 | depth4 | description | 최종수정일 | 노출여부
#   - JSON 형태(모니모 FAQ): faqMenuList[] — depth1~4 · id · corp_code · description · url · app_route …
#
# 두 형태를 doc_type=faq 하나로 함께 받는다.
#   이 파일은 xlsx/csv 경로(tabular_mapping)를, 형제 파일 custom_field_faq_json.yaml 이
#   .json 경로(json_mapping)를 담당한다. 파서가 확장자로 분기하므로 doc_type 이 같아도 충돌하지 않는다.
#   원천 포맷이 확정되면 쓰지 않는 쪽을 enable:false 로 내리면 된다.
#
# 목표필드명은 TB_FAQ 컬럼명(대문자)을 그대로 쓴다.

column_map:
  BIZ_ID:       [id, 아이디]                            # 원천 FAQ 번호 (중복 감지용)
  GROUP_C:      [corp_code, 회사명, 고객사]              # 고객사 (NOT NULL) — 원천이 이미 코드일 수 있다
  FAQ_CTGR_NM:  [depth3, 분류, 카테고리, FAQ분류]        # FAQ 분류 (주제영역과 다름)
  QUESTION:     [대표질문, 질문, depth4]                 # 대표질문 (NOT NULL)
  ANSWER:       [답변, 답변내용, description]            # 답변 본문 (NOT NULL)
  # QUESTION/ANSWER 는 청크 본문에 실리는 필드라 별칭 첫 값이 곧 본문 라벨이 된다.
  # 원천 헤더인 depth4/description 을 앞에 두면 "depth4: …" 로 렌더되어 검색어와 겹치지 않으므로
  # 사람이 읽는 이름을 앞에 둔다 — 원천 헤더는 목록에 남으므로 컬럼 매칭은 그대로다.
  SRC_LAST_MOD_DT:       [최종수정일]

# ── 값 별칭 → 표준 코드 ─────────────────────────────────────────────────────
# corp_code 는 이미 "HPP" 같은 코드로 오지만, 표준값 자신도 자동 별칭이라 그대로 통과한다.
value_map:
  GROUP_C:
    IFP: [모니모]
    SLF: [삼성생명, 생명]
    SSF: [삼성화재, 화재]
    HPP: [삼성카드, 카드]
    SSS: [삼성증권, 증권]

transforms:
  SRC_LAST_MOD_DT: date_int_flex

required:
  - GROUP_C
  - QUESTION
  - ANSWER

defaults:
  STATUS: "PUBLISHED"              # TB_FAQ 기본값과 동일
  BIZ_ID: null
  FAQ_CTGR_NM: null
  # 앱 딥링크: 표 형태 원천에는 대응 컬럼이 없다. JSON 형태의 url / app_route 를 쓸지
  # 원천 담당 확인 필요(url 은 데이터 경로, app_route 는 메뉴 경로라 둘 다 딥링크가 아니다).
  # DEEP_LINK_URL: null
  # EFFECTIVE_FROM: null                 # 유효시작 — 원천 미제공
  # EFFECTIVE_TO: null                   # 유효종료 — 원천 미제공

# ── 원천에 없는 필드를 행마다 LLM 으로 생성 ─────────────────────────────────
# QUESTION_VARIANTS 는 TB_FAQ 에 JSON 타입이다. "표현이 달라도 찾아지게" 하는 용도라
# 대표질문을 바꿔 말한 문장들을 만든다.
# llm_fields:
#   - output_fields: [QUESTION_VARIANTS]
#     input_fields:  [QUESTION, ANSWER]
#     concurrency: 4
#     on_error: null

#     # <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
#     url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
#     api_key: ""
#     model: model

#     max_tokens: 800
#     temperature: 0.0
#     timeout: 60

#     parser:
#       type: json

#     system_prompt: |
#       너는 고객센터 FAQ 검색 품질 담당자다. 대표질문을 이용자가 실제로 물어볼 법한 표현으로 바꿔 쓴다.

#       규칙:
#       - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
#       - 키는 `QUESTION_VARIANTS` 하나다. 값은 문자열 배열이다.
#       - 같은 답변으로 해결되는 질문만 넣는다. 답변 범위를 벗어나는 질문은 넣지 않는다.
#       - 구어체·준말·오탈자에 가까운 실제 검색 표현을 섞는다(예: "언제 환불돼요?", "환불 며칠 걸리나요").
#       - 대표질문을 그대로 복사하지 않는다.
#       - 3~6개로 제한한다. 마땅한 변형이 없으면 빈 배열 [] 을 반환한다.

#       출력 예시 형식(값은 예시):
#       {"QUESTION_VARIANTS": ["카드 한도 올리려면?", "이용한도 상향 신청 방법"]}

#     user_prompt: |
#       아래 FAQ 의 유사질문을 정리하라.

#       - QUESTION_VARIANTS (유사질문 배열)

#       반드시 `QUESTION_VARIANTS` 키 하나를 가진 JSON 객체로만 반환하라.

#       <faq>
#       {{raw_text}}
#       </faq>

# ── [선택] 청크 본문에 함께 실을 항목명 ─────────────────────────────────────
# 본문 필드를 `항목명: 값` 으로 낸다. 여기 이름이 없는 필드는 값만 나간다.
# 사람이 검색어로 쓰는 말을 적는다 — 목표필드명(DB 컬럼명)이나 원천 key 는 검색어에 안 나온다.
# 값에 줄바꿈이 있는 블록(상세 본문 등)에는 붙지 않는다. 그 블록은 이미 자기 제목을 갖는다.
field_labels:
  QUESTION: 질문
  ANSWER: 답변

# ── 청크 text 본문 구성 순서 (개행 결합) ──────────────────────────────────────
# TB_FAQ 에는 SUMMARY_TEXT 컬럼이 없다 — 질문과 답변 자체가 검색 단위다.
text_fields:
  - QUESTION
  - ANSWER

# 긴 답변은 chunk_size 기준으로 나누고, 모든 조각에 질문을 반복한다.
split: true
chunk_prefix_fields:
  - QUESTION
