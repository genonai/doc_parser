# 청킹 전용 전처리기(Chunk API, /chunker) 설정 — 모니모 GenOS Temporal 파이프라인 #284
#
# 이 facade(chunking_processor.py)는 파싱(docling) 결과를 입력으로 받아 청킹만 수행한다.
# 파싱/로딩/OCR/레이아웃/enrichment 는 앞단계(파싱 Activity)에서 이미 끝났으므로
# 여기서는 호출되지 않는다. 따라서 ocr/layout/pdf_pipeline/enrichment 섹션은 두지 않으며,
# 미설정 시 코드 기본값으로 안전하게 폴백된다.

defaults:
  # 5=DEBUG, 4=INFO, 3=WARNING, 2=ERROR, 1=CRITICAL, 0=NOLOG
  log_level: 4

# 청킹(GenosSmartChunker) 설정
chunking:
  # 청크 최대 크기(공통): docling=GenosSmartChunker max_tokens · parse-format=문자 splitter 크기.
  # char 모드면 문자 수, huggingface 모드면 docling 은 토큰 수(parse-format 은 항상 문자 수).
  # 우선순위: 호출 kwargs 의 chunk_size > 아래 chunk_size. docling: 0=분할 안 함, 0 초과 시 최소 1024 로 보정.
  # parse-format: chunk_size 0/음수면 사실상 미분할(1000000). 미설정이면 위 공통 chunk_size 사용.
  chunk_size: 1000
  # 청킹 모드: split_only(기본) = 파서 섹션 단위(제N조 등) 그대로 유지 + chunk_size 초과 섹션만 분할
  #             (작은 섹션을 장 단위로 병합하지 않음) |
  #           resize_all = 모든 청크를 chunk_size 에 맞게 병합/분할. 우선순위: kwargs.chunk_mode > 아래.
  chunk_mode: split_only
  # 표를 본문과 섞지 않고 독자 청크로 만들지 여부(기본 true).
  # 표 청크에는 섹션 제목·표 캡션·표 설명이 함께 실리고, chunk_size 를 넘는 큰 표는
  # 행 단위로 나뉘며 조각마다 표 헤더 행이 반복된다.
  # false 로 내리면 예전처럼 표가 앞뒤 본문과 한 청크로 묶인다.
  # 우선순위: kwargs.table_as_chunk > 아래 > true.
  table_as_chunk: true
  # 청크 텍스트 선두에 "HEADER: <섹션 경로>" 라인을 붙일지 여부(기본 true).
  # false 면 순수 본문만 산출된다(검색 시 섹션 문맥이 사라지므로 기본값 변경은 신중히).
  # 섹션 경로는 이 라인 한 곳에서만 붙는다 — 본문 내 제목 반복은 제거되었다.
  # 우선순위: kwargs.include_chunk_header > 아래 > true.
  include_chunk_header: true
  # 청크 텍스트 정제(RAG 검색용). off(기본) | safe
  # safe 로 켜면 검색 매칭을 방해하는 문자 노이즈만 결정적으로 제거한다.
  #   - 한글 자모 분리(NFD) 복원, BOM/제로폭/제어문자 제거
  #   - NBSP 등 특수 공백을 일반 공백으로, 줄바꿈을 LF 로 통일
  #   - 전각 영숫자를 반각으로, 따옴표/대시를 통일
  #   - 줄 끝 공백 제거, 연속 빈 줄 최대 1개, 내용 없는 청크 제거
  # 표/코드 블록 안의 구조와 원문 의미는 건드리지 않는다(문장 재작성/공백 병합 없음).
  # 우선순위: 호출 kwargs 의 text_cleanup > 아래 > off.
  text_cleanup: off

  # parse-format(비-docling) 문자 splitter 의 overlap 기본값.
  # 파서가 docling 을 못 만드는 포맷(csv/xlsx/txt/md/ppt/pptx/doc/이미지/오디오)은 parse-format
  # ({"elements":[...]})으로 들어오며, 그 중 일반 텍스트는 RecursiveCharacterTextSplitter 로 분할한다.
  # 크기는 위 공통 chunk_size 를 사용한다(docling 무관). audio([AUDIO])/csv·xlsx([DA]) 단일 벡터엔 미적용.
  # 우선순위: 호출 kwargs(chunk_overlap/recursive_chunk_overlap) > 아래 > 코드 기본값(100).
  recursive:
    chunk_overlap: 100    # 음수면 100 으로 폴백

# 표 텍스트 직렬화 옵션. 파서와 청커는 별개 호출이라 파서 설정이 넘어오지 않는다 —
# /chunker 로 들어오는 문서의 표 모양은 여기서 정한다. 청크 텍스트의 표 표기형태는
# 이 섹션이 최종 결정한다. parser_processor_config.yaml 에도 같은 이름의 키가 있지만
# 그쪽은 파서가 자기 출력을 낼 때(format: json/html/markdown)와 custom_fields 의
# html_text_fields 파생 필드에만 쓰인다 — 여기 값과 맞출 필요가 없다.
output:
  # "auto" 는 표마다 구조를 보고 고른다 - 병합 셀이나 2단 헤더가 있으면 html,
  # 단순 격자면 markdown. markdown 은 병합 셀을 표현하지 못해 헤더 계층이 사라진다.
  table_format: "html"    # "html"(default) | "markdown" | "auto"
  compact_tables: true    # markdown 표 컬럼 정렬 패딩 제거(대형 표 청크 축소). html 포맷엔 무관.
  # 병합 셀 표에 한해 표 뒤에 "컬럼=값 | 컬럼=값" 행 문장을 덧붙인다. 어느 헤더에 걸린
  # 값인지 문장으로 드러나 검색이 쉬워지지만 청크가 커진다. 단순 격자 표에는 적용 안 됨.
  table_row_serialization: false

  # 같은 청크 전문을 표만 다른 표기형태로 렌더한 텍스트를 청크에 추가로 싣는다.
  # 표가 없는 청크는 text 와 같은 값이 들어간다. 켜면 본문이 형식 수만큼 복제된다.
  # 빈 목록(기본)=추가 안 함 | "html" -> text_table_html | "markdown" -> text_table_md
  table_text_formats: []
