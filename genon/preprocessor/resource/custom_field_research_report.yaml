# ── LLM 연결 ────────────────────────────────────────────────────────────────
# <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
api_key: ""
model: model

# ── LLM 생성 파라미터 ────────────────────────────────────────────────────────
max_tokens: 4000
temperature: 0.0
timeout: 300

# ── 입력 페이지 범위 ─────────────────────────────────────────────────────────
# 미지정(null) → 문서 전체를 대상으로 한다.
pages: null

# ── 파서 ─────────────────────────────────────────────────────────────────────
parser:
  type: json

# ── 소스와 무관하게 고정으로 채울 값 ────────────────────────────────────────
# 카드 전용 원천이라 고객사가 파일 단위로 고정이다. LLM 에게 상수를 받아쓰게 시키지 않는다.
constants:
  GROUP_C: "SSS"

# ── 프롬프트 ─────────────────────────────────────────────────────────────────

system_prompt: |
  너는 증권 고객센터 안내문 요약 전문가다. 주어진 안내 항목을 검색용 임베딩에 넣을 요약본문으로 압축한다.

  규칙:
  - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
  - 키는 `SUMMARY_TEXT` 하나다. 값은 요약본문 문자열이다.
  - 원문에 없는 정보를 지어내지 않는다(환각 금지). 시각·수수료·한도 등 숫자는 원문 그대로 쓴다.
  - 요약본문에는 이용자가 검색할 만한 표현을 남긴다: 어떤 거래·업무인지, 신청 방법과 경로,
    접수·체결 시간, 조건과 예외사항. 표 안의 항목명만 나열하지 말고 문장으로 풀어 쓴다.
  - 문장형 한국어로 3~6문장, 800자 이내로 쓴다. 불릿·머리기호를 쓰지 않는다.
  - 안내본문이 비어 있거나 요약할 내용이 없으면 값을 null 로 둔다.

  출력 예시 형식(값은 예시):
  {"SUMMARY_TEXT": "시간외 종가 주문은 KRX 장 개시 전과 장 종료 후에 …"}

user_prompt: |
  아래 고객센터 안내 항목을 검색용 요약본문으로 압축하라.

  - SUMMARY_TEXT (요약본문) — 필수

  반드시 `SUMMARY_TEXT` 키 하나를 가진 JSON 객체로만 반환하라.

  <cs_item>
  {{raw_text}}
  </cs_item>

# ── 출력 필드 (프롬프트의 JSON 키와 일치해야 함) ──────────────────────────────
# SUMMARY_TEXT 는 이 경로에서 만들지 않는다 — 문서 단위 추출이라 청크 본문이 문서 원문
# 그대로이고, 임베딩 입력도 그 본문이다. 항목별 요약이 필요해지면 원천을 항목 단위로
# 받아 json_mapping + llm_fields 로 전환한다(custom_field_cs_sss.yaml 참고).
output_fields:
  - SUMMARY_TEXT
