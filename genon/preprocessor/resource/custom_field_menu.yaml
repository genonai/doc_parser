# 메뉴서비스 Excel 행
# 헤더: ID | 회사명 | 메뉴 중분류 | 메뉴 소분류 | 메뉴명 | 서비스 개요 | 서비스 주요 기능 |
#       서비스 이용가능 대상 | 서비스 이용방법 | 접근 경로 | 서비스 URL | 개발계 URL | 최종수정일 | 노출여부
schema: v2
source:
  kind: rows
fields:
  BIZ_ID:
    alias: [ID, 아이디]
  GROUP_C:
    alias: [회사, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  MENU_L3:
    alias: [메뉴 중분류, 중분류]
  MENU_L4:
    alias: [메뉴 소분류, 소분류]
  MENU_NM:
    alias: [메뉴명, 메뉴]
  SERVICE_DESC:
    alias: [서비스 개요, 개요]
  SERVICE_FEATURES:
    alias: [서비스 주요 기능, 주요기능]
  ELIGIBLE_TARGET:
    alias: [서비스 이용가능 대상, 이용가능대상]
  USAGE_METHOD:
    alias: [서비스 이용방법, 이용방법]
  ACCESS_PATH:
    alias: [접근 경로, 접근경로]
  SERVICE_URL:
    alias: [서비스 URL]
  DEV_URL:
    alias: [개발계 URL]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int_flex
  KEYWORDS:
    default: null
  OPEN_NATIVE_APP_C:
    default: null
require:
  fields: [GROUP_C, MENU_NM]
body:
  fields: [MENU_NM, SERVICE_DESC, SERVICE_FEATURES, USAGE_METHOD, ACCESS_PATH]
  split: true
  labels:
    MENU_NM: 메뉴명
    SERVICE_DESC: 서비스 개요
    SERVICE_FEATURES: 주요기능
    USAGE_METHOD: 이용방법
    ACCESS_PATH: 접근경로
  repeat: [MENU_NM]
