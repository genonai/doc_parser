# FAQ Excel 행 → TB_FAQ 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: faq
#       extractor: tabular_mapping
#       config_file: custom_field_faq.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
#
# 원천: monimo_rag_adaq_yyyymmdd_full_001.* — 수집데이터목록의 확장자가 "미정"이다.
#   - 표 형태(카드 FAQ)   : id | corp_code | depth3 | depth4 | description | 최종수정일 | 노출여부
#   - JSON 형태(모니모 FAQ): faqMenuList[] — depth1~4 · id · corp_code · description · url · app_route …
#
schema: v2
source:
  kind: rows
fields:
  # alias 왼쪽이 만들 목표필드, 오른쪽이 원천 컬럼 헤더 후보다(먼저 찾은 것을 쓴다).
  # 청크 본문에 실리는 필드는 alias 첫 값이 곧 본문 라벨이 되므로 사람이 읽는 이름을 앞에 둔다.
  # depth4/description 같은 원천 헤더를 앞에 두면 "depth4: …" 로 렌더되어 검색어와 겹치지
  # 않는다 — 원천 헤더는 목록 뒤에 남으므로 컬럼 매칭은 그대로다.
  BIZ_ID:
    alias: [id, 아이디]                     # 원천 FAQ 번호 (중복 감지용)
    default: null
  GROUP_C:
    # 고객사 (NOT NULL). corp_code 는 이미 "HPP" 같은 코드로 오지만, values 는 표준값
    # 자신도 자동 별칭이라 그대로 통과한다.
    alias: [회사, corp_code, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  FAQ_CTGR_NM:
    alias: [분류, depth3, 카테고리, FAQ분류]  # FAQ 분류 (주제영역과 다름)
    default: null
  QUESTION:
    alias: [질문, 대표질문, depth4]           # 대표질문 (NOT NULL)
  ANSWER:
    alias: [답변, 답변내용, description]      # 답변 본문 (NOT NULL)
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int_flex
  DEEP_LINK_URL:
    default: null
require:
  fields: [GROUP_C, QUESTION, ANSWER]         # 하나라도 비면 그 행은 버린다
body:
  # ── 청크 text 본문 구성 순서 (개행 결합) ──────────────────────────────────
  # TB_FAQ 에는 SUMMARY_TEXT 컬럼이 없다 — 질문과 답변 자체가 검색 단위다.
  fields: [QUESTION, ANSWER]
  # [선택] 본문 필드를 `항목명: 값` 으로 낸다. 여기 이름이 없는 필드는 값만 나간다.
  # 사람이 검색어로 쓰는 말을 적는다 — 목표필드명(DB 컬럼명)이나 원천 key 는 검색어에 안 나온다.
  # 값에 줄바꿈이 있는 블록(상세 본문 등)에는 붙지 않는다. 그 블록은 이미 자기 제목을 갖는다.
  labels:
    QUESTION: 질문
    ANSWER: 답변
  split: true                                 # 긴 답변은 chunk_size 기준으로 나눈다
  repeat: [QUESTION]                          # 나뉜 조각마다 질문을 다시 얹는다
