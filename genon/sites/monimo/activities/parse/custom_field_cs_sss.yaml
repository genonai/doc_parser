# 문서 유형 cs_sss(삼성증권 고객센터 안내)의 custom_fields 설정 — JSON 레코드 하나를 안내 한 건으로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADCCTBSSS001)의 컬럼 이름과 같다
# (CUSTOM_TITLE 은 TITLE 컬럼에 들어간다. CS_CTGR_L1·L2·L3 은 대·중·소분류다).
# BIZ_ID 는 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# 입력 예시(고객센터 시트의 "분석된 수집 문서 구조"). 수정일 key 는 지금 `updated_date` 다.
# 아래 예시의 "최종수정일" 은 문서 구조가 바뀌기 전 샘플이라 읽지 않는다.
#   {"ID": "FAQ_0007", "회사명": "증권", "category": "국내주식", "question": "시간외 종가 주문을 신청하려면 어떻게 하나요?",
#    "answer": "<html> 내용", "related_keywords": [], "linked_screen": "주식주문 #1149", "최종수정일": "2026-06-01"}
schema: v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    alias: [ID, id]
    default: null
  GROUP_C:
    alias: [회사명, company, corp_code]
    const: SSS
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CTGR_L1:
    alias: [category, 대분류, 카테고리]
    default: null
  CS_CTGR_L2:
    alias: [중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [question, 제목, 대표질문]
  CONTENT:
    alias: [answer, 안내본문, 답변]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [updated_date]
    default: null
    # 날짜를 다른 문서 유형과 같은 YYYYMMDD 정수로 바꾼다(기간 필터·최신순 정렬에 쓴다). 값이 없으면 0(날짜 없음)이다.
    transform: date_int
# 이 필드가 빈 레코드는 건너뛴다
require:
  fields: [CUSTOM_TITLE]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
