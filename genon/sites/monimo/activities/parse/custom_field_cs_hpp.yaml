# cs_hpp(삼성카드 고객센터 안내) custom_fields

schema: v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    # 원본 파일명의 첫 `_숫자` 까지를 쓴다(예: hpp_rag_adcc_237219_init.json → hpp_rag_adcc_237219)
    alias: [$file]
    transform: {name: regex_extract, pattern: '^(.+?_\d+)(?=[_.])'}
    default: null
  GROUP_C:
    alias: [회사명, company, corp_code]
    const: HPP
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CTGR_L1:
    alias: [ORN_NM, 대분류]
    default: null
  CS_CTGR_L2:
    alias: [LV2_THEMA_TERY_NM, 중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [TIT_NM, 제목, 대표질문]
  CONTENT:
    alias: [CONT, 안내본문, 답변]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [KEYW_LIS]
    default: null
    transform: [{name: to_json, key: "KEYW_LIS"}]
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [UD_DTM]
    default: null
    transform: date_int
require:
  fields: [CUSTOM_TITLE]
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
