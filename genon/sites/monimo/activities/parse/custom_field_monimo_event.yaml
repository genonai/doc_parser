# 문서 유형 monimo_event(이벤트)의 custom_fields 설정 — JSON 의 eventList 배열에서 원소 하나를 이벤트 한 건으로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADEVTBWCM001)의 컬럼 이름과 같다
# (CUSTOM_TITLE 은 TITLE 컬럼에 들어간다. DETAIL_TEXT 는 테이블에 컬럼이 없고 chunk 본문을 만드는 데 쓴다).
# BIZ_ID 는 원본이 준 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# 입력 예시:
#   {"eventList": [{"cmpCntsId": "CM26061182", "mnmFncoCd": "모니모", "evtTodayMainCopy": "…",
#                   "evtPtrmStrtDt": "26.07.01", "evtPtrmEndDt": "26.07.31",
#                   "wcmsHtml": {"htmlText": "<div>이벤트 상세 …</div>"}}]}

schema: v2
source:
  kind: records
  records_at: eventList
  on_missing: error
fields:
  BIZ_ID:
    alias: [cmpCntsId, ID, 이벤트ID, event_id]
    default: null
  GROUP_C:
    alias: [mnmFncoCd, 회사명, corp_code, 고객사]
    default: IFP
    values:
      IFP: [0, "00", 모니모]
      HPP: [1, "01", 삼성카드, 카드]
      SLF: [2, "02", 삼성생명, 생명]
      SSF: [3, "03", 삼성화재, 화재]
      SSS: [4, "04", 삼성증권, 증권]
  CUSTOM_TITLE:
    alias: [text, 제목, title, evtTodayMainCopy]
    transform: to_text
  EVENT_FROM:
    alias: [이벤트 시작일, 시작일, startDate, start_date, evtPtrmStrtDt]
    transform: date_int
  EVENT_TO:
    alias: [이벤트 종료일, 종료일, endDate, end_date, evtPtrmEndDt]
    transform: date_int
  DETAIL_HTML:
    alias: [cmp_desc, htmlText, 상세내용]
  MOVE_TARGET_URL:
    alias: [etcMoveTargetPage]
  EVENT_KIND_C:
    alias: [evnKndCd]
  CAMPAIGN_C:
    alias: [cmpCode]
  DETAIL_TEXT:
    alias: [cmp_desc, htmlText, 상세내용]
    transform: to_text
# 이 필드가 빈 레코드는 건너뛴다
require:
  fields: [CUSTOM_TITLE]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [CUSTOM_TITLE, DETAIL_TEXT]
  labels:
    CUSTOM_TITLE: 제목
    DETAIL_TEXT: 상세내용
  split: true
  repeat: [CUSTOM_TITLE]
