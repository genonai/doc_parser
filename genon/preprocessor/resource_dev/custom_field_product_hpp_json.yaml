# 개발 실행용 미러. 운영본의 설명과 필드 정의는 resource/custom_field_product_hpp_json.yaml 참고.
records: mpo

key_map:
  BIZ_ID:                  [wcmsId, wcms_id]
  PRODUCT_C:               [code, productCode, product_code]
  PRODUCT_NM:              [cardTitle, card_name, productName]
  PRODUCT_ATTRS:           [benefit, benefits]
  SALE_STATUS:             [saleStatus, sale_status]
  CARD_SLOGAN_HTML:         [cardSlogan]
  FEE_HTML:                 [feeUrl]
  ADDITIONAL_SERVICE_HTML:  [addServiceUrl]
  NOTICE_HTML:              [noticeUrl]
  PRODUCT_INFO_HTML:        [infoUrl]

collect_key_map:
  BENEFIT_DETAIL_HTMLS:     [serviceUrl]

required: [PRODUCT_C, PRODUCT_NM]
constants:
  GROUP_C: "HPP"
nulls: [SALE_STATUS]

html_text_fields:
  CARD_SLOGAN_TEXT:        CARD_SLOGAN_HTML
  BENEFIT_DETAIL_TEXT:     BENEFIT_DETAIL_HTMLS
  FEE_TEXT:                FEE_HTML
  ADDITIONAL_SERVICE_TEXT: ADDITIONAL_SERVICE_HTML
  NOTICE_TEXT:             NOTICE_HTML
  PRODUCT_INFO_TEXT:       PRODUCT_INFO_HTML

text_fields:
  - PRODUCT_NM
  - CARD_SLOGAN_TEXT
  - PRODUCT_ATTRS
  - BENEFIT_DETAIL_TEXT
  - FEE_TEXT
  - ADDITIONAL_SERVICE_TEXT
  - NOTICE_TEXT
  - PRODUCT_INFO_TEXT

split: true
missing_policy: error
