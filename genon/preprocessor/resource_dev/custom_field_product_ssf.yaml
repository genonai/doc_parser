# CustomFieldsEnricher 외부 config — 상품설명서(화재) 문서 단위 메타데이터 추출
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: product_ssf
#       extractor: llm
#       config_file: custom_field_product_ssf.yaml   # resource_path 자동 = 이 yaml 디렉토리
#
# 원천: ssf_rag_adpr_yyyymmdd_xxxxx_001.md (S3://os-tifa-ssf/FAO/ADPR)
#
# MD 표준안(상품 시트 "표준안 GPT 5.6 sol"):
#   frontmatter(file / document_type / source_file / source_pages / author / created_at /
#               conversion_note)
#   → `# {상품명} 상품요약서`
#   → `## 핵심 키워드`
#   → `## 문서 개요`      (샘플에 따라 `## 목차` 로 오기도 한다 — 문서 개요로 통일 요청됨)
#   → `## 내용 색인`
#   → `원문 전사` / `원문 N쪽 - {소제목}`
#
schema: v2
source:
  kind: document
  pre:
    markdown:
      front_matter:
        metadata_fields:
          # created_at: [created_date, PRODUCT_ATTRS]
          product_code: [PRODUCT_C]
        exclude_text_fields: ['*']
        on_missing: warn
      text_fence:
        enable: true
        langs: ['', text]
        min_hangul_ratio: 0.3
fields:
  GROUP_C:
    const: SSF
  SALE_STATUS:
    const: SALE
  BIZ_ID:
    const: null
# 작성일은 문서 1건에 하나뿐이라 청크마다 반복할 이유가 없다. 첫 청크에만 1회 싣는다 —
# 값 자체는 모든 청크 metadata 에 실리므로 필터 검색은 전 청크에서 된다.
body:
  once: [PRODUCT_ATTRS]
  labels:
    PRODUCT_ATTRS: 출시일
llm:
- out: [PRODUCT_NM, PRODUCT_ATTRS]
  parser:
    type: json
  endpoint:
    url: https://genos.genon.ai/api/gateway/rep/serving/752/v1/chat/completions
    api_key: d1a9e0acab6243019008a96cd8af868e
    model: model
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300
  prompt:
    system: |
      너는 보험 상품요약서 정보추출 전문가다. 주어진 상품요약서 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 요청된 2개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
      - 문서에 없는 정보를 지어내지 않는다(환각 금지). 금액·기간·비율·나이는 원문 숫자를 그대로 쓴다.

      필드별 형식:
      - `PRODUCT_NM`: 상품명 문자열. 문서 제목(H1)의 상품명을 쓰되 "상품요약서" 같은 문서종류
        표기는 뺀다. 예: "# 삼성 s교통상해보험(2501)(무배당) 상품요약서" → "삼성 s교통상해보험(2501)(무배당)".
        반드시 채운다.
      - `PRODUCT_ATTRS`: 출시일 문자열. frontmatter 나 본문에서 created_at 있으면 그 값.

      출력 예시 형식(값은 예시):
      {"PRODUCT_NM": "삼성 s교통상해보험(2501)(무배당)", "PRODUCT_ATTRS": 20260710}
    user: |
      아래 보험 상품요약서에서 다음 2개 필드를 추출하라.

      - PRODUCT_NM (상품명) — 필수
      - PRODUCT_ATTRS (출시일) — 필수

      반드시 위 2개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

      <document>
      {{raw_text}}
      </document>
