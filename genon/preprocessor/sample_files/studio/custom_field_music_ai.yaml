# music_ai(모니모 뮤직 AI 플레이리스트) custom_fields

schema: v2
doc_type: music_ai
source:
  kind: records
  records_at: playList
  on_missing: error
fields:
  BIZ_ID:
    template: "{{TXT}}"
    transform: {name: hash, prefix: MUSIC_AI_, length: 16}
  GROUP_C:
    const: IFP
  TXT:
    alias: [text]
    transform: to_text
  LAND_TYPE:
    alias: [landingType]
    default: null
require:
  fields: [TXT]
body:
  fields: [TXT]
  split: true
