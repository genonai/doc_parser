# 금융용어사전 Excel 행
#
# 헤더: ID | 회사명 | 용어(국문) | 정의·설명 | 최종수정일

schema: v2
source:
  kind: rows
fields:
  BIZ_ID:
    alias: [ID, 아이디]
    default: null
  GROUP_C:
    alias: [회사, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  TERM:
    alias: [용어, 용어(국문), 용어국문]
  TERM_NORM:
    alias: [용어, 용어(국문), 용어국문]
    transform: text_norm
  DEFINITION:
    alias: [설명, 정의·설명, 정의 설명, 정의]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int_flex
  SYNONYMS:
    default: null
require:
  fields: [GROUP_C, TERM, TERM_NORM, DEFINITION]
body:
  fields: [TERM, DEFINITION]
  labels:
    TERM: 용어
    DEFINITION: 설명
  split: true
  repeat: [TERM]
