# 전 문서 공통 정제 규칙. chunking_processor_config.yaml 의 `chunking:` 아래
# `text_cleanup: off` 한 줄을 이 블록으로 갈아 끼운다(들여쓰기 2칸 유지).
#
# mode: safe  는 문자 위생만 한다(NFC 복원, BOM·제로폭·제어문자 제거, 특수 공백 →
# 일반 공백, 전각 → 반각, 따옴표·대시 통일). **장식 마커는 지우지 않는다** — 그것은
# 아래 rules 의 일이다.
#
# HTML 엔티티(`&gt;` 등)는 규칙에 없다. 마크다운 백엔드가 본문·표 셀에서 해독하도록
# 고쳤기 때문이다(#363). 우회 규칙을 남겨 두면 진짜 수정을 가린다.
text_cleanup:
  mode: safe
  rules:
    - {find: "[■◈※☎▶●◆▲☞]\\s*", replace: ""}   # 장식 마커
