# 상품설명서(생명) 문서 단위 메타데이터 추출
#
# MD 표준안:
#   frontmatter(file / document_type / source_file / source_pages / author / created_at /
#               conversion_note)
#   → `# {상품명} 상품요약서`
#   → `## 핵심 키워드`
#   → `## 문서 개요`      (샘플에 따라 `## 목차` 로 오기도 한다)
#   → `## 내용 색인`
#   → `원문 전사` / `원문 N쪽 - {소제목}`
#
# 청크 본문에는 원문만 싣는다. `## 원문 전사` 가 있으면 그 앞(상품명 H1 제외)을 지우고,
# 없어도 변환기가 붙인 안내 섹션과 원본 PDF 의 목차 페이지는 지운다(source.pre.markdown.sections).
#

schema: v2
source:
  kind: document
  pre:
    markdown:
      front_matter:
        exclude_text_fields: ['*']
        on_missing: warn
      text_fence:
        enable: true
        langs: ['', text]
        min_hangul_ratio: 0.3
      sections:
        after_heading: '## 원문 전사'
        exclude: ['## 문서 개요', '## 핵심 키워드', '## 내용 색인', '## 원문*쪽-목차']
fields:
  created_date:
    alias: [created_at]
    transform: date_int
  # LLM 도 뽑지만 front matter 의 product_code 가 있으면 그 값이 우선한다.
  PRODUCT_C:
    alias: [product_code, product_codes]
    default: null
  GROUP_C:
    const: SLF
  SALE_STATUS:
    const: SALE
  BIZ_ID:
    # 파일명 전체를 SHA-1 로 해시해 `SLF_PROD_` 접두와 16자리 16진 문자열로 만든다.
    # 같은 파일명이면 다시 적재해도 같은 값이 나오고, 파일명이 바뀌면 값도 바뀐다.
    alias: [$file]
    # transform: {name: regex_extract, pattern: '^(.+?_\d{8})(?!\d)'}
    transform: {name: hash, prefix: SLF_PROD_, length: 16}
    default: null
  PRODUCT_NM:
    alias: [title]
    transform:
    - {name: regex_sub, pattern: '\s*상품요약서$', repl: ''} 
  PRODUCT_ATTRS:
    # alias: [created_at]
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}   # 여러 줄 값을 한 줄로 편다. 줄바꿈이 남으면 아래 패턴이 매칭에 실패한다
    - {name: regex_extract, pattern: '^\s*([^~]*?)(?:\s*~\s*.*)?$'}
    - date_int
    - {name: to_json, key: "created_at"}
  # frontmatter `sales_period: 2025-12-1 ~ 2026-3-15` 을 시작일/종료일로 나눈다.
  # 종료 자리에 숫자가 없는 문자열("진행중", "현재" 등)은 열린 기간으로 보고 99991231 로 둔다.
  # `~` 가 없거나 종료가 비어 있으면 0 이다(0 은 날짜 없음을 뜻한다).
  VALID_FROM:
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}   # 여러 줄 값을 한 줄로 편다. 줄바꿈이 남으면 아래 패턴이 매칭에 실패한다
    - {name: regex_extract, pattern: '^\s*([^~]*?)(?:\s*~\s*.*)?$'}
    - date_int
  VALID_TO:
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}
    - {name: regex_extract, pattern: '~\s*(.*?)\s*$'}
    - {name: regex_sub, pattern: '^\D+$', repl: '99991231'}
    - date_int
body:
  once: [created_date]
  labels:
    created_date: 출시일
  # 본문(HEADER 제외)이 200자 미만인 청크를 다음 청크에 붙인다. 제목만 있거나 본문이 1~2줄인
  # 섹션은 HEADER 경로가 청크의 큰 몫을 차지해 제목 검색어로만 상위에 오르고 답변 근거는 주지 못한다.
  merge_short: 200
# 표 설명 LLM 사용량 절감(적용한 방법 모두, 생명·화재 상품설명서 동일).
# - 앞선 표에 행 단위로 이미 실린 표(병합 셀에 전사된 하위 표, 다른 쪽에 다시 실린 표)는 설명하지 않는다.
#   같은 내용이 앞 표의 청크와 그 설명으로 이미 검색된다.
# - 값 칸 평균이 100자 이상인 긴 문장 표는 설명하지 않는다.
# 짧은 설명(검색 문맥 200자·핵심 사실 2개)은 공통 설정에서 적용된다.
# skip 옵션은 아래 다섯 개뿐이며, 하나라도 맞는 표는 LLM 에 보내지 않는다. `skip: false` 는 다섯 개를 모두
# 끈다. 공통 설정과는 키 단위로 합쳐지고 이 파일의 값이 우선한다. 켜진 것과 꺼진 것을 모두 적어 둔다.
table_text_description:
  skip:
    single_value_table: true      # 값이 한 칸뿐이거나 데이터 행이 없는 표를 보내지 않는다(기본 true)
    # 다른 표의 칸 안에 든 표를 보내지 않는다(기본 true). 이 표는 바깥 표 칸으로만 청크에 실려 설명을 붙일 자리가
    # 없으므로, false 로 바꿔도 만든 설명은 버려지고 LLM 호출만 늘어난다.
    nested_table: true
    duplicate_table: true         # 앞선 표 하나에 모든 행이 행 단위로 이미 실린 표를 보내지 않는다(기본 false)
    # 제목이 있고, 병합 셀이 없고, 데이터 5행 이하·2~3열이며, 값 칸이 문장이고, 금액·비율·기간이 없는 표를 보내지 않는다(기본 false)
    self_describing_table: false
    long_text_table: 100          # 첫 행·첫 열을 뺀 값 칸 평균 문자 수가 이 값 이상인 표를 보내지 않는다(0=끔, 기본 0)
# llm:
# - out: [PRODUCT_C, PRODUCT_NM, PRODUCT_ATTRS]
#   parser:
#     type: json
#   endpoint:
#     model_preset: default
#   params:
#     max_tokens: 4000
#     temperature: 0.0
#     timeout: 300
#   prompt:
#     system: |
#       너는 보험 상품요약서 정보추출 전문가다. 주어진 상품요약서 문서에서 요청한 필드를 정확하게 추출한다.

#       규칙:
#       - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
#       - 요청된 3개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
#       - 문서에 없는 정보를 지어내지 않는다(환각 금지). 금액·기간·비율·나이는 원문 숫자를 그대로 쓴다.

#       필드별 형식:
#       - `PRODUCT_C`: 상품코드 문자열. frontmatter 나 본문에 상품코드/product_code가 있으면 그 값.
#         없으면 null 로 둔다(상품명을 코드처럼 지어내지 않는다).
#       - `PRODUCT_NM`: 상품명 문자열. 문서 제목(H1)의 상품명을 쓰되 "상품요약서" 같은 문서종류
#         표기는 뺀다. 예: "# 삼성 s교통상해보험(2501)(무배당) 상품요약서" → "삼성 s교통상해보험(2501)(무배당)".
#         반드시 채운다.
#       - `PRODUCT_ATTRS`: 상품의 출시일. 본문에 created_at가 있는 날짜를 추출한다.

#       출력 예시 형식(값은 예시):
#       {"PRODUCT_C": "30387", "PRODUCT_NM": "삼성 s교통상해보험(2501)(무배당)", "PRODUCT_ATTRS": 20060305}
#     user: |
#       아래 보험 상품요약서에서 다음 3개 필드를 추출하라.

#       - PRODUCT_C (상품코드) — 필수
#       - PRODUCT_NM (상품명) — 필수
#       - PRODUCT_ATTRS (출시일) — 필수

#       반드시 위 3개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

#       <document>
#       {{raw_text}}
#       </document>
