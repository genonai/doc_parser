# CustomFieldsEnricher 외부 config — 카드 상품 메타데이터(12필드) 추출
#
# ⚠️ 이 설정은 모니모 적재 스키마(TB_PRODUCT)와 필드명이 맞지 않는다.
#    아래 12필드는 마케팅 관점 평면 필드라 PRODUCT_C(NOT NULL) · GROUP_C(NOT NULL) ·
#    SUMMARY_TEXT(임베딩 입력) 가 없고, 연회비·혜택은 PRODUCT_ATTRS(JSON) 안으로 들어가야 한다.
#    적재용으로는 custom_field_product_hpp.yaml(doc_type: product_hpp)을 쓸 것.
#    이 파일은 기존 데모(doc_type: card — parse_chunk_test.sh / serving_gateway_test.sh)를
#    깨지 않기 위해 그대로 둔다.
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: card
#       extractor: llm
#       config_file: custom_field_card.yaml   # resource_path 자동 = 이 yaml 디렉토리
#
# ★ 이 파일 하나로 자족한다 — 프롬프트가 아래에 인라인되어 있어 별도 md 파일이 없다.
#
# 이 파일은 parser_processor_config.yaml 과 동일 폴더(resource/)에 위치.
# 인라인 블록에서 null 이 아닌 값을 지정하면 이 파일 값보다 우선한다.

# ── LLM 연결 ────────────────────────────────────────────────────────────────
# <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
url: "http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions"
api_key: ""
model: model

# ── LLM 생성 파라미터 ────────────────────────────────────────────────────────
# _text(원문) 필드가 길 수 있어 max_tokens 를 넉넉히 잡는다.
max_tokens: 4000
temperature: 0.0
timeout: 300

# ── 입력 페이지 범위 ─────────────────────────────────────────────────────────
# 미지정(null) → CustomFieldsEnricher 가 document.export_to_text() 로 문서 전체를 읽는다.
# (카드 페이지는 13개 섹션에 정보가 흩어져 있어 전체를 대상으로 함)
pages: null

# ── 파서 ─────────────────────────────────────────────────────────────────────
parser:
  type: json

# ── 프롬프트 ─────────────────────────────────────────────────────────────────
# 이 파일 하나로 자족하도록 프롬프트를 인라인해 두었다(별도 md 파일 없음).
# 프롬프트가 길어지거나 여러 doc_type 이 공유하게 되면 system_prompt_file /
# user_prompt_file 로 다시 분리해도 된다 — 파일 지정이 인라인보다 우선한다.
system_prompt: |
  너는 카드 상품 정보추출 전문가다. 주어진 카드 상품 페이지 문서에서 요청한 필드를 정확하게 추출한다.

  규칙:
  - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
  - 요청된 12개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
  - 문서에 없는 정보를 지어내지 않는다(환각 금지). 추론이 필요한 yn 필드만 문맥 근거로 판단한다.

  필드별 형식:
  - `issuer_name`: 카드 발급사명 문자열(예: "삼성카드"). 없으면 null.
  - `product_name_norm`: 상품명 정규화 문자열. `product_name` 에서 앞뒤 공백·중복 공백·불필요한 수식/마케팅 문구·괄호 부가설명을 제거한 대표 명칭. 반드시 채운다(원 상품명 기반으로라도 생성).
  - `annual_fee_amount`: 국내 기준 "본인" 연회비를 정수(원)로. 콤마와 "원" 등 단위를 제거한 숫자만(예: 18000). 브랜드/등급별로 여러 값이면 가장 낮은 기본 값. 없으면 null.
  - `family_annual_fee_amount`: 가족카드 연회비를 정수(원)로. 없으면 null.
  - `overseas_payment_yn`: 해외결제(해외 가맹점 결제) 가능 여부. "Y" 또는 "N".
  - `transit_card_yn`: 후불/모바일 교통카드 기능 제공 여부. "Y" 또는 "N".
  - `joinable_yn`: 현재 신규 발급(가입) 가능 여부. 단종·발급중단 문구가 있으면 "N", 그 외 정상 판매 상품은 "Y".
  - `product_name`: 카드 상품명 원문 문자열. 반드시 채운다.
  - `benefit_text`: 주요 혜택 관련 원문 텍스트(요약·재작성 금지, 문서 원문 그대로 발췌).
  - `join_condition_text`: 가입조건 관련 원문 텍스트.
  - `family_annual_fee_text`: 가족연회비 관련 원문 텍스트. 없으면 null.
  - `annual_fee_text`: 연회비 관련 원문 텍스트.

  출력 예시 형식(값은 예시):
  {"issuer_name": "삼성카드", "product_name_norm": "...", "annual_fee_amount": 18000, "family_annual_fee_amount": null, "overseas_payment_yn": "Y", "transit_card_yn": "Y", "joinable_yn": "Y", "product_name": "...", "benefit_text": "...", "join_condition_text": "...", "family_annual_fee_text": null, "annual_fee_text": "..."}

user_prompt: |
  아래 카드 상품 페이지 문서에서 다음 12개 필드를 추출하라.

  - issuer_name (발급사명)
  - product_name_norm (상품명 정규화) — 필수
  - annual_fee_amount (연회비, 정수 원)
  - family_annual_fee_amount (가족연회비, 정수 원)
  - overseas_payment_yn (해외결제 가능, Y/N)
  - transit_card_yn (교통카드 가능, Y/N)
  - joinable_yn (가입 가능 여부, Y/N)
  - product_name (상품명) — 필수
  - benefit_text (혜택 원문)
  - join_condition_text (가입조건 원문)
  - family_annual_fee_text (가족연회비 원문)
  - annual_fee_text (연회비 원문)

  반드시 위 12개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

  <document>
  {{raw_text}}
  </document>

# ── 출력 필드 (프롬프트의 JSON 키와 일치해야 함) ──────────────────────────────
output_fields:
  - issuer_name
  - product_name_norm
  - annual_fee_amount
  - family_annual_fee_amount
  - overseas_payment_yn
  - transit_card_yn
  - joinable_yn
  - product_name
  - benefit_text
  - join_condition_text
  - family_annual_fee_text
  - annual_fee_text
