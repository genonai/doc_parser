# 관심소식 상세 HTML → TB_NEWS 목표필드 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: monimo_news
#       config_file: custom_field_monimo_news.yaml
#
# 원천: TD00008459_d_5199.html.json (카드 WCMS) — 문서 하나가 관심소식 한 건이다.
#
#   {"wcmsData": {"html": {"content": "<div class=\"newsletter-article-wrap\" ...>"},
#                 "json": {}}}
#
# 즉 **값이 있는 곳은 `content` 하나**이고, 그 안의 상세 HTML 에서 제목·카테고리·요약·
# 상세·출처를 뽑는다. `source.pre.json.body_from` 이 그 값을 꺼내 본문으로 만들고,
# 뽑기는 `fields.<이름>.select`(extractor: html_select)가 원문 HTML 에서 직접 한다 —
# docling 이 파싱을 마치면 class 도 속성도 남지 않기 때문이다.
#
# custom_field_monimo_event.yaml 과 짝을 이루므로 한쪽을 고치면 다른 쪽도 함께 본다.

schema: v2

# ── 참고: 옛 원천(eventList 레코드 배열) 설정 ────────────────────────────────
# 관심소식이 이벤트와 같은 `eventList` 구조로 오던 시절의 설정이다. 새 원천에는 배열도
# 한글 키도 없어 그대로는 한 값도 잡히지 않는다. 되돌릴 일이 생기면 여기서 꺼내 쓴다.
#
# 입력 예시:
#   {"eventList": [{"ID": "CM26061182", "회사명": "모니모",
#                   "제목": "하이마트 구독을 가볍게 매월 최대2만원 까지 혜택",
#                   "카테고리": "가전", "키워드": "하이마트 구독",
#                   "개시 시작일": "260701", "개시 종료일": "260731",
#                   "사용여부": "N", "노출여부": "Y",
#                   "wcmsHtml": {"htmlText": "상세 내용"}}]}
#
# source:
#   kind: records
#   records_at: eventList
#   on_missing: error
# fields:
#   BIZ_ID:
#     alias: [ID, 아이디]
#     default: null
#   GROUP_C:
#     alias: [회사명, corp_code, 고객사]
#     default: IFP
#     values:
#       IFP: [모니모]
#       SLF: [삼성생명, 생명]
#       SSF: [삼성화재, 화재]
#       HPP: [삼성카드, 카드]
#       SSS: [삼성증권, 증권]
#   TITLE:
#     alias: [제목, title, evtTodayMainCopy]
#   KEYW_CTGR_NM:
#     alias: [카테고리, 키워드, 코너명]
#     default: null
#   CN_URL:
#     alias: [buttonLink, detailUrl, 콘텐츠 상세 경로, 상세경로]
#   NEWS_TO:
#     alias: [개시 종료일, 종료일, endDate, evtPtrmEndDt]
#     transform: date_int_flex
#   DETAIL_HTML:
#     alias: [htmlText, 상세내용]
#   DETAIL_TEXT:
#     alias: [htmlText, 상세내용]
#     transform: html_text
# require:
#   fields: [TITLE]
# body:
#   fields: [TITLE, DETAIL_TEXT]
#   labels:
#     TITLE: 제목
#     DETAIL_TEXT: 상세내용
#   split: true
#   repeat: [TITLE]
# ── 참고 끝 ──────────────────────────────────────────────────────────────────

# 문서구조 v3, html 방식{
#   "wcmsData": {
#     "html": {
#       "content": "<div> ... </div>"
#     },
#     "json": {}
#   }
# }
source:
  kind: html
  pre:
    json:
      # 본문이 담긴 원천 key 이름. 경로가 아니라 이름이라 `wcmsData.html.content` 도
      # 임의 깊이에서 잡힌다. 값이 HTML 이므로 `auto` 가 html 로 판별한다.
      body_from: [content]
      format: auto
      # skip: 경고만 남기고 빈 문서로 진행 / error: 그 문서의 파싱을 실패시킨다.
      on_missing: skip

# `select` 는 원천 HTML 의 어디서 값을 가져올지 적는 자리다(레코드 원천의 `alias` 와 같은 역할).
# 요건표가 지목한 class 와 속성을 그대로 쓴다 - 아래 이름은 전부 원천 마크업에
# 있는 그대로이고, `newslertter-` 의 오타도 원천 그대로다.
fields:
  BIZ_ID:
    # 원천(content 하나뿐)에는 ID 가 없어 파일명 앞의 `TD…` 를 쓴다.
    # 예: TD00008415_d_5199.html.json → TD00008415
    alias: [$file]
    transform: {name: regex_extract, pattern: '^(TD\d+)'}
    default: null
  GROUP_C:
    default: IFP
  USE_YN:
    default: Y
  CUSTOM_TITLE:
    select: .new-banner-headline
  CATEGORY:
    # 이 값만 텍스트가 아니라 wrap div 의 속성에 있다.
    select: .newsletter-article-wrap
    attr: newsletter-title
  SUMMARY:
    # 본문 문단도 같은 `newsletter-article-txt` class 를 쓰므로 요약 상자로 범위를 좁힌다.
    select: .article-summary-box
  DETAIL:
    select: .newslertter-article-content
  SOURCE:
    select: .newsletter-source
body:
  once: [CATEGORY, CUSTOM_TITLE]
  labels:
    CATEGORY: 카테고리
    CUSTOM_TITLE: 제목
