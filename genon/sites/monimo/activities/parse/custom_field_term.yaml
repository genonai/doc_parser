# 문서 유형 term(금융용어사전)의 custom_fields 설정 — Excel 의 한 행을 용어 하나로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADFGTBFDP001)의 컬럼 이름과 같다.
# BIZ_ID 는 원본이 준 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# 원본 Excel 헤더: ID | 회사명 | 용어(국문) | 정의·설명 | 최종수정일

schema: v2
source:
  kind: rows
  # 처리할 시트 이름 목록. 적으면 그 시트만 처리하고, 적은 시트가 파일에 없으면 오류(PARSE_D013)로 실패한다.
  # 적지 않으면 모든 시트를 처리한다. 이때 필수 열(require)이 없는 시트가 하나라도 있으면 문서 전체가 실패한다.
  # 시트 이름은 앞뒤 공백까지 원본 그대로 적는다.
  # sheets: [공통_용어사전]
fields:
  BIZ_ID:
    alias: [ID, 아이디]
    default: null
  GROUP_C:
    alias: [회사, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  TERM:
    alias: [용어, 용어(국문), 용어국문]
  TERM_NORM:
    alias: [용어, 용어(국문), 용어국문]
    transform: normalize
  DEFINITION:
    alias: [설명, 정의·설명, 정의 설명, 정의]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int
  SYNONYMS:
    default: null
# 이 필드가 빈 행은 건너뛴다. 이 필드에 맞는 열이 시트에 아예 없으면 문서가 실패한다
require:
  fields: [GROUP_C, TERM, TERM_NORM, DEFINITION]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [TERM, DEFINITION]
  labels:
    TERM: 용어
    DEFINITION: 설명
  split: true
  repeat: [TERM]
