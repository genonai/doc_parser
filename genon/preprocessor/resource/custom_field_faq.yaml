# FAQ Excel 행
#
#   - 표 형태(카드 FAQ)   : id | corp_code | depth3 | depth4 | description | 최종수정일

schema: v2
source:
  kind: rows
fields:
  BIZ_ID:
    alias: [id, 아이디]
    default: null
  GROUP_C:
    alias: [회사, corp_code, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  FAQ_CTGR_NM:
    alias: [분류, depth3, 카테고리, FAQ분류]
    default: null
  QUESTION:
    alias: [질문, depth4, 대표질문]
  ANSWER:
    alias: [답변, description, 답변내용]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int_flex
  DEEP_LINK_URL:
    default: null
require:
  fields: [QUESTION, ANSWER]
body:
  fields: [QUESTION, ANSWER]
  split: true
  labels:
    QUESTION: 질문
    ANSWER: 답변
  repeat: [QUESTION]
