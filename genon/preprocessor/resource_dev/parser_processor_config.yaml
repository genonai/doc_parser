ocr:
  ocr_mode: "auto" # "auto"(default), "force", "disable"
  ocr_endpoint: "http://192.168.73.172:48080/ocr"

layout:
  layout_model_type: "genos_layout" # "genos_layout"(default) or "docling_layout"
  genos_layout:
    endpoint: "http://192.168.75.174:26001/v1/chat/completions"
    api_key: ""
    page_batch_size: 32

enrichment:
  do_toc: false
  do_metadata: false
  api_url: "https://genos.genon.ai/api/gateway/rep/serving/750/v1/chat/completions"
  api_key: "26e6a516de0847f59a3b9db8e418976e"
  model: "model"
  toc:
    temperature: 0.0
    top_p: 0.00001
    seed: 33
    max_tokens: 10000

output:
  format: "json" # "json" (default), "html", "markdown"
  table_format: "markdown" # "html" (default), "markdown"

# 보험 도메인 OCR 교정 설정
# - correction_dict: 교정 사전 파일명 (resource_dev/ 폴더 기준, 기본값: insurance_correction_dict.yaml)
# - llm.enabled: enrichment LLM을 재사용한 문맥 기반 교정 (지연 증가 주의)
domain_correction:
  enabled: true
  correction_dict: "insurance_correction_dict.yaml"

# whisper 설정, 음성인식 모델이 필요한 경우 설정.
whisper:
  url: ""
  model: "model"
  language: "ko"
  response_format: "json"
  temperature: "0"
  stream: "false"
  timestamp_granularities: "word"
  chunk_sec: 29
