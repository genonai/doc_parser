# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 역할이 섞인 중첩 JSON → 의미 기반 섹션 청크 (source.kind: sections)
#
#  언제 쓰나 : JSON 파일 하나가 **대상 하나**(상품 1건, 카드 1장, 문서 1건)를 설명하는데,
#              그 안에 성격이 다른 내용(기본정보 · 혜택 · 안내문 · 추천상품 …)이 섞여 있을 때.
#              "1파일 = 평평한 레코드 N건" 이면 records 를 쓴다. JSON 안의 HTML 이 본문 전체
#              하나이고 class 로 값을 뽑아야 하면 html 을, 여러 key 에 흩어진 HTML 조각이면
#              이 kind 를 쓴다.
#  결과      : 성격별로 나뉜 "섹션" 하나가 청크 하나가 된다(element category=`custom_fields_row`).
#              모든 청크에 공통 정보(상품명·상품코드 등)가 함께 실려, 어느 청크가 검색되어도
#              무엇에 대한 내용인지 알 수 있다. 섹션 안의 표는 별도 청크로 나갈 수 있어 섹션 수와
#              최종 청크 수는 다를 수 있다.
#  LLM 호출  : 없음. 원천에 없는 필드가 필요할 때만 맨 아래 `llm` 을 쓴다(llm 항목마다 문서 1건당
#              1회. 필드 추출 기준이며, 공통 설정에서 켠 표 설명 호출은 별도다).
#  실행 경로 : parser 경로 전용. 적재용(intelligent)/변환용(convert)은 원천을 PDF 로 바꿔 읽어
#              JSON 구조가 남지 않으므로, 거기 등록하면 기동 시 경고가 남고 필드가 채워지지 않는다.
#  다른 kind : rows(엑셀/CSV 한 행) · records(JSON 배열 한 요소)
#              · document(문서 1건에서 LLM 으로 추출) · html(마크업이 값을 지목한 HTML)
#
#  ── 쓰는 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 설정 폴더에 custom_field_<유형>.yaml 로 복사한다(표준 유형은 genon/preprocessor/
#     resource/, 사이트 전용 유형은 genon/sites/<site>/resource/ — 맨 아래 "배포" 참고).
#  ② <...> 를 채우고 쓰지 않는 [선택] 블록은 지운다. `schema: v2` 줄은 지우지 않는다
#     (없으면 기동이 실패한다).
#  ③ 같은 폴더의 parse_config.yaml 의 enrichment 목록에 등록한다.
#        - custom_fields:
#            enable: true
#            doc_type: <유형>            # 요청 params 의 doc_type 과 같은 값
#            config_file: custom_field_<유형>.yaml   # 파일명만. 이 등록 블록이 있는 프로세서
#                                                    # 설정 yaml 과 같은 폴더 기준
#     extractor 는 적지 않는다(`source.kind: sections` 에서 `json_semantic` 으로 정해진다).
#  ④ 맨 아래 "확인 방법" 으로 실제 원천 파일의 결과를 확인한다.
#
#  ── 이 kind 고유 주의 ────────────────────────────────────────────────────
#  사람이 정하는 것은 세 가지다 — `fields`(모든 청크에 넣을 공통 정보), `source.sections`
#  (key 별 표시 이름, 선택), `source.ignore_keys`(검색에서 뺄 key). 나머지는 자동 처리된다.
#    · HTML 값은 표·목록을 살린 평문으로 바뀐다.
#    · 빈 값(null, "", [], {})은 빠진다.
#    · 섹션 제목은 값 안의 제목(h1~h6 등)을 찾아 붙이고, 없으면 key 이름을 쓴다.
#    · 여기 적지 않은 key 도 검색 본문에 들어간다(빠뜨려서 누락되는 일이 없다).
#    · `fields` 의 alias 와 같은 이름의 key 는 어느 깊이에 있든 섹션 본문에서 빠진다(접두와
#      중복되므로). 값이 스칼라 배열이면 예외로 본문에 남는다.
#    · 제목과 같은 값, 이름이 id·code·no·seq 로 끝나는 짧은 값(24자 이하, 공백 없음)만 남은 섹션은
#      접힌다(로그 "식별자/빈 본문뿐인 섹션 N건을 접었습니다"). 끌 수 없다 — `{title, code}` 뿐인
#      배열 원소는 사라지므로 그 제목이 다른 섹션에 없으면 원천을 확인한다.
#    · 너무 큰 섹션은 chunk_size 에 맞춰 나뉜다(끌 수 없다).
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 소스 ─────────────────────────────────────────────────────────────
source:
  kind: sections

  # ── [선택] JSON key 별 표시 이름 ──────────────────────────────────────────
  # 왼쪽  = JSON 의 key 이름(경로가 아니라 이름만 — 깊이가 달라져도 동작한다)
  # 오른쪽 = 청크 본문 앞에 `[<이름>]` 처럼 표시될 이름. 하위 key 에 별도 설정이 없으면
  #          자식들도 이 이름을 물려받는다(컨테이너 하나 = SECTION_NM 하나).
  # 이름을 보기 좋게 붙일 key 만 적는다(원천에 없는 key 는 아무 효과가 없다).
  # sections:
  #   <SECTION_KEY_1>: <섹션 표시 이름>
  #   <SECTION_KEY_2>: <섹션 표시 이름>

  # ── [선택] 검색에서 뺄 key ────────────────────────────────────────────────
  # 제외 수단은 이것 하나다. 두 종류를 함께 적는다.
  #   · 이 대상이 아닌 내용 — 추천 상품·관련 문서처럼 "다른 대상"의 내용. 그대로 두면 다른
  #     대상의 내용이 이 대상의 내용으로 검색된다. JSON 구조만으로는 알 수 없어 사람이 정한다.
  #   · 검색할 일이 없는 값 — 이미지 경로·화면 색상·정렬 순서 등. 빼지 않으면 본문 줄로 섞인다.
  # 깊이와 무관하게 key 이름으로 걸리고, 그 key 아래 전체가 빠진다. `fields.alias` 의 루트
  # 탐색에는 영향을 주지 않는다(루트 `code` 를 공통 필드로 쓰면서 하위 `code` 는 뺄 수 있다).
  # `*` 로 부분 일치를 쓸 수 있다 — `*Img*` 한 줄이 pcImg1·moImg1·bgImgUrl 을 모두 잡는다.
  # fnmatch 매칭이라 **대소문자를 구분한다**(alias 와 다르다). 대소문자가 섞여 오면
  # `"*[Ll]ottie*"` 처럼 문자 클래스로 적는다. 원천에 없는 이름은 아무 효과 없이 통과한다.
  # ignore_keys:
  #   - <RELATED_ITEM_KEY>   # 이 대상이 아닌 내용
  #   - "*Img*"
  #   - <제외할_key>

  # ── [선택] require 를 채우지 못했을 때 ────────────────────────────────────
  # error(기본) = 요청 실패 / skip = 경고 후 섹션 0건
  # on_missing: error

# ── [필수] 모든 청크에 넣을 공통 정보 ────────────────────────────────────────
# 왼쪽 = 만들 목표필드명. 적재 DB 컬럼명(대문자)으로 쓴다. 소문자 예약 이름(text·title·
# n_char·i_page·created_date·appendix …)과 한글·공백·기호가 든 이름은 기동이 실패한다.
# 값은 항상 object 다. 여기 만든 값은 모든 청크 metadata(적재 컬럼)에 실리고, `body.fields`
# 에 적은 필드는 청크 본문 맨 앞에도 실린다.
#
#   alias     : 그 값이 든 **루트 JSON key 이름들**(경로 아님). 관련 객체의 `code`/`name` 이
#               대상 식별자로 섞이지 않도록 **중첩 안쪽은 찾지 않는다**. 정확히 같은 key 를
#               먼저, 없을 때만 대소문자·`_ - . /` 차이를 무시하고 찾으며, 각 단계 안에서는
#               앞에 적은 별칭이 우선한다. 목표필드명도 맨 앞 별칭으로 자동 포함된다
#               (alias 키를 적은 필드에만). 문자열 값은 양끝 공백을 제거한다.
#               파일명 원천 `alias: [$file]` 은 이 kind 에서 쓸 수 없다(기동 실패).
#   raw       : 루트의 객체를 값으로 받는다(기본은 구조로 보아 null). to_json 과 함께 쓴다.
#   const     : 원천 값과 무관하게 항상 같은 값(파일 단위로 고정일 때만).
#   default   : 원천 값이 없거나 빈 문자열일 때만 채운다. alias 와 함께 쓰면 "원천에 있으면
#               원천값, 없으면 이 값"이다.
#   values    : 코드값·표기 흔들림을 표준값으로 접는다 (`ON_SALE: ["1", Y, 판매중]`).
#               매핑표에 없는 값은 원값을 그대로 두고 경고만 남긴다.
#               별칭에 영문 `yes`/`no`/`on`/`off` 를 쓸 때는 따옴표로 감싼다. YAML 이 불리언으로
#               해석하므로 원천의 "yes" 와 일치하지 않는다(`Y`/`N` 은 그대로다).
#   transform : 값 변환 체인. 아래 [변환기] 참고.
#   template  : 다른 필드를 합쳐 만든다 (`"{{BRAND_NM}} {{PRODUCT_NM}}"`). 값이 없는 자리표시자만
#               지우고 구분자는 남긴다(`"{{A}} > {{B}}"` 에서 B 가 비면 `값 >`). 같은 필드의 transform 은
#               합친 결과에 적용되므로 구분자는 regex_sub 로 정리한다(rows·records 템플릿의 예 참고).
#   pack      : 여러 필드를 **JSON 객체 한 칸**에 담는다 (`[BRAND_NM, ANNUAL_FEE]` →
#               `{"BRAND_NM": ..., "ANNUAL_FEE": ...}` 문자열). 값이 없는 키도 null 로 남고 묶은
#               필드는 그대로 남는다. 산출이 이미 JSON 문자열이므로 to_json 을 덧붙이지 않는다.
#               `llm.out` 필드도 `fields` 에 선언하지 않고 묶을 수 있다(LLM 뒤에 다시 묶는다).
#               본문 키(body.fields·once)에는 쓸 수 없다(기동 실패).
#   meta      : 청크 메타(적재 컬럼)에 실을지. 기본 true. template·pack 재료나 require 조건으로만
#               쓰는 중간 필드에 `meta: false` 를 적는다. 적재 컬럼에서만 빠진다.
#
# [변환기] 목록으로 쓰면 순서대로 적용된다. 인자는 `{name: <이름>, <인자>: <값>}` 으로 적는다.
#   date_int       날짜 → YYYYMMDD 정수. "2026-07-01"·"26.07.01"·"260701"·"20260701" 을 받고,
#                  문자열 "2026" 은 20260101 이다(숫자 2026 은 2026 그대로). 인자 on_error(기본 0).
#                    빈 값(None·""·공백·문자열 "None", key 없음) → 항상 0 (on_error 와 무관)
#                    해석 실패("진행중" 등) → on_error
#                    정상 → 20260701
#   normalize      NFKC → 양끝 공백 제거 → 연속 공백 한 칸 → 소문자화(중복 판정 키용)
#   to_text        JSON·HTML·평문을 자동 판별해 평문화한다(표시·검색용)
#   regex_sub      pattern, repl=""                  정규식 치환  "18,000원" → "18000"
#   regex_extract  pattern, group=1, on_error=null   정규식 추출. 매칭이 없으면 on_error, 빈 값은 그대로
#   to_int         on_error=null                     정수 하나로. 소수·숫자 둘 이상이면 on_error
#   hash           length=16, prefix=""              SHA-1 16진 코드로 줄인다
#   truncate       length, suffix=""                 길이 자르기
#   to_json        on_scalar=wrap|drop, key="value"  값 하나를 유효한 JSON 문자열로(JSON 컬럼용).
#                                                    빈 값·깨진 JSON 은 null. 체인 맨 뒤 전용이며
#                                                    본문 키와 pack 재료에 쓸 수 없다
#   날짜 레시피 — 빈 값을 null 로: [date_int, {name: regex_extract, pattern: '^([1-9]\d{7})$'}, to_int]
#                 없음·"진행중"을 99991231 로: default: 99991231 + {name: date_int, on_error: 99991231}
fields:
  <TARGET_FIELD_1>:
    alias: [<json key>, <다른 표기>]
  <TARGET_FIELD_2>:
    alias: [<json key>]
  # 아래 예시의 왼쪽 <...> 는 목표필드명, 오른쪽은 원천 key 의 예다.
  # <GROUP_C>: {const: "<고정값>"}
  # <SALE_STATUS>:
  #   alias: [saleStatus]
  #   values: {ON_SALE: ["1", Y, 판매중], OFF_SALE: ["0", N, 판매중지]}
  #   default: ON_SALE
  # <ANNUAL_FEE>:
  #   alias: [feeAmount]                                  # "18,000원" -> 18000
  #   transform: [{name: regex_sub, pattern: "[^0-9]", repl: ""}, {name: to_int}]
  # <DISPLAY_NM>:
  #   template: "{{<BRAND_NM>}} {{<TARGET_FIELD_1>}}"      # 다른 필드를 합쳐 만든다
  # <PRODUCT_ATTRS>: {pack: [<ANNUAL_FEE>, <GENERATED_FIELD>]}   # llm.out 도 묶을 수 있다

# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
#   루트 원천값 → default → const → values → transform → template → pack
#   → require 검사 → 섹션 생성 → llm → pack 다시 적용
# · default 다음에 const 가 덮어쓰므로 둘 다 적으면 const 가 우선한다.
# · default 값도 values·transform 을 거친다. 앞에 regex_extract 를 두면 그 패턴이 default 값에도
#   맞아야 한다(맞지 않으면 default 가 지워진다).
# · require 는 LLM 호출 전의 값을 본다. const/default/template 으로 채운 필드는 통과하지만
#   llm 에서만 채우는 필드는 이 시점에 비어 있다.
# · llm 산출에는 values·transform·template 이 적용되지 않는다. pack 만 다시 적용된다.

# ── [선택] 필수 공통 필드 ───────────────────────────────────────────────────
# 여기 적은 필드의 값이 비면(원천에 없거나 key 이름이 어긋나면) `source.on_missing` 에 따라
# 처리한다. 기본은 error(요청 실패), skip 이면 경고 후 섹션 0건이다. 요청 시점에 검사한다.
# `llm` 이 만드는 필드는 적지 않는다 — 기동 검사가 잡지 못하고, 요청마다 on_missing 대로
# 실패하거나 0건이 된다.
# require:
#   fields: [<TARGET_FIELD_1>]

# ── [선택] 청크 본문에 실을 공통 필드와 항목명 ──────────────────────────────
# fields : 청크 접두(본문 맨 앞)에 실을 공통 필드. 적지 않은 필드는 metadata 에만 남는다.
#          BIZ_ID 처럼 사람이 검색어로 쓰지 않는 내부 식별자는 빼 두면 잡음이 줄어든다.
#          생략하면 labels 에 이름이 있는 필드가 실린다. 접두를 아예 끄려면 `fields: []`.
# labels : 접두와 once 로 싣는 필드 앞에 붙일 항목명(`항목명: 값`). 없으면 값만 실린다.
#          섹션 본문(자동 생성)에는 관여하지 않는다.
# once   : 문서 1건에 하나뿐인 값(연회비·작성일 등)을 **첫 청크에만 1회** 싣는다. 모든 청크에
#          붙이면 chunk_size 를 그만큼 소모하고 같은 문장이 섹션 수만큼 임베딩에 들어간다.
#          값 자체는 모든 청크 metadata 에 실리므로 필터 검색은 전 청크에서 된다.
#          접두 뒤에 들어간다. body.fields 에 있는 필드를 적으면 매 청크 접두에서 빠지고 첫
#          청크에만 실린다. `llm.out` 필드도 쓸 수 있다. 주입 횟수만 정하며 섹션 본문(원천)에
#          있는 같은 내용은 지우지 않는다.
# body:
#   fields: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]
#   labels:
#     <TARGET_FIELD_1>: <항목명>
#     <TARGET_FIELD_2>: <항목명>
#   once: [<ANNUAL_FEE>]

# ── [선택] JSON 에 없는 값만 LLM 으로 만든다 ────────────────────────────────
# 규칙으로 뽑을 수 있는 값(코드·금액·본문)은 LLM 에 맡기지 않고, 판단이 필요한 값만 적는다.
# llm 항목마다 **문서(파일) 1건당 1회** 호출하고, 결과를 그 파일의 모든 섹션에 같은 값으로 싣는다.
# 쓰기로 했다면 `out` 과 `in` 은 둘 다 필수다(비우면 기동 실패). `scope` 는 적지 않는다.
#
# `in` 에 쓸 수 있는 것
#   · `fields` 의 목표필드명 (`PRODUCT_NM` …)   — 짧은 사실값
#   · `PRODUCT_INFO`                             — 문서 전체(모든 섹션 본문을 이어붙인 것)
#   · JSON 의 key 이름 (`htmlList`, `feeUrl` …)  — 그 key 를 경로에 가진 섹션 본문만(권장)
# 경로(`htmlList.feeUrl`)가 아니라 이름만 적는다. 같은 이름의 섹션이 여럿이면 전부 이어붙인다.
# 원문 HTML 이 아니라 청크에 실리는 평문이 들어간다. 이름을 찾지 못하면 경고가 남고 그 입력이
# 빠진다. 추출값이 비면 먼저 이 경고가 있는지 로그를 확인한다.
#
# out 의 이름은 프롬프트가 내놓는 JSON 키와 **정확히 같아야** 한다. 어긋나면 오류 없이 null 이다.
# out 필드는 `fields` 에 선언하지 않고 body.fields·once·labels·pack 에 그대로 쓸 수 있다.
# out 은 값 타입을 강제하지 않는다. 모델이 객체를 주면 접두·once 에 `{'키': '값'}` 같은 파이썬 표기로
# 실리므로, 문자열이 필요하면 프롬프트에 형식을 지시한다.
# out 이름을 `fields` 목표필드와 겹치게 두면 LLM 결과가 원천 값을 덮어쓴다(실패해도 null 로 덮는다).
# llm:
#   - out: [<GENERATED_FIELD>]
#     in:  [<JSON_KEY>]                       # 예: feeUrl. 문서 전체는 PRODUCT_INFO
#     parser: {type: json}
#     # 접속 정보는 프로세서 설정 최상위 model_presets 에 두고 여기서는 이름만 부른다.
#     # 이 항목만 다른 모델을 쓰려면 url/api_key/model 을 직접 적는다(직접 적은 값이 우선한다).
#     endpoint:
#       model_preset: default
#     params:                                 # top_p·seed·repetition_penalty·headers 도 쓸 수 있다.
#                                             # 공급자 전용 값은 하위 `params:` 매핑에(위 값보다 우선)
#       max_tokens: 1000
#       temperature: 0.0
#       timeout: 120
#     prompt:
#       system: |
#         <역할>. 반드시 하나의 JSON 객체만 반환한다. 설명 문구·코드펜스 없이 순수 JSON 만 출력한다.
#         키는 `<GENERATED_FIELD>` 하나다.
#         원문에 없는 내용을 지어내지 않는다(환각 금지). 만들 것이 없으면 값을 null 로 둔다.
#
#         출력 예시 형식(값은 예시):
#         {"<GENERATED_FIELD>": "<예시 값>"}
#       user: |
#         <지시문>
#
#         반드시 `<GENERATED_FIELD>` 키를 가진 JSON 객체로만 반환하라.
#
#         <document>
#         {{raw_text}}
#         </document>

# ── [선택] 표 설명(table_text_description)을 이 문서유형에서만 바꾼다 ────────
# **최상위 키**다. 프로세서 설정의 공통 `table_text_description` 이 기본이고, 여기 적은 키만
# 덮어쓴다(rag 하위도 키 단위 병합). 섹션 본문 안의 <table> 에도 표 설명이 붙는다.
# enable·입력 예산·overflow_policy 예시는 custom_field_TEMPLATE_document.yaml 의 같은 블록에 있다.
# table_text_description:
#   rag:
#     key_fact_limit: 5

# ═══════════════════════════════════════════════════════════════════════════
#  기동 시 자동 검사
#
#  실패시킨다: 이 kind 가 읽지 않는 키(오타는 가까운 이름을, 다른 kind 의 키는 어디 전용인지
#  알려준다), object 가 아닌 필드 값, 예약 이름·규칙 위반 목표필드명, 모르는 변환기·잘못된
#  정규식, 아무도 만들지 않는 필드를 가리키는 template.
#    sections 가 읽지 않는 대표 키: body.split · body.repeat · body.mirror_to · filter
#                                   · 필드의 collect · seq · alias [$file]
#                                   · source.records_at · source.merge_rows
#  경고만 남긴다: body.fields·body.labels 가 아무도 만들지 않는 필드를 가리킬 때, `values` 에 없는
#  값, `llm.in` 의 이름을 찾지 못할 때.
#  못 잡는다: alias 가 원천과 어긋나 값이 비는 경우, require 에 llm 필드를 적은 경우,
#  `sections`·`ignore_keys` 의 key 이름 오타, `source.pre` 를 적은 경우(무시된다).
#
#  오류 메시지는 내부 이름으로 나온다: fields(alias)→shared_fields, body.fields→text_fields,
#  body.once→first_chunk_fields, values→value_map, require.fields→required_shared_fields,
#  on_missing→missing_policy, seq→sequence, raw→raw_fields, template→derive.
#
# ═══════════════════════════════════════════════════════════════════════════
#  확인 방법 — 저장소 루트에서 실행한다. <resource 폴더> 에는 현장 설정 폴더 경로를 그대로 쓴다.
#
#  1) 설정 점검(파싱·LLM 없음). 스키마·지원 키·변환기 오류를 미리 보여 준다.
#     기동 시 설정 검사도 같은 함수로 실행한다. 값이 맞게 나오는지는 보지 않으므로 2) 도 실행한다.
#       PYTHON=genon/preprocessor/.venv/bin/python genon/preprocessor/tools/config_precheck/precheck_custom_fields.sh <resource 폴더>
#
#  2) 실제 원천으로 파싱·청킹. <출력폴더> 의 *.chunks.json 에서 각 청크의 최상위 키로 공통 필드와
#     SECTION_NM·SOURCE_JSON_PATH 가 실린다. llm 블록이 있으면 실제 LLM 을 호출한다.
#       genon/preprocessor/.venv/bin/python genon/preprocessor/tools/parse_chunk/parse_chunk_test.py --config <resource 폴더>/parse_config.yaml \
#         --chunker-config <resource 폴더>/chunk_config.yaml --doc_type <유형> <샘플> <출력폴더>/
#
#  증상별 원인
#  · require 를 채우지 못해 요청이 실패하면(기본 on_missing: error) 루트 원천값과 alias, 그리고
#    default·const·transform·template 을 거친 값을 본다. 섹션이 0건이면 최상위가 객체인지,
#    on_missing, ignore_keys, 공통 필드뿐인 입력, 빈 본문을 함께 본다.
#  · 결과에 필드가 아예 없으면 요청 doc_type 과 등록 doc_type 이 일치하는지 본다.
#  · 관계없는 대상의 내용이나 이상한 값(색상·경로·코드뿐인 짧은 줄)이 섞이면 ignore_keys 에 추가한다.
#  · 섹션 제목이 원문 key 이름(feeUrl 등) 그대로 나오면 그 값 안에 제목(h1~h6 등)이 없다는 뜻이다 —
#    `source.sections` 에 표시 이름을 적는다.
#  · SOURCE_JSON_PATH 의 배열 인덱스는 0부터 센다(JSONPath 규약) — `$.bubble[0]` 이 첫 원소.
#
#  · 저장소 회귀 검증: genon/preprocessor/tools/parse_chunk/parse_chunk_verify.py 의 CASES 에 샘플을,
#    EXTRA_CHECKS 에 새 필드 기대값을 넣고 genon/preprocessor/tools/parse_chunk/parse_chunk_verify.sh
#    --resource-dir <resource 폴더> --only <유형> 으로 실행한다(SKIP 은 사유를 본다). 스크립트가 자기 폴더로
#    이동한 뒤 실행되므로 --resource-dir 에는 절대 경로를 준다.
#
#  배포 — 사이트 전용 유형은 그 사이트 manifest.yaml 의 `owned:` 에 이 파일과, 등록을 넣은
#  parse_config.yaml 을 함께 올린다. owned 가 아닌 파일은 build-script/sync-sites.sh 가 표준
#  사본으로 덮어쓰거나 지운다. 표준 유형도 파서 설정을 owned 로 둔 사이트에는 그 파일에 따로 등록한다.
# ═══════════════════════════════════════════════════════════════════════════
