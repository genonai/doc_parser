# AI 차트뷰 Excel 행 → TB_STOCK_INSIGHT 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: stock_insight
#       extractor: tabular_mapping
#       config_file: custom_field_stock_insight.yaml
#
# 원천: [AI차트뷰]<국장|미장>_yyyymmdd.xlsx (S3://os-tifa-sss/FAO/ADAC)
#   국장/미장 공통. 시트 1개(`Sheet`)이고 `detail_desc` 셀에만 JSON 문자열이 들어 있다
#   (파일 자체는 xlsx 이므로 tabular_mapping 이 맞다 — json_mapping 이 아니다).
#
# 2026-08-28 원천 개편으로 헤더가 한글에서 영문 소문자로 전면 교체되었다:
#   jong_name · jong_code · regt_no · ntc_objline · detail_desc · news_date ·
#   md_stck_itm_c · kosc_stck_itm_c · nat_c
# 옛 한글 헤더도 별칭에 남겨 둔다 — 과거 파일을 다시 돌릴 때 그대로 통과시키기 위해서다.

schema: v2
source:
  kind: rows
  merge_rows:
    group_by: [REGT_NO, JONG_CODE]
    order_by: NTC_OBJLINE_NO
    concat: [DETAIL_DESC]
fields:
  BIZ_ID:
    alias: [ID, 아이디]
    default: null
  REGT_NO:
    alias: [등록번호, regt_no, REGT_NO]
    default: null
  NTC_OBJLINE_NO:
    alias: [ntc_objline, ntc_objline_no, NTC_OBJLINE_NO, 게시물 라인번호]
    default: null
  JONG_CODE:
    alias: [종목코드, jong_code, JONG_CODE]
  JONG_NM:
    alias: [종목명, jong_name, jong_nm, JONG_NAME]
  NEWS_DATE:
    alias: [뉴스일자, news_date, NEWS_DATE]
    transform: date_int_flex
  DETAIL_DESC:
    alias: [상세내용, detail_desc, DETAIL_DESC, 세부내용]
    default: null
    transform: text_norm
  ANALYSIS_DATE:
    alias: [NEWS_DATE, 분석기준일, 분석 기준일, news_date, 뉴스일자]
    transform: date_int_flex
  GROUP_C:
    const: SSS
  CURRENT_YN:
    const: Y
  DETAIL_TEXT:
    from: DETAIL_DESC
    as: auto
require:
  fields: [GROUP_C, JONG_CODE, JONG_NM, ANALYSIS_DATE]
body:
  fields: [JONG_NM, DETAIL_TEXT]
  split: true
  repeat: [JONG_NM]
