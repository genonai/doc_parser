# 관심소식 JSON 레코드 → TB_NEWS 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: monimo_news
#       extractor: json_mapping
#       config_file: custom_field_monimo_news.yaml
#
# 원천: ssc_rag_adin_yyyymmdd_delta_001.json (카드 WCMS)
#
# TB_NEWS 테이블 설명: "관심소식 목록입니다. 이벤트와 같은 구조이며, 종료일이 지나면
# 검색에서 자동으로 빠집니다." — 실제로 원천 JSON 도 이벤트와 같은 eventList 구조다.
# custom_field_monimo_event.yaml 과 짝을 이루므로 한쪽을 고치면 다른 쪽도 함께 본다.
#
# TB_EVENT 와의 차이:
#   - 시작일 컬럼이 없다(NEWS_TO 만 있는 기간 게이트)
#   - KEYW_CTGR_NM(키워드구분명) 과 CN_URL(콘텐츠 상세 경로) 가 추가된다
#
# 입력 예시(관심소식 시트의 "공통 표준 레이아웃"):
#   {"eventList": [{"ID": "CM26061182", "회사명": "모니모",
#                   "제목": "하이마트 구독을 가볍게 매월 최대2만원 까지 혜택",
#                   "카테고리": "가전", "키워드": "하이마트 구독",
#                   "개시 시작일": "260701", "개시 종료일": "260731",
#                   "사용여부": "N", "노출여부": "Y",
#                   "wcmsHtml": {"htmlText": "상세 내용"}}]}
  # KEYW_CTGR_NM 은 DB 설명이 "키워드구분명(원천 코너명·행별 분류)" 이라
  #    원천의 `카테고리`(가전)와 `키워드`(하이마트 구독) 중 어느 쪽인지 확정되지 않았다.
  #    현재는 코너명에 가까운 `카테고리` 를 우선으로 두었다 — 원천 담당 확인 후 조정할 것.
                                                  # 공통 표준 레이아웃에는 URL 필드가 없다.
                                                  # 받은 원본의 detailUrl/buttonLink 를 필수 요청
                                                  # 사항에 추가해야 채워진다.
  #SEARCHABLE_YN: [노출여부]                        # 원천에 `사용여부` 와 `노출여부` 가 따로 있다.
                                                  # 두 값을 어떻게 결합할지 확인 필요 — 현재는 노출여부만 본다.
  # SEARCHABLE_YN:
  #   "Y": [노출, 사용]
  #   "N": [미노출, 미사용]
  # - GROUP_C
# "260701" 처럼 6자리로 오는 표기도 date_int_flex 가 20260701 로 펼친다.
# llm_fields:
#   - output_fields: [SUMMARY_TEXT]        # 요약본문 (임베딩 입력)
#     input_fields: [TITLE, KEYW_CTGR_NM, DETAIL_TEXT]
#     concurrency: 4
#     on_error: null
#     # <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
#     url: "https://genos.genon.ai/api/gateway/rep/serving/752/v1/chat/completions"
#     api_key: "d1a9e0acab6243019008a96cd8af868e"
#     model: model
#     max_tokens: 1000
#     temperature: 0.0
#     timeout: 120
#     parser:
#       type: json
#     system_prompt: |
#       너는 제휴 혜택 소식 요약 전문가다. 주어진 관심소식 상세 내용을 검색용 임베딩에 넣을 요약본문으로 압축한다.
#       규칙:
#       - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
#       - 키는 `SUMMARY_TEXT` 하나다. 값은 요약본문 문자열이다.
#       - 원문에 없는 정보를 지어내지 않는다(환각 금지).
#       - 요약본문에는 이용자가 검색할 만한 표현을 남긴다: 소식 제목, 대상 브랜드·제휴사, 혜택 종류와
#         금액/비율, 참여·이용 방법, 기간 조건. 배너 문구·버튼 라벨·법적 고지 상용구는 제외한다.
#       - 문장형 한국어로 3~6문장, 800자 이내로 쓴다. 불릿·머리기호를 쓰지 않는다.
#       - 상세 내용이 비어 있거나 요약할 내용이 없으면 값을 null 로 둔다.
#       출력 예시 형식(값은 예시):
#       {"SUMMARY_TEXT": "하이마트 구독 서비스를 삼성카드로 결제하면 매월 최대 2만원까지 …"}
#     user_prompt: |
#       아래 관심소식 정보를 검색용 요약본문으로 압축하라.
#       - SUMMARY_TEXT (요약본문) — 필수
#       반드시 `SUMMARY_TEXT` 키 하나를 가진 JSON 객체로만 반환하라.
#       <news>
#       {{raw_text}}
#       </news>
# ── [선택] 청크 본문에 함께 실을 항목명 ─────────────────────────────────────
# 본문 필드를 `항목명: 값` 으로 낸다. 여기 이름이 없는 필드는 값만 나간다.
# 사람이 검색어로 쓰는 말을 적는다 — 목표필드명(DB 컬럼명)이나 원천 key 는 검색어에 안 나온다.
# 값에 줄바꿈이 있는 블록(상세 본문 등)에는 붙지 않는다. 그 블록은 이미 자기 제목을 갖는다.
# 상세 원문 HTML 은 DETAIL_HTML metadata 로만 싣고, 임베딩 입력은 요약본문을 쓴다.
# 제목을 앞에 두는 이유는 custom_field_monimo_event.yaml 과 같다(요약 실패 시 본문 소실 방지).

schema: v2
source:
  kind: records
  records_at: eventList
  on_missing: error
fields:
  BIZ_ID:
    alias: [ID, 아이디]
    default: null
  GROUP_C:
    alias: [회사명, corp_code, 고객사]
    default: IFP
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  TITLE:
    alias: [제목, title, evtTodayMainCopy]
  KEYW_CTGR_NM:
    alias: [카테고리, 키워드, 코너명]
    default: null
  CN_URL:
    alias: [buttonLink, detailUrl, 콘텐츠 상세 경로, 상세경로]
  NEWS_TO:
    alias: [개시 종료일, 종료일, endDate, evtPtrmEndDt]
    transform: date_int_flex
  DETAIL_HTML:
    alias: [htmlText, 상세내용]
  # DETAIL_HTML 과 **같은 원천**을 한 번 더 읽어 평문 사본을 만든다. 원본 HTML 은
  # metadata 로만 싣고 임베딩 입력은 이 평문을 쓴다.
  # `html_text` 는 HTML 로 강제 평문화한다(표·목록 구조 유지).
  DETAIL_TEXT:
    alias: [htmlText, 상세내용]
    transform: html_text
require:
  fields: [TITLE]
body:
  fields: [TITLE, DETAIL_TEXT]
  labels:
    TITLE: 제목
    DETAIL_TEXT: 상세내용
  split: true
  repeat: [TITLE]
