# AI 차트뷰 구분자 텍스트 원천 (2026-09-22 개편, 이전 원천은 xlsx)
#
# 헤더 없이 데이터부터 시작하며 한 줄이 한 행이고 필드는 구분자로 나뉜다.
#   테슬라<구분자>NQQUSATSLA<구분자>4556<구분자>1<구분자>{"trading_strategy": ...<구분자>20260821<구분자>US88160R1014<구분자>TSLA.O<구분자>US
# 원천 컬럼(아래 columns 순서):
#   jong_name(종목명) · jong_code(종목코드) · regt_no(등록번호) · ntc_objline(게시물라인번호) ·
#   detail_desc(세부내용, json) · news_date(뉴스일자) · md_stck_itm_c · kosc_stck_itm_c · nat_c
# 텍스트 원천은 확장자와 무관하게 이 설정으로 읽힌다(parser._route_delimited_records).
# ── 여러 행에 쪼개진 detail_desc 를 한 레코드로 접기 ─────────────────────────
# 원천이 한 종목의 JSON 하나를 ntc_objline 1..N 으로 **문자 단위 절단**해 행마다 뿌린다.
# 조각 수는 종목마다 다르다(실측 6~7). 실제 원천에 `"price_pat` / `tern_desc":` 처럼
# 키 이름 중간에서 끊긴 사례가 있어 **구분자 없이** 이어붙여야 JSON 이 복원된다(separator 기본값 "").
# 같은 종목코드·뉴스일자는 원천 안에서 떨어져 있어도 한 레코드로 모은다. 같은 종목·일자가
# 등록번호를 달리해 여러 번 오는 사례가 있고, 게시물 라인번호는 등록번호마다 1부터 다시
# 매겨지므로 등록번호(part_by)로 문서를 먼저 가른 뒤 그 안에서 라인번호 순으로 잇는다.
# 문서가 둘 이상이면 `[문서1,문서2]` JSON 배열로 합쳐진다.
# 이 블록이 없으면 종목 하나가 깨진 JSON 조각 6~7개의 청크로 흩어진다.

schema: v2
source:
  # kind: rows
  kind: records
  pre:
    delimited:
      # 메모장으로 열면 `□|` 로 보이는 두 글자다. □ 는 제어문자 0x1F(Unit Separator)다.
      separator: "\x1f|"
      # 순서가 곧 원천의 필드 순서다. 이름은 이전 xlsx 헤더와 같게 두어 아래 alias 를 그대로 쓴다.
      columns: [jong_name, jong_code, regt_no, ntc_objline, detail_desc,
                news_date, md_stck_itm_c, kosc_stck_itm_c, nat_c]
  merge_rows:
    group_by: [JONG_CODE, NEWS_DATE]
    part_by: REGT_NO
    order_by: NTC_OBJLINE_NO
    # DETAIL_TEXT 도 같은 원천을 읽으므로 함께 이어붙여야 한다 — 병합은 값 파이프라인
    # **전에** 돌기 때문에, 여기 없으면 첫 조각만 남은 채로 평문화된다.
    concat: [DETAIL_DESC, DETAIL_TEXT]
fields:
  BIZ_ID:
    template: "{{JONG_CODE}}_{{NEWS_DATE}}"
    default: null
  REGT_NO:
    alias: [등록번호, REGT_NO, regt_no]
    default: null
    meta: false
  NTC_OBJLINE_NO:
    alias: [NTC_OBJLINE_NO, ntc_objline, ntc_objline_no, 게시물 라인번호]
    default: null
    meta: false
  JONG_CODE:
    alias: [종목코드, jong_code, JONG_CODE]
  JONG_NM:
    alias: [종목명, jong_name, jong_nm, JONG_NAME]
  NEWS_DATE:
    alias: [뉴스일자, NEWS_DATE, news_date]
    transform: date_int
  DETAIL_DESC:
    alias: [상세내용, DETAIL_DESC, detail_desc]
    default: null
  ANALYSIS_DATE:
    alias: [NEWS_DATE, news_date, 분석기준일, 분석 기준일, 뉴스일자]
    transform: date_int
  GROUP_C:
    const: SSS
  # DETAIL_DESC 와 **같은 원천**을 한 번 더 읽어 평문 사본을 만든다. 원본(DETAIL_DESC)은
  # TB 정의상 그대로 보관해야 하므로 제자리 변환이 아니라 필드를 따로 둔다.
  DETAIL_TEXT:
    alias: [상세내용, detail_desc, DETAIL_DESC, 세부내용]
    default: null
    transform: [to_text]
require:
  fields: [GROUP_C, JONG_CODE, JONG_NM, ANALYSIS_DATE]
body:
  fields: [JONG_NM, DETAIL_TEXT]
  labels:
    JONG_NM: 종목명
    DETAIL_TEXT: 세부내용
  split: true
  repeat: [JONG_NM]
