# 고객센터 생명, Excel

schema: v2
source:
  kind: rows
fields:
  BIZ_ID:
    alias: [ID, 아이디, 번호]
  GROUP_C:
    const: SLF
  CS_CTGR_L1:
    alias: [대분류, 분류(대)]
  CS_CTGR_L2:
    alias: [중분류, 분류(중)]
    default: null
  CS_CTGR_L3:
    alias: [소분류, 분류(소)]
    default: null
  TITLE:
    alias: [질문]
    transform: text_norm
  CONTENT:
    alias: [내용, 답변]
    # transform: html_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [게시일자]
    default: null
    transform: date_int_flex
require:
  fields: [GROUP_C]
body:
  fields: [CS_CTGR_L1, TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, TITLE]
