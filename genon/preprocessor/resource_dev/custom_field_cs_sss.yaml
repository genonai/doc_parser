# 고객센터(증권) JSON 레코드 → TB_CS_ITEM 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: cs_sss
#       extractor: json_mapping
#       config_file: custom_field_cs_sss.yaml
#
# 원천: sss_rag_adcc_yyyymmdd_delta_001.json (S3://os-tifa-sss/FAO/ADCC)
#
# 입력 예시(고객센터 시트의 "분석된 수집 문서 구조"):
#   {"ID": "FAQ_0007", "회사명": "증권", "category": "국내주식",
#    "question": "시간외 종가 주문을 신청하려면 어떻게 하나요?",
#    "answer": "<html> 내용", "related_keywords": [],
#    "linked_screen": "주식주문 #1149", "최종수정일": "2026-06-01"}

schema: v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    alias: [ID, id]
    default: null
  GROUP_C:
    alias: [회사명, corp_code, 고객사]
    const: SSS
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CATEGORY:
    alias: [category, 문의유형, 카테고리]
    default: null
  TITLE:
    alias: [question, 제목, 대표질문]
  CONTENT:
    alias: [answer, 안내본문, 답변]
    transform: html_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    default: null
require:
  fields: [TITLE]
body:
  fields: [CS_CATEGORY, TITLE, CONTENT]
  labels:
    TITLE: 제목
    CONTENT: 안내내용
  split: true
  repeat: [CS_CATEGORY, TITLE]
