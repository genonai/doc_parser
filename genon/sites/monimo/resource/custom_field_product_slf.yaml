# product_slf(삼성생명 상품설명서) custom_fields

schema: v2
source:
  kind: document
  pre:
    markdown:
      front_matter:
        exclude_text_fields: ['*']
        on_missing: warn
      text_fence:
        enable: true
        langs: ['', text]
        min_hangul_ratio: 0.3
      sections:
        after_heading: '## 원문 전사'
        exclude: ['## 문서 개요', '## 핵심 키워드', '## 내용 색인', '## 원문*쪽-목차']
fields:
  created_date:
    alias: [created_at]
    transform: date_int
  PRODUCT_C:
    alias: [product_code, product_codes]
    default: null
  GROUP_C:
    const: SLF
  SALE_STATUS:
    const: SALE
  BIZ_ID:
    alias: [$file]
    transform: {name: hash, prefix: SLF_PROD_, length: 16}
    default: null
  PRODUCT_NM:
    alias: [title]
    transform:
    - {name: regex_sub, pattern: '\s*상품요약서$', repl: ''} 
  PRODUCT_ATTRS:
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}
    - {name: regex_extract, pattern: '^\s*([^~]*?)(?:\s*~\s*.*)?$'}
    - date_int
    - {name: to_json, key: "created_at"}
  VALID_FROM:
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}
    - {name: regex_extract, pattern: '^\s*([^~]*?)(?:\s*~\s*.*)?$'}
    - date_int
  # 종료일이 숫자 없는 글자(진행중 등)면 99991231, `~` 가 없으면 0(날짜 없음)으로 둔다
  VALID_TO:
    alias: [sales_period, version]
    transform:
    - {name: regex_sub, pattern: '\s+', repl: ' '}
    - {name: regex_extract, pattern: '~\s*(.*?)\s*$'}
    - {name: regex_sub, pattern: '^\D+$', repl: '99991231'}
    - date_int
body:
  once: [created_date]
  labels:
    created_date: 출시일
  # 본문이 이 글자 수 미만인 chunk 를 다음 chunk 에 합친다
  merge_short: 200
# skip 조건에 해당하는 표는 LLM 표 설명을 만들지 않는다
table_text_description:
  skip:
    single_value_table: true      # 값이 한 칸뿐이거나 데이터 행이 없는 표
    nested_table: true            # 다른 표의 칸 안에 든 표
    duplicate_table: true         # 앞선 표에 모든 행이 이미 실린 표
    self_describing_table: false  # 제목이 있고 병합 셀이 없는 5행 이하·2~3열의 문장 표
    long_text_table: 100          # 값 칸 평균 문자 수가 이 값 이상인 표(0=끔)
