# 고객센터(화재) 구분자 원천
#
# 원천 한 줄의 모양 — 헤더 없이 데이터부터 시작한다.
#   대분류|@|중분류|@|소분류|@|제목|@|"<style>…<table>…</table>"

schema: v2
# table_text_description:
#   enable: false
source:
  kind: records
  # 원천을 레코드 목록으로 바꾸는 전처리. columns 순서가 곧 원천의 필드 순서다.
  # 파일을 통째로 메모리에 올리지 않고 줄 단위로 읽는다.
  pre:
    delimited:
      separator: "|@|"
      columns: [대분류, 중분류, 소분류, 제목, 내용]
fields:
  BIZ_ID:
    # 원천에 ID 가 없어 행의 분류·제목을 결합해 해시로 코드화한다. 같은 행이면 다시 적재해도
    # 같은 값이다(제목이 바뀌면 새 ID). 빈 소분류도 구분자 자리를 남겨 `A||B` 와 `A|B|` 를 가른다.
    template: "{{CS_CTGR_L1}}|{{CS_CTGR_L2}}|{{CS_CTGR_L3}}|{{CUSTOM_TITLE}}"
    transform: {name: hash, prefix: SSF_CS_, length: 16}
  GROUP_C:
    const: SSF
  CS_CTGR_L1:
    alias: [대분류]
  CS_CTGR_L2:
    alias: [중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [제목]
    transform: text_norm
  CONTENT:
    alias: [내용]
    transform: html_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    default: null
require:
  fields: [GROUP_C]
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
