# ImageDescriptionEnricher 설정 — google/gemini-2.0-flash-001 (OpenRouter)
# api_key는 코드에서 주입

url: https://openrouter.ai/api/v1/chat/completions
model: google/gemini-2.0-flash-001
max_tokens: 1000
temperature: 0.1
timeout: 90

prompt: |
  이미지를 간결하고 정확하게 설명하세요. 이미지에 텍스트가 포함된 경우 그대로 인용하고, 도표·그래프는 수치와 항목을 포함해 설명하세요.
