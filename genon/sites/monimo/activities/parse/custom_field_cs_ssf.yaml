# 문서 유형 cs_ssf(삼성화재 고객센터 안내)의 custom_fields 설정 — 구분자로 나뉜 텍스트 파일의 한 줄을 안내 한 건으로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADCCTBSSF001)의 컬럼 이름과 같다
# (CUSTOM_TITLE 은 TITLE 컬럼에 들어간다. CS_CTGR_L1·L2·L3 은 대·중·소분류다).
# BIZ_ID 는 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# 원본 한 줄의 모양 — 헤더 줄 없이 첫 줄부터 데이터이고, 필드는 `|@|` 로 나뉜다.
#   대분류|@|중분류|@|소분류|@|제목|@|"<style>…<table>…</table>"

schema: v2
# table_text_description:
#   enable: false
source:
  kind: records
  pre:
    delimited:
      separator: "|@|"
      columns: [대분류, 중분류, 소분류, 제목, 내용]
fields:
  BIZ_ID:
    # 원본에 ID 가 없어 분류·제목·내용을 이어 붙인 값을 해시(SHA-1)해 만든다. 같은 행은 다시 적재해도
    # 같은 값이 나오고, 제목·내용이 바뀌면 새 ID 가 된다. to_text 로 평문화한 뒤의 값을 쓰므로
    # HTML 태그만 바뀐 경우에는 ID 가 그대로다.
    template: "{{CS_CTGR_L1}}|{{CS_CTGR_L2}}|{{CS_CTGR_L3}}|{{CUSTOM_TITLE}}|{{CONTENT}}"
    transform: {name: hash, prefix: SSF_CS_, length: 16}
  GROUP_C:
    const: SSF
  CS_CTGR_L1:
    alias: [대분류]
  CS_CTGR_L2:
    alias: [중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  CUSTOM_TITLE:
    alias: [제목]
    transform: to_text
  CONTENT:
    alias: [내용]
    transform: to_text
  RELATED_KEYWORDS:
    alias: [related_keywords, 연관 키워드]
    default: null
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    default: null
    # 날짜를 다른 문서 유형과 같은 YYYYMMDD 정수로 바꾼다(기간 필터·최신순 정렬에 쓴다). 값이 없으면 0(날짜 없음)이다.
    transform: date_int
# 이 필드가 빈 레코드는 건너뛴다
require:
  fields: [GROUP_C]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [CS_CTGR_L1, CUSTOM_TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    CUSTOM_TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, CUSTOM_TITLE]
