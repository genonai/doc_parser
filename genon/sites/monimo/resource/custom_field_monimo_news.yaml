# 관심소식 상세 HTML → TB_NEWS 목표필드 (모니모)
#
# 원천: TD00008459_d_5199.html.json (카드 WCMS) — 문서 하나가 관심소식 한 건이다.
#
#   {"wcmsData": {"html": {"content": "<div class=\"newsletter-article-wrap\" ...>"},
#                 "json": {}}}
#
# 값은 `content` 하나뿐이다. `source.pre.json.body_from` 이 그 HTML 을 본문으로 꺼내고,
# 각 필드는 `select` 로 원문 HTML 에서 직접 뽑는다.
#
# custom_field_monimo_event.yaml 과 짝을 이루므로 한쪽을 고치면 다른 쪽도 함께 본다.

schema: v2
source:
  kind: html
  pre:
    json:
      # wcmsData.html.content 를 이름(content)으로 잡는다.
      body_from: [content]
      format: auto
      on_missing: skip

# 선택자는 요건표가 지목한 원천 마크업 그대로다. `newslertter-` 의 오타도 원천 그대로이므로 고치지 않는다.
fields:
  BIZ_ID:
    # 원천(content 하나뿐)에는 ID 가 없어 파일명 앞의 `TD…` 를 쓴다.
    # 예: TD00008415_d_5199.html.json → TD00008415
    alias: [$file]
    transform: {name: regex_extract, pattern: '^(TD\d+)'}
    default: null
  GROUP_C:
    default: IFP
  USE_YN:
    default: Y
  CUSTOM_TITLE:
    select: .new-banner-headline
  CATEGORY:
    # 이 값만 텍스트가 아니라 wrap div 의 속성에 있다.
    select: .newsletter-article-wrap
    attr: newsletter-title
  SUMMARY:
    # 본문 문단도 같은 `newsletter-article-txt` class 를 쓰므로 요약 상자로 범위를 좁힌다.
    select: .article-summary-box
  DETAIL:
    select: .newslertter-article-content
  SOURCE:
    select: .newsletter-source
body:
  once: [CATEGORY, CUSTOM_TITLE]
  labels:
    CATEGORY: 카테고리
    CUSTOM_TITLE: 제목
