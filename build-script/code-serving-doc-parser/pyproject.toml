[project]
name = "doc-parser-serving"
version = "0.1.0"
description = "doc-parser code-serving base image deps (genon/preprocessor uv 정보 기반)"
readme = "README.md"
requires-python = ">=3.11,<4.0"

# 의존성은 genon/preprocessor 의 uv 정보를 기반으로 한다.
#   - preprocessor 의 직접 deps (단, `docling` 패키지 자체는 제외 —
#     코드서빙 복사본(sync-serving-repo.sh)에는 docling 소스 대신 packages/ 의 wheel 을 동봉하고,
#     런타임에 requirements.txt 경로 참조로 genon-docling(import name: docling) 을 설치한다. build-docling-wheel.sh 참고).
#   - vendored docling(repo 루트 pyproject) 의 직접 deps — docling import 에 필요한
#     easyocr/rtree/tree-sitter*/scipy/pandas/openpyxl/marko/lxml/pylatexenc 등.
#   - 코드서빙 harness 필수 deps — pydantic-settings(settings), python-dotenv(env_loader).
# 버전 충돌은 더 구체적인 pin(주로 preprocessor) 을 채택했다.
# preprocessor / repo 루트 docling 의 deps 가 바뀌면 이 목록도 동기화할 것.
dependencies = [
    # ── docling 계열 (docling 패키지 자체는 제외) ──────────────────────────────
    "docling-core[chunking]==2.85.0",
    "docling-ibm-models==3.10.3",
    "docling-parse==7.3.0",
    # ── 코드서빙 harness (src/common, src/log_watcher) ────────────────────────
    "fastapi>=0.115.12",
    "starlette>=0.52.1",
    "uvicorn==0.21.1",
    "gunicorn==23.0.0",
    # python-multipart 0.0.22 의 취약점 5건(pip-audit): 수정본 중 가장 높은 0.0.31 로 상향.
    "python-multipart==0.0.31",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0,<2.0",
    "aiofile==3.9.0",
    "aiofiles==24.1.0",
    # CVE-2026-69244: aiohttp 3.13.4 취약, 수정본 3.14.3 으로 상향(site/monimo-2.2.3.1 과 동일).
    "aiohttp==3.14.3",
    "httpx>=0.27.0",
    "watchfiles==1.1.0",
    "pika==1.3.2",
    "minio==7.2.20",
    # ── 문서/파싱/OCR (preprocessor + docling deps) ──────────────────────────
    "unstructured==0.18.32",
    "unstructured-inference>=1.2.0",
    "unstructured-pytesseract==0.3.15",
    "pytesseract==0.3.13",
    "pymupdf>=1.26.4",
    "pypdfium2>=5.0.0,<6.0.0",
    # CVE-2025-64512: pdfminer.six 20250506 취약, 수정본 20251107 로 상향(날짜 버전이라 정확 고정).
    # PYSEC-2026-1761: 20251107 에도 취약점이 보고되어 수정본 20251230 으로 다시 상향.
    "pdfminer-six==20251230",
    "pdf2image==1.17.0",
    "pi-heif==0.22.0",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "openpyxl>=3.1.5,<4.0.0",
    "pyhwp==0.1b15",
    "python-magic==0.4.27",
    "filetype>=1.2.0,<2.0.0",
    "weasyprint==68.1",
    "markdown==3.8.2",
    "markdown2>=2.5.4",
    "marko>=2.1.2,<3.0.0",
    "lxml>=6.0.2,<7.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "pylatexenc>=2.10,<3.0",
    "opencv-python>=4.11.0.86",
    # CVE-2026-25990 은 12.1.1 에서 수정됐으나, 런타임에 얹는 docling 포크 wheel 이 pillow<12 를 요구해
    # 12.x 로 올리지 못한다. 11.x 최신을 하한으로 둔다. wheel 쪽 상한이 완화되면 >=12.3.0,<13 으로 올린다.
    "pillow>=11.3.0,<12.0.0",
    "wand",
    "rtree>=1.3.0,<2.0.0",
    "chardet==5.2.0",
    # ── ML / NLP ──────────────────────────────────────────────────────────────
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "easyocr>=1.7,<2.0",
    "huggingface-hub>=0.23,<1",
    "langchain>=1.2.10",
    "langchain-core>=1.2.11",
    "langchain-community>=0.4.1",
    "numpy==2.3.4",
    "scipy>=1.6.0,<2.0.0",
    "pandas>=2.1.4,<3.0.0",
    # CVE-2026-25087: pyarrow 22.0.0 취약, 23.0.1 로 상향.
    "pyarrow==23.0.1",
    # torch/torchvision 은 전이 의존(easyocr, docling-ibm-models)이라 선언이 없으면 lock 갱신 때마다
    # 버전이 움직인다. 운영 이미지와 배포본 constraints-cpu.txt 의 버전에 맞춰 고정한다.
    # CPU 휠은 Dockerfile 의 `--torch-backend=cpu` 가 고른다(lock 에는 PyPI 판이 기록된다).
    "torch==2.13.0",
    "torchvision==0.28.0",
    # ── 코드/텍스트 파싱 (docling deps) ───────────────────────────────────────
    "tree-sitter>=0.23.2",
    "tree-sitter-c>=0.23.6",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-typescript>=0.23.2",
    # ── 기타 (preprocessor + docling deps) ───────────────────────────────────
    "pydub==0.25.1",
    "requests>=2.32.2,<3.0.0",
    "certifi>=2024.7.4",
    "typer>=0.12.5,<0.17.0",
    "tqdm>=4.65.0,<5.0.0",
    "pluggy>=1.0.0,<2.0.0",
    # tabulate(docling-core 의 표 마크다운 직렬화)가 한글 등 전각 문자의 표시 폭을 계산할 때 쓴다.
    # 없으면 전각 문자를 1칸으로 세어 표 열 정렬이 달라진다. dev 그룹의 전이 의존으로만 들어와
    # 로컬·CI 와 운영 이미지의 출력이 달랐으므로 직접 선언한다.
    # 상한은 동작을 확인한 0.2.x 다. 0.9 이후는 검증하지 않았다.
    "wcwidth>=0.2.14,<0.3",
    # protobuf 는 전이 의존이지만 CVE 수정본(6.33.6 이상) 아래로 내려가지 않게 하한을 직접 선언한다.
    "protobuf>=6.33.6,<8",
    # 스테이지 큐(Temporal activity) 워커용 SDK. 워커 코드(stage_worker)는 배포본과 함께 런타임에
    # 들어오고 docling wheel 은 --no-deps 로 설치되므로, SDK 는 base 이미지에 미리 있어야 한다.
    # protobuf<8 을 요구해 위 protobuf 범위와 맞는다. CPU·GPU 이미지 모두 같은 목록으로 설치된다.
    "temporalio==1.34.0",
    "grpcio",
    "grpcio-tools",
    "hatchling>=1.27.0",
    "audioop-lts; python_version >= '3.13'",
]

[tool.uv]
# lock 최신화 때 opencv 가 5.0 메이저로 올라가지 않게 막는다. 4.x 에서만 동작을 확인했다
# (cv2 를 쓰는 unstructured_inference, easyocr 경로).
constraint-dependencies = ["opencv-python-headless<5", "opencv-python<5"]
