# ─────────────────────────────────────────────────────────────────────────
#  v2 스키마로 자동 변환된 설정입니다.
#
#  자동 변환은 **값만** 옮깁니다. 아래는 원본 v1 의 주석 전문이며, 필요한 설명을 각
#  필드 스펙 옆으로 손수 옮긴 뒤 이 블록을 지우세요. 주석이 사라지면 왜 그런 설정인지
#  아는 사람이 없어집니다.
# ─────────────────────────────────────────────────────────────────────────
# FAQ JSON 레코드 → TB_FAQ 목표필드 직접 매핑 (모니모)
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: faq
#       extractor: json_mapping
#       config_file: custom_field_faq_json.yaml   # resource_path 자동 = 이 yaml 파일 디렉토리
#
# custom_field_faq.yaml(엑셀 행 매핑)의 JSON 대응판이다. 원천 확장자가 "미정"이라 두 형태를
# 같은 doc_type=faq 로 함께 받는다 — 파서가 확장자로 분기하므로 충돌하지 않는다.
#
# 입력 예시(모니모 FAQ, 공통_FAQ 시트의 "받은 문서 구조"):
#   {"faqMenuList": [
#      {"depth1": "더보기", "depth2": "FAQ", "depth3": "앱 이용",
#       "depth4": "설정한 홈 화면을 변경하고 싶어요.",
#       "id": "ca01_1", "app_route": "더보기>고객센터>앱 이용",
#       "url": "/fcm/common/faq/ca01/1492147_1415.json",
#       "description": "세 가지의 홈 유형 중 …", "corp_code": "HPP", "logo": "IFP"}
#   ]}
# ── 레코드 배열이 담긴 key. 키 이름만 쓴다(임의 깊이 재귀 매칭) ──────────────
# ── 목표필드: [허용 소스 key 별칭 목록] ─────────────────────────────────────
# 값은 레코드 안 임의 깊이에서 찾되 얕은 쪽이 우선한다.
# ── 소스와 무관하게 고정으로 채울 값 ────────────────────────────────────────
  # 앱 딥링크: 레코드의 url 은 데이터 경로(/fcm/...json), app_route 는 메뉴 경로라
  # 둘 다 앱 딥링크가 아니다. 어느 값을 쓸지 원천 담당 확인 후 key_map 에 추가할 것.
    # <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
# ── [선택] 청크 본문에 함께 실을 항목명 ─────────────────────────────────────
# 본문 필드를 `항목명: 값` 으로 낸다. 여기 이름이 없는 필드는 값만 나간다.
# 사람이 검색어로 쓰는 말을 적는다 — 목표필드명(DB 컬럼명)이나 원천 key 는 검색어에 안 나온다.
# 값에 줄바꿈이 있는 블록(상세 본문 등)에는 붙지 않는다. 그 블록은 이미 자기 제목을 갖는다.
# ── 레코드 본문이 chunk_size 를 넘으면 여러 청크로 나눈다(metadata 는 조각마다 동일) ──
# ── records 키를 찾지 못했을 때: error(기본, 즉시 실패) | skip(경고 후 0건) ──

schema: v2
source:
  kind: records
  records_at: faqMenuList
  on_missing: error
fields:
  BIZ_ID:
    alias: [id, 아이디]
    default: null
  GROUP_C:
    alias: [corp_code, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  FAQ_CTGR_NM:
    alias: [depth3, 분류, 카테고리]
    default: null
  QUESTION:
    alias: [depth4, 대표질문, 질문]
  ANSWER:
    alias: [description, 답변]
  STATUS:
    const: PUBLISHED
  DEEP_LINK_URL:
    default: null
  EFFECTIVE_FROM:
    default: null
  EFFECTIVE_TO:
    default: null
require:
  fields: [GROUP_C, QUESTION, ANSWER]
body:
  fields: [QUESTION, ANSWER]
  labels:
    QUESTION: 질문
    ANSWER: 답변
  split: true
  repeat: [QUESTION]
llm:
- out: [QUESTION_VARIANTS]
  in: [QUESTION, ANSWER]
  concurrency: 4
  on_error: null
  parser:
    type: json
  endpoint:
    url: http://llmops-gateway-api-service:8080/rep/serving/<ENRICHMENT_SERVING_ID>/v1/chat/completions
    api_key: ''
    model: model
  params:
    max_tokens: 800
    temperature: 0.0
    timeout: 60
  prompt:
    system: |
      너는 고객센터 FAQ 검색 품질 담당자다. 대표질문을 이용자가 실제로 물어볼 법한 표현으로 바꿔 쓴다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 `QUESTION_VARIANTS` 하나다. 값은 문자열 배열이다.
      - 같은 답변으로 해결되는 질문만 넣는다. 답변 범위를 벗어나는 질문은 넣지 않는다.
      - 구어체·준말·오탈자에 가까운 실제 검색 표현을 섞는다.
      - 대표질문을 그대로 복사하지 않는다.
      - 3~6개로 제한한다. 마땅한 변형이 없으면 빈 배열 [] 을 반환한다.

      출력 예시 형식(값은 예시):
      {"QUESTION_VARIANTS": ["카드 한도 올리려면?", "이용한도 상향 신청 방법"]}
    user: |
      아래 FAQ 의 유사질문을 정리하라.

      - QUESTION_VARIANTS (유사질문 배열)

      반드시 `QUESTION_VARIANTS` 키 하나를 가진 JSON 객체로만 반환하라.

      <faq>
      {{raw_text}}
      </faq>
