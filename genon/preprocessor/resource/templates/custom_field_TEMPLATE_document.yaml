# ═══════════════════════════════════════════════════════════════════════════
#  템플릿 — 문서 단위 LLM 추출 (source.kind: document)
#
#  언제 쓰나 : 원천이 **문서**(pdf/docx/hwp/html/md/pptx/xlsx)이고, 그 문서 하나에서
#              필드 몇 개를 뽑고 싶을 때 (상품설명서의 상품명·상품코드, 카드 혜택 요약 …)
#  결과      : 문서 metadata → 그 문서에서 나온 **모든 청크에 같은 값**이 붙는다.
#              (행/레코드마다 다른 값이 필요하면 rows/records 템플릿을 쓴다)
#  LLM 호출  : 문서당 1회. (값을 LLM 이 아니라 고객 파이썬 함수로 만들려면 맨 아래
#              `python:` 블록을 쓴다 — 연결·프롬프트가 필요 없다)
#
#  ── 5종 중 어느 템플릿인가 ───────────────────────────────────────────────
#   rows     · 엑셀/CSV 한 행 = 검색 1건           custom_field_TEMPLATE_rows.yaml
#   records  · JSON 배열 한 요소 = 검색 1건        custom_field_TEMPLATE_records.yaml
#   sections · 대상 하나를 깊게 설명한 중첩 JSON   custom_field_TEMPLATE_sections.yaml
#   document · 문서 1건에서 필드 몇 개를 LLM 으로  custom_field_TEMPLATE_document.yaml  ← 이 파일
#   html     · 마크업이 값을 이미 지목한 HTML      custom_field_TEMPLATE_html.yaml
#   더 자세한 비교는 facade/gitbook_doc/parser_processor.md 의 "extractor 5종" 표.
#
#  ── 쓰는 순서 ────────────────────────────────────────────────────────────
#  ① 이 파일을 resource/custom_field_<유형>.yaml 로 복사한다.
#  ② <...> 로 표시된 곳을 채운다.
#  ③ resource/parser_processor_config.yaml 의 enrichment 목록에 아래를 추가한다.
#        - custom_fields:
#            enable: true
#            doc_type: <유형>
#            # extractor 는 적지 않는다 — 설정 파일의 `source.kind: document` 에서
#            #   정해진다(맨 아래 `python:` 블록을 쓰면 자동으로 `python` 이 된다).
#            #   굳이 적겠다면 그 값과 같아야 한다. 어긋나면 기동이 실패하고, 메시지에는
#            #   설정에 적은 적 없는 내부 키 이름이 나와 원인을 짚기 어렵다.
#            config_file: custom_field_<유형>.yaml   # 파일명만. 이 yaml 과 같은 폴더 기준
#  ④ 확인한다(아래 "확인 방법" 참고).
#
#  이 파일 하나로 자족한다 — 프롬프트를 여기 인라인하면 별도 md 파일이 필요 없다.
#    프롬프트가 아주 길거나 여러 유형이 공유하면 `prompt.system_file` / `prompt.user_file` 로
#    별도 md 로 빼도 된다 — 파일 지정이 인라인보다 우선한다.
#
#  이 템플릿은 참고용이므로 parser_processor_config.yaml 에 등록하지 않는다.
#     <...> 가 남은 상태로 등록하면 프롬프트가 문서와 맞지 않아 값이 비어서 나온다.
# ═══════════════════════════════════════════════════════════════════════════

schema: v2

# ── [필수] 레코드 소스 ──────────────────────────────────────────────────────
source:
  kind: document

  # ── [선택] 원천 포맷 전처리 (md / html / json) ────────────────────────────
  # docling 파싱 **전에** 원문을 손보는 규칙이다. 아래 `markdown`·`html`·`json` 세 블록은
  # 문서 단위(kind: document)에서만 소비된다 — rows/records/sections 설정에 적으면
  # 기동은 통과하고 **조용히 무시된다**(그 kind 의 파서가 읽지 않는다).
  # `pre` 아래 나머지 하나인 `delimited` 는 반대로 kind: records 전용이다(구분자 텍스트
  # 원천. custom_field_TEMPLATE_records.yaml 의 같은 이름 블록 참고).
  # 이 전처리는 **parser 경로에서만** 소비된다 — 적재용(intelligent)/변환용(convert) 은 원천을
  # PDF 로 바꿔 읽어 걸릴 자리가 없고, 등록하면 기동 시 경고가 남는다.
  # 세 블록은 같은 일을 한다 — 원천을 docling 이 읽을 문서 한 벌로 만든다.
  # `markdown`·`html` 두 블록은 이 파일이 기본값이고, 등록 블록에 같은 이름을 적으면
  # 그쪽이 덮어쓰며, `markdown: false` 처럼 false 를 주면 명시적 비활성이다.
  # `json` 은 **이 파일에만** 적는다 — 등록 블록에 적던 옛 표기는 받지 않는다.
  # marker_headings 는 md 와 html 이 판정 규칙을 공유한다 — 같은 원문이 포맷에 따라
  # 다르게 쪼개지지 않게 하기 위해서다. 그래서 `pre` 바로 아래 **한 번만** 적으면 둘 다
  # 적용된다(블록 안에 다시 적으면 그쪽이 이긴다).
  #
  # 왜 필요한가(실측):
  #   · text_fence 없이 두면 docling 이 ```text 펜스 전체를 CodeItem 1개로 만들어 4,654자가
  #     아이템 하나가 되고 chunk_size 가 무의미해진다. `|` 한 줄이 md 표 모드를 열어 뒤따르는
  #     본문 1,586자를 빈 표로 삼키기도 한다.
  #   · marker_headings 없이 두면 h태그·`#` 없이 도형 마커(◈ ▣ ■)로만 계층을 표현한 문서가
  #     통째로 한 섹션이 되어 청킹 경계가 생기지 않는다.
  # pre:
  #   marker_headings: true             # `◈ 기본내용` 같은 마커 줄을 heading 으로 승격.
  #                                     # md·html 양쪽에 걸린다(위 설명 참고)
  #   markdown:
  #     front_matter:                   # 선두 YAML front matter 를 본문에서 분리
  #       # 어느 front matter 키에서 값을 가져올지는 아래 `fields.<목표>.alias` 에 적는다.
  #       # 여기 남는 것은 "본문에 남길까" 같은 텍스트 정책뿐이다.
  #       exclude_text_fields: ["*"]    # "*" = front matter 전체를 검색 본문에서 제외
  #       on_missing: ignore            # ignore(기본) | warn | error
  #       on_invalid: ignore            # ignore(기본) | warn | error
  #       max_bytes: 65536              # front matter 로 읽을 선두 바이트 상한
  #     text_fence:                     # ```text 펜스를 단락으로 되돌린다
  #       enable: true                  # `text_fence: true` 로 줄여 써도 된다
  #       langs: ["", "text"]           # 대상 펜스 정보문자열(진짜 코드 펜스는 건드리지 않음)
  #       min_hangul_ratio: 0.3         # 본문 한글 비율 하한(코드 블록 오변환 방지)
  #     # 이 블록 안에 marker_headings 를 다시 적으면 md 에만 그 값이 쓰인다
  #     #   (한쪽만 끄고 싶을 때만. 보통은 위에 한 번 적는 것으로 끝난다)
  #   json:                             # 원천이 .json 인데 **본문이 그 안의 값**으로 올 때
  #     # 본문(markdown/html 문자열)이 담긴 원천 key 이름들. 경로가 아니라 **이름만** 적고
  #     # 임의 깊이에서 문서 순서대로 모으므로 `pages[*].html` 같은 배열도 그대로 처리된다.
  #     # 항목이 여러 개면 항목별 <h2> 섹션을 가진 단일 문서로 병합해 docling 을 1회 부른다.
  #     # 이 블록이 없으면 .json 은 원문 그대로 docling 을 탄다(표·heading 구조가 남지 않는다).
  #     body_from: [<본문_KEY>, <요약_KEY>]   # [필수]
  #     format: auto                    # auto(기본, 값 내용으로 판별) | html | markdown
  #     on_missing: skip                # skip(기본, 경고만) | error
  #     # 같은 doc_type 에 records/sections 설정이 함께 있으면 그쪽이 먼저 선택된다
  #     #   (레코드·섹션마다 청크를 만드는 편이 문서 1건으로 합치는 것보다 구체적이다).

# ── [선택] 필드 선언 ────────────────────────────────────────────────────────
# 이 kind 의 원천은 둘이다 — LLM 응답과 **markdown front matter**.
# 한 필드의 규칙(어디서 오나 / 어떻게 접나 / 뭐라고 부르나)을 전부 여기 한 자리에 적는다.
#
# 쓸 수 있는 키 — rows/records 와 같되 `collect`·`seq`·`raw` 는 못 쓴다(적으면 기동 실패).
#   collect : records 전용. 오류 메시지도 `collect` 라고 나온다.
#   seq     : 레코드 루프가 있는 rows/records 전용(문서형은 항상 1건이라 "N번째"가 없다).
#   raw     : "객체를 구조로 볼지 값으로 볼지" 판정이 있는 JSON 원천 2종 전용.
#   뒤의 둘은 오류 메시지가 **내부 이름**(`sequence`·`raw_fields`)으로 나온다 — 설정에
#   적은 이름과 다르니, 못 보던 이름이 나오면 이 대응표에서 되짚는다.
#   alias     : 값이 들어 있는 **front matter 키 이름들**. 먼저 찾은 것을 쓴다.
#   const     : 원천과 무관하게 항상 같은 값. LLM 이 다른 값을 내놔도 이긴다.
#   default   : LLM 도 front matter 도 값을 못 준 자리만 채운다.
#   values    : 코드값·표기 흔들림을 표준값으로 접는다 (`SALE: ["1", Y, 판매중]`)
#               별칭에 영문 `yes`/`no`/`on`/`off` 를 쓸 때는 **따옴표로 감싼다** — YAML 이
#               참/거짓으로 바꿔 버려 원천의 "yes" 와 영영 안 맞는다(`Y`/`N` 은 그대로다)
#   transform : 값 변환 체인 (`date_int_flex`, `[{name: regex_sub, pattern: ...}]`)
#               적재 DB 의 JSON 컬럼에 넣을 필드는 `[{name: to_json}]` 을 맨 뒤에 건다
#   template  : 다른 필드를 합쳐 만든다 (`"{{BRAND_NM}} {{PRODUCT_NM}}"`)
#   pack      : 여러 필드를 JSON 한 칸에 담는다 (`[BRAND_NM, ANNUAL_FEE]` →
#               `{"BRAND_NM": ..., "ANNUAL_FEE": ...}` 문자열). 값이 없는 키도 null 로
#               남고 원천 필드는 그대로 남는다. 본문 관련 키에는 쓸 수 없다
#   meta      : 이 필드를 청크 메타(적재 컬럼)에 실을지. 안 적으면 실린다(기본 true).
#               template·pack 재료나 require·filter 조건처럼 값 조립에만 쓰는 중간
#               필드에 `meta: false` 를 적어 컬럼에서 뺀다. 값은 그대로 만들어지므로
#               본문(body)·파생·선별은 정상으로 돌고, 빠지는 곳은 청크 메타 하나다
#
# fields:
#   <GROUP_C>:     {const: "<고정값>"}
#   <BIZ_ID>:      {default: null}
#   # front matter 에서 가져오기 — 예전 `front_matter.metadata_fields` 자리가 여기로 왔다.
#   created_date:  {alias: [created_at], transform: date_int_flex}
#   <PRODUCT_C>:   {alias: [product_code, prod_cd]}
#   <SALE_STATUS>: {alias: [sale_state], values: {SALE: ["1"], STOP: ["0"]}}
#   <DISPLAY_NM>:  {template: "{{<BRAND_NM>}} {{<PRODUCT_NM>}}"}

# ── [참고] 값 적용 순서 ──────────────────────────────────────────────────────
# 필드 하나가 확정되기까지 이 순서로 처리된다:
#   default < LLM < front matter < const  →  values → transform → template → pack
# 값 파이프라인은 이 병합이 끝난 뒤에 도는 후처리라, LLM 이 준 값도 const 로 못 박은 값도
# 똑같이 지나간다. 순서는 rows/records/sections 와 같다.
# `const` 는 LLM 응답보다 우선한다 — 고정값이라고 선언한 이상 모델이 뭘 내놓든 그 값이고,
# front matter 로 온 구조화 원천값보다도 우선한다.

# ── [선택] 청크 본문 관련 규칙 ──────────────────────────────────────────────
# 값이 아니라 규칙이다. 프롬프트·`llm.out` 에 넣지 않는다.
# 파서가 문서 metadata 로 실어 보내고 청커가 소비한다.
#
#   mirror_to : 그 청크의 본문(text)과 글자 그대로 같은 값을 받는 필드
#               (소비계층의 검색 대상 본문 컬럼용)
#   repeat    : 모든 청크 본문 앞에 반복해 얹을 필드
#               (매 청크가 단독으로 검색돼야 하는 식별자 — 상품명 등)
#   once      : 문서의 첫 청크에만 1회 얹을 필드
#               (매 청크에 반복하기엔 chunk_size 가 아까운 문서 단위 분류·작성일 등)
#   labels    : 위 두 규칙으로 얹는 값 앞에 붙일 사람이 읽는 항목명(`항목명: 값`).
#               목표필드명(예: QUESTION)은 적재 DB 컬럼명이라 그대로 노출하면 임베딩에
#               안 쓰는 토큰이 섞이므로, 이름이 있는 필드만 라벨을 붙이고 없으면 값만 낸다.
#
# repeat/once 는 접두만큼 chunk_size 를 깎으므로 짧은 필드 1~2개로 제한한다. 값이 비었거나
# 중첩 객체인 필드는 조용히 건너뛴다. once 만 쓴 값은 임베딩 검색에서 첫 청크만 걸린다
# (값 자체는 모든 청크의 metadata 에 실리므로 필터 검색은 전 청크에서 된다).
# body:
#   mirror_to: [<BODY_COLUMN>]
#   repeat:    [<IDENTIFIER_FIELD>]
#   once:      [<CATEGORY_FIELD>]
#   labels:
#     <IDENTIFIER_FIELD>: <사람이 읽는 이름>

# ── [필수] LLM 추출 ─────────────────────────────────────────────────────────
# 호출 단위는 `source.kind` 가 정한다 — `scope` 를 적지 않는다(document = 문서 1회).
# 이 kind 에는 `in` 을 적지 않는다(적으면 기동 실패) — 입력이 문서 본문 하나로 정해져
#    있기 때문이다. rows/records/sections 에서는 반대로 `in` 이 **필수**다.
#
# out 의 이름이 프롬프트가 요구하는 JSON 키와 **정확히 같아야** 한다.
#    어긋나면 **에러 없이 값이 null** 로 채워진다. 이게 가장 흔한 실수다.
# user 프롬프트의 `{{raw_text}}` 가 문서 본문으로 치환된다 — 반드시 넣어야 한다.
#    빠뜨리면 본문이 전달되지 않고 프롬프트만 전송된다.
#    예약 변수(값 자동 채움): raw_text, full_text, filename, mimetype, page_count,
#    table_count, picture_count, section_headers. (before_context/after_context/caption/
#    section_header 도 이름은 허용되지만 이미지 단위 enrichment 전용이라 여기서는 항상 빈 값)
#    추가로 `prompt.variables` 에 정의한 사용자 변수도 `{{이름}}` 으로 쓸 수 있다.
#    정의되지 않은 `{{변수}}` 를 쓰면 기동 시 실패한다 — strict 가 기본(`prompt.mode` 로 완화).
# system 을 생략하면 built-in default("문서 정보추출 전문가다 …")가 쓰인다.
# 적재 DB 컬럼명(대문자)으로 쓰면 적재 매핑이 1:1 이 된다.
llm:
- out: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]

  # ── 입력 페이지 범위 ─────────────────────────────────────────────────────
  # 미지정(또는 null) → 문서 전체를 대상으로 한다.
  # 앞쪽 몇 페이지만 보면 충분한 경우에만 지정한다(입력 토큰 절약).
  pages: null

  # ── 응답 파서 ────────────────────────────────────────────────────────────
  # json(기본) = 응답에서 JSON 객체를 찾아 dict 로 만든다(코드펜스·앞뒤 설명 문구를 견딘다).
  # 외부 파이썬 함수로 위임할 수도 있다:
  #   parser: {type: python, file: custom_field_<유형>.py, callable: parse}
  parser:
    type: json

  # ── LLM 연결 ─────────────────────────────────────────────────────────────
  # 접속 정보는 프로세서 설정 최상위 model_presets 에 모아 두고 여기서는 이름만 부른다.
  # 이 항목만 다른 모델을 쓰려면 url/api_key/model 을 직접 적는다(직접 적은 값이 이긴다).
  # url 또는 model 이 비어 있으면 실행 시 경고를 남기고 이 enricher 를 건너뛴다.
  endpoint:
    model_preset: default

  # ── 생성 파라미터 ────────────────────────────────────────────────────────
  # 생략 시 기본값: max_tokens 1000 / temperature 0.0 / timeout 60
  # 문서 전체를 넣으면 입력이 길어지므로 max_tokens·timeout 을 넉넉히 잡는 편이 좋다.
  # thinking / thinking_dialect 도 여기 쓴다(등록 블록이 우선, 없으면 이 값).
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300

  prompt:
    # system_file / user_file 로 프롬프트를 별도 md 로 뺄 수도 있다(이 yaml 과 같은 폴더 기준).
    # 지정하면 인라인보다 우선한다. variables 로 사용자 변수를, mode 로 strict/lenient 를 정한다.
    # variables: {<MY_VAR>: "<값>"}
    # mode: strict
    system: |
      너는 <문서 종류> 정보추출 전문가다. 주어진 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 키는 아래 필드명을 그대로 쓴다.
      - 원문에 없는 정보를 지어내지 않는다(환각 금지). 없으면 값을 null 로 둔다.
      - `<TARGET_FIELD_1>`: <무엇을, 어디서, 어떤 형태로 뽑을지>
      - `<TARGET_FIELD_2>`: <무엇을, 어디서, 어떤 형태로 뽑을지>

      출력 예시 형식(값은 예시):
      {"<TARGET_FIELD_1>": "<예시 값>", "<TARGET_FIELD_2>": "<예시 값>"}
    user: |
      아래 문서에서 다음 필드를 추출하라.

      - <TARGET_FIELD_1> (<설명>)
      - <TARGET_FIELD_2> (<설명>)

      반드시 위 키를 모두 가진 하나의 JSON 객체로만 반환하라.

      <document>
      {{raw_text}}
      </document>

# ── [선택] 값을 LLM 이 아니라 고객 파이썬 함수로 만든다 ──────────────────────
# 위 `llm` 블록 **대신** 쓴다(둘을 함께 쓰면 기동 시 실패한다 — 값을 만드는 주체는 하나다).
# 등록 블록에서 `extractor` 를 생략했다면 이 블록만 쓰면 된다 — 그 값이 `python` 으로
# 유도된다. 등록 블록에 `extractor: llm` 을 **적어 둔 경우에만** `python` 으로 바꿔야
# 하고, 안 바꾸면 `extractor 'llm' 이 읽지 않는 키: file, callable` 로 기동이 실패한다
# (설정에 적은 이름은 `python.file` 인데 메시지에는 `file` 만 나온다).
# 파일명·수집일자 같은 패턴에서 규칙으로 뽑아낼 수 있는 값은 모델에 맡길 이유가 없다.
# 만들어진 값은 위 `fields` 의 값 파이프라인(values·transform·template·pack)을 그대로 탄다.
# kind: document 전용이다.
# python:
#   file: custom_field_<유형>.py    # 이 yaml 과 같은 폴더 기준
#   callable: extract               # 생략 시 기본 진입점 이름을 쓴다
#   out: [<TARGET_FIELD_1>, <TARGET_FIELD_2>]   # 그 함수가 돌려주는 dict 의 키

# ── [선택] 표 설명(table_text_description)을 이 문서유형에서만 바꾼다 ────────
# 프로세서 config 의 공통 `table_text_description` 값이 기본이며, 아래처럼 필요한 키만 쓰면
# 이 문서유형에서만 덮어쓴다(rag 하위도 키 단위 병합). model/max_tokens/thinking 은 표 설명도
# 이 custom_fields 호출의 값을 그대로 공유한다(별도 호출·별도 모델 없음).
# **최상위 키**이며 kind 와 무관하다 — rows/records/sections 설정에도 똑같이 쓸 수 있다.
# table_text_description:
#   prompt_template_file: prompt_table_text_description_rag.md
#   input_format: auto
#   before_items: 4
#   after_items: 3
#   rag:
#     key_fact_limit: 5
#     include_search_terms: true

# ═══════════════════════════════════════════════════════════════════════════
#  기동 시 자동 검사 — 무엇을 잡아주고 무엇을 못 잡나
#
#  실패시킨다(요청 전에 바로 안다)
#   · **이 kind 가 읽지 않는 키를 적은 경우.** 어느 스키마에도 없는 키(오타)는 가장 가까운
#     이름을 제안하고(`out` 을 `outs` 로 쓴 경우 등), 다른 kind 의 키는 어디 전용인지 알려준다.
#     document 가 **읽지 않는** 대표 키는 아래와 같다(다른 템플릿에서 옮겨 적으면 안 된다).
#       require · filter · body.fields · body.split
#       source.records_at · source.merge_rows
#       llm 항목의 in
#   · 필드 스펙에 `collect`·`seq`·`raw` 를 쓴 경우 — 각각 records · rows/records ·
#     JSON 원천 2종 전용이다(나머지 스펙은 이 kind 도 그대로 쓴다).
#     `seq`·`raw` 는 내부 이름 `sequence`·`raw_fields` 로 보고된다
#   · `transform` 의 변환기 이름이 틀렸거나 필수 인자가 빠진 경우, 안 되는 정규식
#   · `template` 이 아무도 만들지 않는 필드를 참조하는 경우
#   · 정의되지 않은 `{{변수}}` 를 프롬프트에 쓴 경우(strict 기본)
#   · `llm` 과 `python` 을 함께 쓴 경우, 또는 `python.file` 을 빠뜨린 경우
#
#  경고만 남긴다(로그를 봐야 안다)
#   · `alias` 의 front matter 키를 원천에서 못 찾을 때 — 그 필드가 빈 값으로 지나간다
#   · `values` 에 없는 값이 들어올 때 — 원값을 그대로 두고 경고만 남긴다
#
#  못 잡는다(아래 "확인 방법"으로 직접 봐야 한다)
#   · `out` 이름과 프롬프트의 JSON 키가 어긋나 값이 전부 null 이 되는 경우
#   · `prompt`·`parser` 같은 **중첩 블록 안쪽**의 오타(최상위 키만 검사한다)
#   · `source.pre.delimited` 를 이 kind 에 적은 경우 — records 전용이라 조용히 무시된다
#
#  오류 메시지는 설정에 적는 이름이 아니라 **내부 이름**으로 나온다
#   (`body.repeat`→`chunk_prefix_fields`, `body.once`→`first_chunk_fields`,
#    `values`→`value_map`, `require.fields`→`required`, `transform`→`transforms` …).
#   못 보던 이름이 나오면 facade/gitbook_doc/parser_processor.md 의 매트릭스에서 되짚는다.
#
# ═══════════════════════════════════════════════════════════════════════════
#  확인 방법
#
#  1) 설정만 검사 — 파싱·LLM 없이 yaml 만 읽는다.
#       genon/preprocessor/examples/config_precheck/precheck_custom_fields.sh
#
#  2) 프롬프트·출력필드가 제대로 실렸는지 검사한다(LLM 호출 없음).
#     실행 위치: genon/preprocessor  (그 폴더의 .venv 로 돌린다)
#       .venv/bin/python -c "
#     import sys; sys.path.insert(0,'.'); sys.path.insert(0,'../..')
#     from processing.enrichment.custom_fields_enricher import CustomFieldsEnricher as E
#     e = E(config_file='custom_field_<유형>.yaml', resource_path='resource')
#     print('연결 설정 :', e.is_configured, e._model, e._max_tokens, e._timeout)
#     print('출력 필드 :', e._output_fields)
#     print('{{raw_text}} 포함:', '{{raw_text}}' in e._user_prompt)
#     missing = [f for f in e._output_fields
#                if f not in e._system_prompt and f not in (e._constants or {})]
#     print('프롬프트에 없는 출력필드:', missing or '없음')
#     "
#     → `프롬프트에 없는 출력필드` 가 비어 있어야 한다. 남아 있으면 그 필드는 null 로 나온다.
#
#  3) 등록된 사례 자동 검증 — 파싱·청킹까지 실행해 필드와 결과를 확인한다.
#     신규 유형은 examples/parse_chunk/parse_chunk_verify.py 의 CASES 에
#     (doc_type, 샘플 경로, 설명)을 추가하고 resource_dev/parser_processor_config.yaml 에
#     해당 유형의 설정을 등록한다. --only 는 등록된 CASES 를 고르는 옵션이다.
#     미등록 유형·검사 대상 0건·실행 결과 전부 SKIP 은 실패로 종료된다.
#     PASS 건수와 SKIP 사유를 확인하고, 새 필드의 기대값 검증은 verify() 에 추가한다.
#       genon/preprocessor/examples/parse_chunk/parse_chunk_verify.sh --only <유형>
#
#  ── 알려진 주의사항 (현재 코드) ─────────────────────────────────────────────
#  · `params.max_tokens: 1000` / `temperature: 0.0` / `timeout: 60` 처럼 **기본값과 같은 값**을
#    등록 블록에 써도 이제는 등록 블록이 이긴다(예전에는 "미지정"과 구분되지 않아 이 파일의
#    값이 이겼다).
#  · `const` 가 LLM 응답을 이기는 규칙은 위 "[참고] 값 적용 순서" 에 적혀 있다.
# ═══════════════════════════════════════════════════════════════════════════
