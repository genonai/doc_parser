# 문서 유형 faq(자주 묻는 질문)의 custom_fields 설정 — JSON 의 faqMenuList 배열에서 원소 하나를 FAQ 한 건으로 읽는다.
# custom_fields 는 doc_type 마다 원본에서 뽑을 필드와 그 규칙이다. 이 파일은 core 의 CustomFieldsEnricher 가 읽는다.
# fields 아래 키는 만들어 낼 필드 이름이고, 대부분 적재 테이블(GADAQTBFDP001)의 컬럼 이름과 같다.
# BIZ_ID 는 원본이 준 항목 ID, GROUP_C 는 계열사 코드다(IFP 모니모·SLF 생명·SSF 화재·HPP 카드·SSS 증권).
#
# faqMenuList 원소의 key: id | logo | depth3 | depth4 | description

schema: v2
source:
  kind: records
  on_missing: error
  records_at: faqMenuList
fields:
  BIZ_ID:
    alias: [id, 아이디]
    default: null
  GROUP_C:
    alias: [logo, 회사, corp_code, 회사명, 고객사]
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  FAQ_CTGR_NM:
    alias: [분류, depth3, 카테고리, FAQ분류]
    default: null
  QUESTION:
    alias: [질문, depth4, 대표질문]
  ANSWER:
    alias: [답변, description, 답변내용]
  SRC_LAST_MOD_DT:
    alias: [최종수정일]
    transform: date_int
  DEEP_LINK_URL:
    default: null
# 이 필드가 빈 레코드는 건너뛴다
require:
  fields: [QUESTION, ANSWER]
# 검색용 chunk 본문을 만드는 규칙. fields 를 순서대로 `라벨: 값` 줄로 잇고(labels), split 이면
# chunk_size 를 넘는 본문을 여러 chunk 로 나누며, repeat 의 필드는 나뉜 chunk 마다 앞에 다시 붙인다
body:
  fields: [QUESTION, ANSWER]
  split: true
  labels:
    QUESTION: 질문
    ANSWER: 답변
  repeat: [QUESTION]
