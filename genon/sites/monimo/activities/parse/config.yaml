output:
  # 파싱 결과 형식. json(기본)=요소 목록 | html·markdown=본문 문자열 하나
  # | docling=다시 불러올 수 있는 docling 문서 그대로(청킹 단계의 입력용)
  format: "docling"
  # 민감정보 분류: parser 가 guardrail(민감정보 분류 서버)을 불러 sensitive_infos 를 출력에 실어 보내고,
  # 청킹 단계가 그 결과로 chunk 마다 라벨을 붙이거나 가린다(아래 guardrail 섹션 참고).

  # ── 표를 글로 쓰는 형식 ────────────────────────────────────────────────────
  # 아래 두 키는 파서가 표를 직접 문자열로 낼 때 쓰인다.
  #   1) format 이 json/html/markdown 일 때의 파싱 출력
  #   2) custom_fields 레코드형 문서의 표. `to_text` 변환 결과(예: monimo_event 의
  #      DETAIL_HTML → DETAIL_TEXT)와, chunk 본문의 JSON·HTML 을 자동으로 평문으로 바꾼 결과가 모두 이 값을 따른다.
  #      레코드형 문서는 파서가 chunk 본문을 완성해 넘기고 청킹 단계는 표를 다시 그리지 않으므로,
  #      format: docling 이어도 이 값이 최종 chunk 의 표 모양이 된다.
  # format: docling 으로 청킹 단계(/chunker)에 넘기는 일반 문서(PDF·DOCX·HTML 등)의 표 모양은
  # activities/chunk/config.yaml 의 output 이 정한다. 최종 chunk 의 표 모양을 통일하려면
  # 두 설정의 table_format 을 같은 값으로 맞춘다(precheck_custom_fields.sh 가 다르면 경고한다).
  # 레코드형 문서의 표 모양이 바뀌면 hash 로 만든 식별자(예: cs_ssf 의 BIZ_ID — 업무 데이터 한 건의 ID)도 바뀐다.
  # markdown 은 병합 셀을 표현하지 못해 헤더 계층이 사라진다.

  # 표를 글로 낼 때의 형식(문서유형 레코드의 표 등). html(기본) | markdown
  # | auto(병합 셀·여러 줄 헤더가 있는 표는 html, 단순한 표는 markdown). 일반 문서의 docling 출력에는 영향 없음
  table_format: "markdown"
  compact_tables: true # markdown 표의 칸 맞춤 공백을 없애 크기를 줄일지. true(기본) | false. html 에는 영향 없음
  # 표 뒤에 붙는 "컬럼=값 | 컬럼=값" 행 문장(table_row_serialization)은 청킹 단계 전용이라 여기에 없다 —
  # activities/chunk/config.yaml 의 output 에서 켠다.

# whisper(음성 받아쓰기) 설정. 음성(.wav/.mp3/.m4a)을 처리할 때만 필요하다(선택).
# 음성은 chunk_sec 초 단위로 잘라 동시에 받아쓰기를 요청하고, 결과를 이어 붙인다.
# 아래 model~timestamp_granularities 는 받아쓰기 서버에 그대로 보내는 값이다.
# 현재 파싱 액티비티(activities/parse/processor.py)의 ROUTES 에는 음성 경로가 없어 이 설정이 쓰이지 않는다.
whisper:
  # 음성 받아쓰기(STT) 서버의 모델 프리셋 이름(model_presets.yaml 의 키)
  model_preset: whisper
  # 받아쓰기 서버에서 쓸 모델 이름. 기본 "model"
  model: "model"
  # 음성의 언어 코드. 기본 "ko"
  language: "ko"
  # 받아쓰기 응답 형식. 기본 "json". 결과의 text 를 읽으므로 json 으로 둔다
  response_format: "json"
  # 받아쓰기 생성 무작위성. "0"(기본)=같은 음성에 같은 결과
  temperature: "0"
  # 스트리밍 응답을 받을지. "false"(기본)로 둔다
  stream: "false"
  # 받아쓰기 결과에 붙일 시간 정보 단위. 기본 "word"(단어 단위)
  timestamp_granularities: "word"
  # 음성을 몇 초 단위로 잘라 보낼지. 기본 29. 줄이면 요청 수가 늘어난다
  chunk_sec: 29
  # 잘린 조각끼리 겹칠 길이(ms). 기본 300. 경계에서 말이 끊기는 것을 줄인다
  chunk_overlap_ms: 300

guardrail:
  # 민감정보 분류 — parser 가 호출한다. 요청 파라미터 guardrail_call 이 1 이면 문서 전체를 한 번
  # 분류해 sensitive_infos 를 파싱 결과에 실어 청킹 단계로 넘긴다(chunk 라벨 붙이기·가리기는 청킹 단계가 한다).

  # 민감정보 분류 서버의 모델 프리셋 이름(model_presets.yaml 의 키). 접속 정보가 비면 분류를 건너뛴다
  model_preset: guardrail
  # 분류 호출 제한 시간(초). 기본 60. 넘기면 민감정보 없이 계속한다. 큰 문서는 늘린다
  timeout: 60
