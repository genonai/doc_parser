# 상품설명서(생명) 문서 단위 메타데이터 추출
#
# MD 표준안:
#   frontmatter(file / document_type / source_file / source_pages / author / created_at /
#               conversion_note)
#   → `# {상품명} 상품요약서`
#   → `## 핵심 키워드`
#   → `## 문서 개요`      (샘플에 따라 `## 목차` 로 오기도 한다 — 문서 개요로 통일 요청됨)
#   → `## 내용 색인`
#   → `원문 전사` / `원문 N쪽 - {소제목}`
#

schema: v2
source:
  kind: document
  pre:
    markdown:
      front_matter:
        exclude_text_fields: ['*']
        on_missing: warn
      text_fence:
        enable: true
        langs: ['', text]
        min_hangul_ratio: 0.3
fields:
  created_date:
    alias: [created_at]
    transform: date_int_flex
  # LLM 도 뽑지만 front matter 값이 우선(default < LLM < front matter < const).
  PRODUCT_C:
    alias: [product_code]
    default: null
  GROUP_C:
    const: SLF
  SALE_STATUS:
    const: SALE
  BIZ_ID:
    default: null
  PRODUCT_ATTRS:
    alias: [created_at]
    transform: [date_int_flex, {name: to_json, key: "created_at"}]
body:
  once: [created_date]
  labels:
    created_date: 출시일
llm:
- out: [PRODUCT_C, PRODUCT_NM, PRODUCT_ATTRS]
  parser:
    type: json
  endpoint:
    model_preset: default
  params:
    max_tokens: 4000
    temperature: 0.0
    timeout: 300
  prompt:
    system: |
      너는 보험 상품요약서 정보추출 전문가다. 주어진 상품요약서 문서에서 요청한 필드를 정확하게 추출한다.

      규칙:
      - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
      - 요청된 3개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
      - 문서에 없는 정보를 지어내지 않는다(환각 금지). 금액·기간·비율·나이는 원문 숫자를 그대로 쓴다.

      필드별 형식:
      - `PRODUCT_C`: 상품코드 문자열. frontmatter 나 본문에 상품코드/product_code가 있으면 그 값.
        없으면 null 로 둔다(상품명을 코드처럼 지어내지 않는다).
      - `PRODUCT_NM`: 상품명 문자열. 문서 제목(H1)의 상품명을 쓰되 "상품요약서" 같은 문서종류
        표기는 뺀다. 예: "# 삼성 s교통상해보험(2501)(무배당) 상품요약서" → "삼성 s교통상해보험(2501)(무배당)".
        반드시 채운다.
      - `PRODUCT_ATTRS`: 상품의 출시일. 본문에 created_at가 있는 날짜를 추출한다.

      출력 예시 형식(값은 예시):
      {"PRODUCT_C": "30387", "PRODUCT_NM": "삼성 s교통상해보험(2501)(무배당)", "PRODUCT_ATTRS": 20060305}
    user: |
      아래 보험 상품요약서에서 다음 3개 필드를 추출하라.

      - PRODUCT_C (상품코드) — 필수
      - PRODUCT_NM (상품명) — 필수
      - PRODUCT_ATTRS (출시일) — 필수

      반드시 위 3개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

      <document>
      {{raw_text}}
      </document>
