[project]
name = "doc-parser-preprocessor"
version = "1.3.0"
description = ""
authors = [{ name = "Seunghyun Nam", email = "seunghyun.nam@genon.ai" }]
requires-python = '>=3.11,<4.0'
dependencies = [
    "docling-core==2.85.0",
    "docling-ibm-models==3.10.3",
    "docling-parse==7.3.0",
    # python-multipart 0.0.22 의 취약점 5건(pip-audit): 수정본 중 가장 높은 0.0.31 로 상향.
    "python-multipart==0.0.31",
    "gunicorn==23.0.0",
    "uvicorn==0.21.1",
    # CVE-2026-25087: pyarrow 22.0.0 취약, 23.0.1 로 상향.
    "pyarrow==23.0.1",
    "starlette>=0.52.1",
    "aiofiles==24.1.0",
    # CVE-2026-69244: aiohttp 3.13.3 취약, 3.14.3 이상으로 상향. 상한은 다음 메이저 전.
    "aiohttp>=3.14.3,<4",
    "httpx>=0.27.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "unstructured==0.18.32",
    "python-pptx==1.0.2",
    "python-docx==1.1.2",
    "python-magic==0.4.27",
    "pyhwp==0.1b15",
    "markdown==3.8.2",
    "pydub==0.25.1",
    "weasyprint==68.1",
    "aiofile==3.9.0",
    "watchfiles==1.1.0",
    "pika==1.3.2",
    "chardet==5.2.0",
    # 저장소 코드가 직접 import 한다. 지금까지는 docling/unstructured 를 타고 들어오는
    # 전이 의존이었고, 그쪽이 끊기면 조용히 깨진다(#363 08).
    "openpyxl>=3.1.5",          # processing/converters/xlsx_processor
    "beautifulsoup4>=4.12",     # processing/converters/html_flatten
    "pandas>=2.2",              # facade 훅에서 격자를 다룰 때 쓰라고 안내한다
    # tabulate(docling-core 의 표 마크다운 직렬화)가 한글 등 전각 문자의 표시 폭을 계산할 때 쓴다.
    # 없으면 전각 문자를 1칸으로 세어 표 열 정렬이 달라진다. dev 그룹(ipykernel → prompt-toolkit)의
    # 전이 의존으로만 들어와 로컬·CI 와 운영 이미지의 출력이 달랐으므로 직접 선언한다.
    # 상한은 동작을 확인한 0.2.x 다. 0.9 이후는 검증하지 않았다.
    "wcwidth>=0.2.14,<0.3",
    'wand',
    'grpcio',
    'grpcio-tools',
    # docling/models/ocr_pb2.py 가 import 시 protobuf gencode 6.31.1 이상을 검사한다. 지금까지는
    # grpcio-tools 를 타고 들어오는 전이 의존이라 선언하지 않았다. 6.33.6 은 보안 수정본 하한이다.
    "protobuf>=6.33.6,<8",
    "fastapi>=0.115.12",
    "pymupdf>=1.26.4",
    "pydub>=0.25.1",
    "langchain>=1.2.10",
    "langchain-core>=1.2.11",
    "langchain-community>=0.4.1",
    "numpy>=2.3.4",
    "markdown2>=2.5.4",
    "audioop-lts; python_version >= '3.13'",
    # CVE-2025-64512: pdfminer.six 20250506 취약, 수정본 20251107 로 상향(날짜 버전이라 정확 고정).
    # PYSEC-2026-1761: 20251107 에도 취약점이 보고되어 수정본 20251230 으로 다시 상향.
    "pdfminer-six==20251230",
    "docling",
    "hatchling>=1.27.0",
    "pi-heif==0.22.0",
    "unstructured-inference>=1.2.0",
    "pdf2image==1.17.0",
    "unstructured-pytesseract==0.3.15",
    "pytesseract==0.3.13",
    "opencv-python>=4.11.0.86",
    "numpy==2.3.4",
    "minio==7.2.20",
    # 전처리기 Temporal 워커(genon/preprocessor/worker). 코드서빙 base 이미지와 같은 버전으로 고정한다
    # (build-script/code-serving-doc-parser/pyproject.toml).
    "temporalio==1.34.0",
]

[dependency-groups]
dev = [
    "pre-commit~=3.7",
    "mypy~=1.10",
    "types-setuptools~=70.3",
    "pandas-stubs~=2.1",
    "types-openpyxl~=3.1",
    "types-requests~=2.31",
    "boto3-stubs~=1.37",
    "types-urllib3~=1.26",
    "types-tqdm~=4.67",
    "coverage~=7.6",
    "pytest~=8.4.2",
    "pytest-cov>=6.1.1",
    "pytest-dependency~=0.6",
    "pytest-xdist~=3.3",
    "ipykernel~=6.29",
    "ipywidgets~=8.1",
    "nbqa~=1.9",
    "python-semantic-release~=7.32",
    "pytest-asyncio>=1.2.0",
    "apted>=1.0.3"
]

[tool.uv]
# CVE-2026-23949(jaraco.context 5.3.0), CVE-2026-24049(wheel 0.45.1): venv setuptools 의 _vendor 패치본 하한 81.0.0.
# 상한은 다음 메이저 전.
constraint-dependencies = ["setuptools>=81,<85"]

[tool.uv.sources]
docling = [
    { path = "../.." }
]

[tool.hatch.build.targets.sdist]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel.sources]
"src/**/*" = "*"
"*.json" = "*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m \"not update_baseline\""
markers = [
    "smoke: 핵심 경로가 죽지 않는지 빠르게 확인하는 smoke 테스트",
    "unit: 격리된 함수/클래스 단위 테스트",
    "regression: baseline과 비교하여 회귀를 감지하는 테스트",
    "update_baseline: baseline 데이터를 (재)생성하는 유틸리티 (일반 실행에서 제외)",
]

[tool.hatch.metadata]
allow-direct-references = true  # Direct reference 허용
