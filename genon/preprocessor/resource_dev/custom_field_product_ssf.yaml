# CustomFieldsEnricher 외부 config — 상품설명서(화재) 문서 단위 메타데이터 추출
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: product_ssf
#       extractor: llm
#       config_file: custom_field_product_ssf.yaml   # resource_path 자동 = 이 yaml 디렉토리
#
# 원천: ssf_rag_adpr_yyyymmdd_xxxxx_001.md (S3://os-tifa-ssf/FAO/ADPR)
#
# MD 표준안(상품 시트 "표준안 GPT 5.6 sol"):
#   frontmatter(file / document_type / source_file / source_pages / author / created_at /
#               conversion_note)
#   → `# {상품명} 상품요약서`
#   → `## 핵심 키워드`
#   → `## 문서 개요`      (샘플에 따라 `## 목차` 로 오기도 한다 — 문서 개요로 통일 요청됨)
#   → `## 내용 색인`
#   → `원문 전사` / `원문 N쪽 - {소제목}`
#
# PRODUCT_C(상품코드)는 NOT NULL 인데 MD frontmatter 에 상품코드가 없다.
#    파일명 `ssf_rag_adpr_yyyymmdd_xxxxx_001.md` 의 xxxxx 자리인지 원천 담당 확인 필요.
#    확정 전까지는 LLM 이 본문에서 찾도록 두고, 못 찾으면 null 로 남는다(적재 시 걸린다).
#
# 이 파일 하나로 자족한다 — 프롬프트가 아래에 인라인되어 있어 별도 md 파일이 없다.

# ── Markdown 원천 전처리 ─────────────────────────────────────────────────────
markdown:
  front_matter:
    metadata_fields:
      document_type: document_type
      source_file: source_file
      source_pages: source_pages
      author: author
      created_at: created_date
    exclude_text_fields: ["*"]
    # metadata_fields 는 적재 필수값이라 front matter 가 없는 md 는 조용히 넘기지 않는다.
    on_missing: warn
  # PDF 레이아웃 보존용 ```text 펜스를 논리 단위(Q/A/불릿/※) 단락으로 되돌린다.
  # 안 하면 docling 이 펜스 본문 전체를 CodeItem 하나로 만들어(실측 4654자 → 아이템 1개)
  # chunk_size 가 무의미해진다. 레이아웃 파이프 줄 제거도 함께 한다 — md 백엔드는 `|` 한 줄로
  # 표 모드에 들어가 뒤따르는 본문을 빈 표로 삼킨다(실측 본문 1586자 소실).
  text_fence:
    enable: true
    langs: ["", "text"]      # 변환 대상 정보문자열. 진짜 코드 펜스(python 등)는 손대지 않는다
    min_hangul_ratio: 0.3    # 본문 한글 비율 하한 — 코드 블록 오변환 방지

# ── LLM 연결 ────────────────────────────────────────────────────────────────
# <ENRICHMENT_SERVING_ID>: Genos에 등록한 모델서빙 ID로 변경 필요. api_key 도 배포 시 설정.
url: "https://genos.genon.ai/api/gateway/rep/serving/752/v1/chat/completions"
api_key: "d1a9e0acab6243019008a96cd8af868e"
model: model

# ── LLM 생성 파라미터 ────────────────────────────────────────────────────────
# 상품요약서는 원문이 수십 쪽이라 입력이 길다. 출력은 요약본문 위주라 4000 이면 충분하다.
max_tokens: 4000
temperature: 0.0
timeout: 300

# ── 입력 페이지 범위 ─────────────────────────────────────────────────────────
# 미지정(null) → 문서 전체(`## 핵심 키워드`·`## 문서 개요`·원문 전사 전체)를 대상으로 한다.
pages: null

# ── 파서 ─────────────────────────────────────────────────────────────────────
parser:
  type: json

# ── 소스와 무관하게 고정으로 채울 값 ────────────────────────────────────────
# 화재 전용 원천이라 고객사가 파일 단위로 고정이다. LLM 에게 상수를 받아쓰게 시키지 않는다.
constants:
  GROUP_C: "SSF"
  SALE_STATUS: "ON_SALE"

# ── 프롬프트 ─────────────────────────────────────────────────────────────────
system_prompt: |
  너는 보험 상품요약서 정보추출 전문가다. 주어진 상품요약서 문서에서 요청한 필드를 정확하게 추출한다.

  규칙:
  - 반드시 하나의 JSON 객체만 반환한다. 설명 문구·마크다운 코드펜스 없이 순수 JSON 만 출력한다.
  - 요청된 4개 키를 모두 포함한다. 문서에서 근거를 찾을 수 없는 값은 null 로 둔다.
  - 문서에 없는 정보를 지어내지 않는다(환각 금지). 금액·기간·비율·나이는 원문 숫자를 그대로 쓴다.

  필드별 형식:
  - `PRODUCT_C`: 상품코드 문자열. frontmatter 나 본문에 상품코드/약관코드가 있으면 그 값.
    없으면 null 로 둔다(상품명을 코드처럼 지어내지 않는다).
  - `PRODUCT_NM`: 상품명 문자열. 문서 제목(H1)의 상품명을 쓰되 "상품요약서" 같은 문서종류
    표기는 뺀다. 예: "# 삼성 s교통상해보험(2501)(무배당) 상품요약서" → "삼성 s교통상해보험(2501)(무배당)".
    반드시 채운다.
  - `PRODUCT_ATTRS`: 구조화 속성 JSON 객체. 아래 키만 쓰고, 근거가 없는 키는 넣지 않는다.
      - `insurance_type`  : 보험종목(예: "상해보험", "건강보험") 문자열
      - `dividend_type`   : "무배당" 또는 "유배당"
      - `join_age`        : 가입나이 표기 문자열(예: "만 15세 ~ 70세")
      - `insurance_period`: 보험기간 표기 문자열
      - `payment_period`  : 납입기간 표기 문자열
      - `coverages`       : 주요 보장 항목 문자열 배열(3~10개). 지급사유 소제목을 쓴다.
      - `exclusions`      : 주요 면책·유의사항 문자열 배열(0~5개)
  - `SUMMARY_TEXT`: 검색용 임베딩에 넣을 요약본문 문자열.
    이 상품이 누구를 대상으로 어떤 위험을 보장하는지, 대표 지급사유와 가입 조건, 유의사항을 담는다.
    문장형 한국어로 5~10문장, 1500자 이내. 불릿·머리기호를 쓰지 않는다.
    표의 항목명만 나열하지 말고 문장으로 풀어 쓴다.

  출력 예시 형식(값은 예시):
  {"PRODUCT_C": null, "PRODUCT_NM": "삼성 s교통상해보험(2501)(무배당)", "PRODUCT_ATTRS": {"insurance_type": "상해보험", "dividend_type": "무배당", "coverages": ["교통상해 사망", "교통상해 후유장해"]}, "SUMMARY_TEXT": "교통사고로 인한 상해를 보장하는 무배당 상해보험으로 …"}

user_prompt: |
  아래 보험 상품요약서에서 다음 4개 필드를 추출하라.

  - PRODUCT_C (상품코드)
  - PRODUCT_NM (상품명) — 필수
  - PRODUCT_ATTRS (구조화 속성 객체)
  - SUMMARY_TEXT (요약본문, 임베딩 입력)

  반드시 위 4개 키를 모두 가진 하나의 JSON 객체로만 반환하라.

  <document>
  {{raw_text}}
  </document>

# ── 출력 필드 (프롬프트의 JSON 키와 일치해야 함) ──────────────────────────────
output_fields:
  - PRODUCT_C
  - PRODUCT_NM
  - PRODUCT_ATTRS
  - SUMMARY_TEXT
