format_options:
  pdf:
    pipeline_options: pdf
    backend: pypdf
    generate_picture_images: true

    # genos_layout: dots-OCR (GENOS_LAYOUT) 레이아웃 모델 설정
    # 기본값(DOCLING_LAYOUT) 대신 dots-mocr VLM으로 PDF 레이아웃 분석
    # genos_layout:
    #   endpoint: "http://192.168.75.174:26001/v1/chat/completions"
    #   api_key: ""                  # API 키 (없으면 빈 문자열)
    #   model: "dots-mocr"           # 기본값, 변경 불필요
    #   max_completion_tokens: 6000  # 기본값
    #   timeout: 3600                # 기본값 (초)
    #   retry_count: 2               # 기본값
    #   page_batch_size: 32          # 한 번에 처리할 페이지 수

    # do_picture_description: Docling 파이프라인 내에서 이미지 설명 생성 (로드 중 처리)
    # 결과는 item.meta.description.text 에 저장됨
    do_picture_description:
      api:
        url: null
        prompt: "이미지를 간결하고 정확하게 설명하세요. 텍스트가 포함된 경우 그대로 인용하고, 도표·그래프는 수치와 항목을 포함해 설명하세요."
        timeout: 60
        concurrency: 2

    ocr:
      paddle:
        # PaddleOCR 설정 (원격 서버 방식)

        # ── 공통 옵션 (모든 엔진) ────────────────────────────────────────────────────
        force_full_page_ocr: true

        lang:
          - korean

        bitmap_area_threshold: 0.05

        # ── PaddleOCR 전용 옵션 ───────────────────────────────────────────────────────
        # ocr_endpoint: PaddleOCR 서버 주소 (필수)
        ocr_endpoint: "http://doc-parser-ocr-deployment:8080/ocr"

        # text_score: 인식 결과 신뢰도 임계값, 미만은 버림 (기본 0.5)
        text_score: 0.3

        # timeout: 서버 응답 대기 시간 (초, 기본 60)
        timeout: 60
      # easy:
      #   # EasyOCR 설정
      #     # https://www.jaided.ai/easyocr/

      #     # ── 공통 옵션 (모든 엔진) ────────────────────────────────────────────────────
      #     # force_full_page_ocr
      #     #   true  : 텍스트 레이어 유무와 무관하게 전체 페이지를 이미지로 취급해서 OCR
      #     #   false : Docling이 bitmap으로 판단한 영역만 OCR
      #     #           (비트맵이 페이지의 75% 이상이면 자동으로 전체 페이지 OCR로 전환)
      #     force_full_page_ocr: true

      #     # lang: EasyOCR 언어 코드 목록
      #     # https://www.jaided.ai/easyocr/ 에서 지원 언어 확인
      #     lang:
      #       - ko
      #       - en

      #     # bitmap_area_threshold: OCR 대상으로 판단할 최소 비트맵 면적 비율 (기본 0.05 = 5%)
      #     # 이 비율 미만의 비트맵은 OCR 대상에서 제외됨
      #     bitmap_area_threshold: 0.05

      #     # ── EasyOCR 전용 옵션 ─────────────────────────────────────────────────────────
      #     # use_gpu: GPU 사용 여부 (null이면 환경에 따라 자동 감지)
      #     use_gpu: false

      #     # confidence_threshold: 인식 결과 신뢰도 임계값, 미만은 버림 (기본 0.5)
      #     confidence_threshold: 0.5

      #     # model_storage_directory: 모델 파일 저장 경로 (null이면 기본 캐시 경로)
      #     model_storage_directory: null

      #     # recog_network: 인식 네트워크 종류 (기본 "standard")
      #     recog_network: standard

      #     # download_enabled: 모델 자동 다운로드 허용 여부 (기본 true)
      #     download_enabled: true
  docx:
    pipeline_options: simple
    backend: msword
  md:
    pipeline_options: simple
    backend: md
  html:
    pipeline_options: simple
    backend: html
  hwpx:
    pipeline_options: simple
    backend: hwpx
    # TODO: 사이냅스, hwp sdk, rhwp, libreoffice, 자유소프트, 한컴데이터로더
  pptx:
    pipeline_options: simple
    backend: mspowerpoint

chunker:
  name: smart
  tokenizer: char
  # miniLM | char
  max_tokens: 1024

enrichers:
  - toc_enricher:
      url: null
      api_key: null
      model: model
      temperature: 0.0
      top_p: 0.00001
      seed: 33
      max_tokens: 10000

      system_prompt: |
        You are an expert at generating table of contents (목차) from Korean documents. You specialize in regulatory documents, terms of service, contracts, and mixed-format documents that combine formal regulatory structures with general section headers.

      user_prompt: |
        Here is the Korean document you need to analyze:

        <document>
        {raw_text}
        </document>

        Your task is to extract and organize all structural elements from this document into a hierarchical table of contents. Korean documents often have mixed structures where some sections follow formal regulatory patterns (제x장/절/관/조) while others use general section numbering and headers.

        ## Analysis Process

        Before generating the final table of contents, work through the document systematically in `<analysis>` tags. It's OK for this section to be quite long. Follow these steps:

        1. **Document Title Extraction**: Quote the main document title exactly as it appears at the beginning of the document.

        2. **Structural Marker Identification**: Scan through the document and quote all the key structural markers you find, such as:
          - Formal regulatory patterns: 제x장, 제x절, 제x관, 제x조
          - General section patterns: numbered headers (1., 2., etc.), lettered headers (가., 나., etc.)
          - Special sections: 부칙, 별지, 별표, etc.

        3. **Systematic Section Extraction**: Work through the document from beginning to end, extracting each structural element in order:
          - For each main section, quote the exact title as it appears
          - For each subsection, quote the exact title and note which main section it belongs under
          - For each article/item, quote the exact title and note its parent section
          - Include any appendices, attachments, and addenda

        4. **Hierarchy Building**: For each extracted element, explicitly note:
          - What level it should be at (main section, subsection, sub-subsection, etc.)
          - What its parent section is (if any)
          - What numbering it should receive in the final TOC (1., 1.1., 1.1.1., etc.)

        5. **Structure Verification**: Review your extracted elements to ensure:
          - All structural elements are captured in document order
          - The hierarchy makes logical sense
          - No elements are duplicated or missed

        ## Output Requirements

        After your analysis, generate the table of contents with this exact format:

        ```
        <toc>
        TITLE:<document title>
        1. <first main section title>
        1.1. <first subsection title>
        1.1.1. <first sub-subsection title>
        1.2. <second subsection title>
        2. <second main section title>
        2.1. <subsection under second main section>
        3. <third main section title>
        </toc>
        ```

        ## Formatting Guidelines

        - Start with `TITLE:` followed by the document title
        - Use hierarchical decimal numbering (1, 1.1, 1.1.1, etc.)
        - Follow each number with a space and the original title exactly as it appears
        - Maintain the document's logical hierarchy
        - Include appendices, attachments, and addenda as separate top-level items
        - Extract titles exactly as they appear - do not include explanatory content
        - Handle both formal regulatory structures and general section headers
        - Wrap the entire table of contents in `<toc></toc>` tags

  - extract_metadata_enricher:
      url: null
      api_key: null
      model: model
      temperature: 0.0
      top_p: 0.00001
      seed: 33
      max_tokens: 10000

postprocessors:
  - subject_extractor:
      url: null
      api_key: null
      model: null
      max_chars: 12000
      max_tokens: 2000
      temperature: 0.0
      timeout: 60
      system_prompt: |
        # 역할
        당신은 제공된 문서의 핵심 내용을 정확히 파악하고 지정된 기준에 따라 분류하는 '문서 분석 및 분류 전문가'입니다.

        # 목표
        입력된 문서를 분석하여, 전체 내용을 포괄하는 요약된 주제(subject)와 문서의 유형(category), 그리고 문서 제목(title)을 JSON 형식으로 추출하십시오.

        # 요구사항 (규칙)
        1. 주제(subject) 작성 규칙
        핵심 내용 추출: 문서 전체를 분석하여 핵심 목적과 주요 내용을 300자 이내의 완성된 문장형으로 작성하십시오.
        제작처 명시 (필수): 문구 서두에 해당 문서의 제작 주체(예: 금융사, 보험사명 등)를 반드시 포함하십시오.
        작성 패턴: "이 문서는 [제작처]에서 작성된 문서로, [주요 내용]을 설명하고 있습니다."
        식별 불가 시 처리: 로고, 하단 저작권 표기, 문맥상 발행처 등을 확인했음에도 제작처를 특정할 수 없는 경우에만 "제작처 미상" 또는 "제작처 확인 불가" 문구를 포함하십시오.

        2. 카테고리(category) 분류 규칙
        분류 기준: 다음 3가지 중 문서의 성격에 가장 부합하는 값 하나만 정확히 출력하십시오.
        산출방법서: 보험료, 책임준비금, 해약환급금 등의 수식, 산출 기초지수, 계산 로직이 포함된 경우.
        약관: 보험계약의 권리/의무, 보장 내용, 지급 제한 사유 등 법률적/계약적 조항이 중심인 경우.
        기타: 위 두 항목의 특성이 명확하지 않거나 안내서, 상품설명서, 홍보물 등에 해당하는 경우.

        3. 문서 제목(title) 작성 규칙
        추출 및 정제: 표지나 최상단에서 확인되는 공식 명칭을 추출하되, 줄바꿈/특수문자/불필요한 공백은 제거하십시오.
        구체성 확보: "보험약관", "안내서" 같은 일반 명사 대신, 상품명과 버전(무배당, 갱신형 등)을 반드시 포함하여 구체적으로 작성하십시오.
        카테고리명 제외 로직 (중요): 앞서 선택한 [category] 값이 제목에 포함되어 있다면 이를 삭제하고 상품명 중심으로 작성하십시오.
        제목 생성: 문서 내 명확한 제목이 없는 경우, 핵심 상품명과 문서 성격을 조합하여 30자 이내의 직관적인 제목을 직접 생성하십시오.

        # 출력 형식 (Strict JSON)
        - 마크다운 코드 블록 등 다른 설명은 일절 포함하지 말고, 오직 아래의 JSON 객체 포맷만 출력하십시오.

        {
          "subject": "제작처가 포함된 300자 이내의 주제 요약 내용",
          "category": "산출방법서" or "약관" or "기타",
          "title": "추출 또는 생성된 해당 문서의 제목"
        }
  - table_refiner:
      url: null
      api_key: null
      batch_size: 5
      system_prompt: |
        당신은 'HTML 테이블 복원 전문가(Table Reconstruction Expert)'입니다.
        입력으로 제공되는 테이블 이미지를 검색/RAG에 적합한 **읽기 쉬운 HTML fragment**로 변환하는 것이 역할입니다.

        ### 출력 형식 (절대 규칙)
        1. 결과는 반드시 HTML fragment여야 합니다. Markdown table, 코드블록, ```html fence, 설명 문장은 절대 출력하지 않습니다.
        2. 사용할 수 있는 태그는 `<p>`, `<h4>`, `<table>`, `<thead>`, `<tbody>`, `<tr>`, `<th>`, `<td>`, `<br>`입니다. 필요한 경우 `<th>`/`<td>`에는 `rowspan`, `colspan` 속성을 사용할 수 있습니다.
        3. 표 데이터는 반드시 `<table>`로 출력합니다.
        4. 셀 안 줄바꿈은 `<br>`로 표현합니다.
        5. 셀 텍스트에 원본 파이프 기호(`|`)가 있으면 HTML에서는 그대로 두지 말고 가운뎃점(`·`)으로 치환합니다.

        ### 구조 복원 규칙
        1. 표가 단순하면 하나의 HTML `<table>`로 출력합니다.
        2. 표 안에 표가 들어간 중첩 표, 다단 헤더, 큰 rowspan/colspan, 페이지 이어짐 표라면 **하나의 큰 격자로 억지 변환하지 말고**, 문맥 `<p>` + 여러 개의 작은 `<table>`로 분해합니다.
        3. 왼쪽/상단의 큰 병합셀은 반복 컬럼으로 만들지 말고 문맥 `<p>`로 분리합니다.
        4. 내부 표의 실제 컬럼명이 보이면 그 컬럼명을 사용합니다.
        5. `[1] 기본형`, `[2] 확장형`처럼 표 내부의 섹션 구분자는 `<h4>`로 분리합니다.
        6. 셀의 텍스트는 생략하거나 요약하지 말고 그대로 재현합니다.
        7. 내용이 비어 있는 셀이 있다면 빈 `<td></td>` 또는 `<td>-</td>`로 유지하세요.
        8. 결과에는 원본에 없는 `하위1`, `하위2`, `구분 1`, `구분 2` 같은 임시 컬럼명을 만들지 않습니다.
  - table_description:
      url: null
      api_key: null
      model: null
      max_tokens: 500
      temperature: 0.0
      timeout: 60
      batch_size: 5
      max_table_chars: 3000
      system_prompt: |
        당신은 문서 이해 전문가입니다. 주어진 표를 분석하여 핵심 내용을 한국어로 한 줄(50자 이내)로 설명하세요. 설명 문장만 출력하고 다른 내용은 출력하지 마세요.
      prompt: |
        다음 표의 핵심 내용을 한국어로 한 줄(50자 이내)로 설명하세요.
        문서 주제: {subject}

        {table_text}
  - enhanced_image_description:
      url: null
      api_key: null
      model: null
      max_tokens: 5000
      temperature: 0.1
      timeout: 120
      batch_size: 3
      prompt: |
        당신은 RAG(검색 증강 생성) 시스템을 위한 **전문 데이터 분석가이자 이미지 설명 전문가**입니다.
        당신의 목표는 주어진 문서의 주제를 참고하여 이미지를 보지 못한 사람(혹은 검색 알고리즘)이 이미지의 모든 정보를 완벽하게 이해하고 검색할 수 있도록 구조화된 텍스트를 생성하는 것입니다.

        제공된 이미지를 분석하여 아래의 [지침]에 따라 핵심 설명만을 작성해 주세요.

        문서의 주제 : {subject}

        # [지침]
        ### [작성 규칙]

        1. **한 문장 요약**: 이미지의 종류(도표, 사진, UI 등)와 핵심 주제를 한 줄로 서술.
        2. **핵심 요소 (Bullet Point)**: 이미지 내의 주요 객체, 텍스트, 상태 정보를 3~5개 이내로 요약.
        3. **원문 보존**: 이미지 안에 보이는 제목, 축/열 이름, 라벨, 수치, 단위, 범례, 주석은 가능한 한 원문 그대로 적습니다.
        4. **불확실성 표시**: 흐리거나 잘린 글자는 추정하지 말고 "판독 불가" 또는 "일부 판독 불가"로 표시합니다.
        5. **불필요한 수식어 금지**: "이미지는 ~를 보여줍니다" 같은 문구 없이 팩트 위주로 기술.

        6. **차트/테이블 데이터 변환 (Chart to Markdown)**:
           - 이미지에 차트(막대, 선, 파이 등)나 표가 포함되어 있다면, 이를 **반드시 마크다운 테이블(Markdown Table)** 형식으로 변환하세요.
           - 수치가 명시되어 있지 않은 경우에만 축 눈금을 보고 근사치를 추정하고, 비고에 "추정"이라고 표시하세요.
           - 단위, 기준시점, 주석이 보이면 데이터와 함께 보존하세요.
           - 데이터 테이블 작성 후, 확인 가능한 범위에서 추세, 최고/최저점, 주요 차이만 간략히 덧붙이세요.

        ### [출력 형식]

        # 이미지 설명
        (이미지 전체 요약 내용)

        # 데이터 구조화 (차트/표)
        (차트가 있을 경우만 작성, 없을 경우 '해당 없음' 표기)

        | 항목 (X축) | 값 (Y축) | 비고 |
        | :--- | :--- | :--- |
        | 데이터 1 | 100 | ... |
        | 데이터 2 | 200 | ... |




log_level: 4
