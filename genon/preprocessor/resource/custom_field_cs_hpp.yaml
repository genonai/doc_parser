# CustomFieldsEnricher 외부 config — 고객센터(카드) 문서 단위 메타데이터 추출
#
# 사용 (parser_processor_config.yaml):
#   - custom_fields:
#       enable: true
#       doc_type: cs_hpp
#       extractor: llm
#       config_file: custom_field_cs_hpp.yaml   # resource_path 자동 = 이 yaml 디렉토리
#
# 원천: ssc_rag_adcc_yyyymmdd_delta_001.html (/data/raw/XXX/ADCC, 원천구분 "이중화")
#
# 생명/화재(xlsx 행 매핑)와 달리 카드 고객센터는 html 문서로 온다. 행 단위 원천이 아니므로
# 문서 단위 LLM 추출(extractor=llm)을 쓴다 — 결과는 문서 전역 metadata 로 실려 모든 청크에 붙는다.
#
# 확인 필요: html 1건에 고객센터 항목이 여러 건 들어 있다면 이 방식으로는 항목별 metadata 를
#    실을 수 없다(문서 전역 1세트만 나온다). 그 경우 원천을 항목별 파일로 쪼개 받거나,
#    json 으로 받아 json_mapping(custom_field_cs_sss.yaml 방식)으로 처리해야 한다.
#
# 이 파일 하나로 자족한다 — 프롬프트가 아래에 인라인되어 있어 별도 md 파일이 없다.
# ── HTML 원천 전처리 ────────────────────────────────────────────────────────
# 이 원천은 화면상 계층을 h태그가 아니라 도형 마커(◈ 시행일자 / ▣ 이용방법 / ■ 등록방법)로만
# 표현한다. h태그가 h1 하나뿐이라 docling 이 섹션헤더를 0개 만들고, 청커가 섹션 경계를 잃어
# 청크가 크기로만 절단되며 모든 청크의 HEADER 접두어가 문서 제목 하나로 같아진다
# (실측 6청크 전부 "HEADER: [AI 에이전트용]"). 아래를 켜면 표 밖 마커 소제목을 heading 으로
# 승격한다. 마커 목록·레벨·길이 상한은 근거 주석과 함께 코드 상수로 둔다
# (processing/converters/html_flatten.py 의 "마커만으로 계층을 표현한 문서" 절).
# ── LLM 연결 ────────────────────────────────────────────────────────────────
# 접속 정보는 프로세서 설정 최상위 model_presets 에 모아 두고 여기서는 이름만 부른다.
# 이 항목만 다른 모델을 쓰려면 url/api_key/model 을 직접 적는다(직접 적은 값이 이긴다).
# ── LLM 생성 파라미터 ────────────────────────────────────────────────────────
# ── 입력 페이지 범위 ─────────────────────────────────────────────────────────
# 미지정(null) → 문서 전체를 대상으로 한다.
# ── 파서 ─────────────────────────────────────────────────────────────────────
# ── 소스와 무관하게 고정으로 채울 값 ────────────────────────────────────────
# 카드 전용 원천이라 고객사가 파일 단위로 고정이다. LLM 에게 상수를 받아쓰게 시키지 않는다.
# ── 프롬프트 ─────────────────────────────────────────────────────────────────
# ── 청크 본문과 같은 값을 실을 필드 ─────────────────────────────────────────
# 여기 올린 필드는 청크마다 그 청크의 본문(text)과 글자 그대로 같은 값을 받는다.
# 값은 청커가 헤더 접두·마스킹·정제까지 끝난 뒤에 채우므로 프롬프트/output_fields 에는
# 넣지 않는다. 이 설정 자체는 청크에 실리지 않는다.
#
# CONTENT 는 소비계층의 검색 대상 본문 컬럼이다. 예전에는 LLM 이 문서 단위로 재작성했는데
# 값이 문서당 하나뿐이라 모든 청크에 같은 문자열이 붙었고(청크 단위 검색이 엉뚱한 청크를
# 집는다), 숫자 표기도 원문과 어긋났다("2015년 6월 25일" → "2015 년 6 월 25 일").
# 본문으로 채우면 두 문제가 함께 사라지고 응답 토큰도 그만큼 줄어든다.
# ── 출력 필드 (프롬프트의 JSON 키와 일치해야 함) ──────────────────────────────
# SUMMARY_TEXT 는 이 경로에서 만들지 않는다 — 문서 단위 추출이라 청크 본문이 문서 원문
# 그대로이고, 임베딩 입력도 그 본문이다. 항목별 요약이 필요해지면 원천을 항목 단위로
# 받아 json_mapping + llm_fields 로 전환한다(custom_field_cs_sss.yaml 참고).
# ── 청크 본문 앞에 얹을 메타 필드 ────────────────────────────────────────────
# 문서 단위 값이라 metadata 컬럼에만 두면 필터 검색에만 걸리고 임베딩 검색에는 안 걸린다.
# 청크 본문에 실어야 "카드 결제 취소 문의" 같은 질의가 그 문서의 청크를 집는다.
#
#   chunk_prefix_fields : 모든 청크 앞에 반복 (매 청크가 단독으로 검색돼야 하는 식별자)
#   first_chunk_fields  : 문서의 첫 청크에만 1회
#
# CS_CATEGORY 는 문의유형 분류다. 매 청크에 반복하기엔 chunk_size 가 아까워 1회만 넣는다 —
# 대신 카테고리를 임베딩으로 검색하면 첫 청크만 걸린다(값 자체는 모든 청크의 metadata 에
# 그대로 실리므로 필터 검색은 전 청크에서 된다).

schema: v2
# 고객센터(카드) 문서구조 v2
source:
  kind: records
  on_missing: error
fields:
  BIZ_ID:
    alias: [ID, id]
    default: null
  GROUP_C:
    alias: [회사명, company, corp_code]
    const: HPP
    values:
      IFP: [모니모]
      SLF: [삼성생명, 생명]
      SSF: [삼성화재, 화재]
      HPP: [삼성카드, 카드]
      SSS: [삼성증권, 증권]
  CS_CTGR_L1:
    alias: [ORN_NM, 대분류]
    default: null
  CS_CTGR_L2:
    alias: [LV2_THEMA_TERY_NM, 중분류]
    default: null
  CS_CTGR_L3:
    alias: [소분류]
    default: null
  TITLE:
    alias: [TIT_NM, 제목, 대표질문]
  CONTENT:
    alias: [CONT, 안내본문, 답변]
    transform: html_text
  RELATED_KEYWORDS:
    alias: [KEYW_LIS]
    default: null
    transform: [{name: to_json, key: "KEYW_LIS"}]
  DEEP_LINK_URL:
    alias: [딥링크, 앱 딥링크]
    default: null
  SRC_LAST_MOD_DT:
    alias: [UD_DTM]
    default: null
require:
  fields: [TITLE]
body:
  fields: [CS_CTGR_L1, TITLE, CONTENT]
  labels:
    CS_CTGR_L1: 문의유형
    TITLE: 제목
    CONTENT: 내용
  split: true
  repeat: [CS_CTGR_L1, TITLE]
